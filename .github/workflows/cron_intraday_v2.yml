name: VNStock Intraday V2

on:
  schedule:
    # V2 pipeline độc lập — không phụ thuộc V3
    # Chạy cùng giờ với V3 (hoặc lệch nhẹ nếu muốn tránh API rate limit)
    - cron: '30 2 * * 1-5'   # 09:30 ICT
    - cron: '30 3 * * 1-5'   # 10:30 ICT
    - cron: '30 4 * * 1-5'   # 11:30 ICT
    - cron: '30 6 * * 1-5'   # 13:30 ICT
    - cron: '30 7 * * 1-5'   # 14:30 ICT ← record predictions
  workflow_dispatch:
    inputs:
      force_record:
        description: 'Ep ghi predictions ke ca ngoai gio (de test)'
        type: boolean
        default: false

permissions:
  contents: write

# Group riêng — không block/bị block bởi vnstock-intraday (V3)
concurrency:
  group: vnstock-intraday-v2
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # V2 fetch data riêng → tương đương V3

    env:
      VNSTOCK_API_KEY:     ${{ secrets.VNSTOCK_API_KEY }}
      VNSTOCK_DEVICE_ID:   ${{ secrets.VNSTOCK_DEVICE_ID }}
      VNSTOCK_INTERACTIVE: "0"
      VNSTOCK_LANGUAGE:    en
      VNSTOCK_VENV_PATH:   /opt/vnstock/.venv
      HOME:                /home/runner
      MPLCONFIGDIR:        /home/runner/.config/matplotlib

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Dùng cùng cache key với V3 — venv đã có sẵn
      - name: Get week number
        id: date
        run: echo "week=$(date +'%Y-W%V')" >> $GITHUB_OUTPUT

      - name: Cache vnstock venv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: /opt/vnstock/.venv
          key: vnstock-stable-v4-${{ steps.date.outputs.week }}

      - name: Fallback install if cache miss
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv /opt/vnstock/.venv
          source /opt/vnstock/.venv/bin/activate
          pip install --upgrade pip
          pip install vnstock pandas numpy

      - name: Ensure latest vnstock packages
        run: |
          VENV_PIP="/opt/vnstock/.venv/bin/pip"
          if [ ! -x "$VENV_PIP" ]; then
            echo "⚠️ Venv pip not found — skipping"
            exit 0
          fi
          $VENV_PIP install --upgrade vnstock 2>&1 | tail -3 || true

      # ──────────────────────────────────────────────────────────────────
      # V2 PIPELINE — hoàn toàn độc lập với V3
      # Fetch data riêng → output files riêng (_v2 suffix)
      # Context + News dùng chung (daily, không intraday)
      # ──────────────────────────────────────────────────────────────────
      - name: Step Snapshot V2 — Ranking + Deep
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          mkdir -p /home/runner/.config/matplotlib
          /opt/vnstock/.venv/bin/python steps/step_snapshot_v2.py

      - name: Step Order Flow V2
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          /opt/vnstock/.venv/bin/python steps/step_order_flow_v2.py

      - name: Step Scoring V2 (weighted normalized)
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          /opt/vnstock/.venv/bin/python steps/step_scoring_v2.py

      - name: Step Price Levels V2
        run: |
          /opt/vnstock/.venv/bin/python steps/step_price_levels_v2.py

      - name: Step Record Predictions V2 (forward log)
        env:
          FORCE_RECORD: ${{ inputs.force_record && '1' || '' }}
        run: |
          /opt/vnstock/.venv/bin/python steps/step_record_predictions_v2.py

      # ──────────────────────────────────────────────────────────────────
      # COMMIT — chỉ add v2 files, không đụng v3
      # ──────────────────────────────────────────────────────────────────
      - name: Commit V2 output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            output/deep_raw_v2.json \
            output/deep_v2.json \
            output/deep_v2.csv \
            output/ranking_v2.json \
            output/ranking_v2.csv \
            output/order_flow_v2.json \
            output/signals_v2.json \
            output/signals_v2.csv \
            output/trade_levels_v2.json \
            output/trade_levels_v2.csv \
            output/history/predictions_v2/ \
            2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit — skipping."
            exit 0
          fi

          git commit -m "data[v2]: $(date +'%Y-%m-%d %H:%M') ICT"

          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "✅ pushed (attempt $i)"
              pushed=1
              break
            fi
            echo "⚠️ push attempt $i failed — retrying..."
            sleep $((RANDOM % 5 + 3))
          done

          if [ "$pushed" -ne 1 ]; then
            echo "❌ push failed after 5 attempts"
            exit 1
          fi
