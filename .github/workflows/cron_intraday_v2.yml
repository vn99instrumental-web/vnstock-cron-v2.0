name: VNStock Intraday V2

on:
  schedule:
    - cron: '30 2 * * 1-5'   # 09:30 ICT
    - cron: '30 3 * * 1-5'   # 10:30 ICT
    - cron: '30 4 * * 1-5'   # 11:30 ICT
    - cron: '30 6 * * 1-5'   # 13:30 ICT
    - cron: '30 7 * * 1-5'   # 14:30 ICT
  workflow_dispatch:
    inputs:
      force_record:
        description: 'Ep ghi predictions ke ca ngoai gio (de test)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vnstock-intraday-v2
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      VNSTOCK_API_KEY:     ${{ secrets.VNSTOCK_API_KEY }}
      VNSTOCK_DEVICE_ID:   ${{ secrets.VNSTOCK_DEVICE_ID }}
      VNSTOCK_INTERACTIVE: "0"
      VNSTOCK_LANGUAGE:    en
      VNSTOCK_VENV_PATH:   /opt/vnstock/.venv
      HOME:                /home/runner
      MPLCONFIGDIR:        /home/runner/.config/matplotlib

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Cache config COPY Y CHANG từ cron_intraday.yml (V3) ──
      # Dùng cùng key → share cache với V3, không install lại
      - name: Compute cache key suffix (weekly)
        id: cache-suffix
        run: echo "week=$(date -u +%Y-W%V)" >> $GITHUB_OUTPUT

      - name: Restore vnstock cache
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: |
            /opt/vnstock/.venv
            /home/runner/.vnstock
          key: vnstock-stable-v4-${{ steps.cache-suffix.outputs.week }}
          restore-keys: |
            vnstock-stable-v4-

      # Fallback install đầy đủ nếu cache miss (copy từ V3)
      - name: Fallback install nếu cache miss
        if: steps.cache-venv.outputs.cache-hit != 'true'
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          pip install requests
          mkdir -p /home/runner/.vnstock
          wget -q https://vnstocks.com/files/vnstock-cli-installer.run \
            -O installer.run
          chmod +x installer.run
          ./installer.run -- \
            --non-interactive \
            --api-key "$VNSTOCK_API_KEY" \
            --venv-path "$VNSTOCK_VENV_PATH" \
            --language en
          wget -q https://vnstocks.com/files/generate_user_info.min.py \
            -O generate_user_info.min.py
          /opt/vnstock/.venv/bin/python generate_user_info.min.py \
            --api-key "$VNSTOCK_API_KEY"

      - name: Install extra dependencies
        run: |
          /opt/vnstock/.venv/bin/pip install -q gspread google-auth

      - name: Ensure latest vnstock packages
        run: |
          VENV_PIP="/opt/vnstock/.venv/bin/pip"
          if [ ! -x "$VENV_PIP" ]; then
            echo "⚠️ Venv pip not found at $VENV_PIP"
            exit 1
          fi
          echo "=== Venv OK ==="
          $VENV_PIP list 2>&1 | grep -iE "vnstock|vnai" || echo "(none found)"
          $VENV_PIP install --upgrade vnstock 2>&1 | tail -3 || true

      # ──────────────────────────────────────────────────────────────────
      # PATCH V3 files → V2 runtime files (sed đổi output filenames only)
      # Không maintain 2 file Python riêng
      # ──────────────────────────────────────────────────────────────────
      - name: Patch step_order_flow → step_order_flow_v2
        run: |
          sed \
            -e 's|load_json("deep_raw.json")|load_json("deep_raw_v2.json")|g' \
            -e 's|save_json("order_flow.json"|save_json("order_flow_v2.json"|g' \
            -e 's|ORDER FLOW DONE|ORDER FLOW V2 DONE|g' \
            steps/step_order_flow.py > steps/step_order_flow_v2_runtime.py
          grep -c "v2" steps/step_order_flow_v2_runtime.py
          echo "✅ Patched step_order_flow_v2_runtime.py"

      # ──────────────────────────────────────────────────────────────────
      # V2 PIPELINE
      # ──────────────────────────────────────────────────────────────────
      - name: Step Snapshot V2 — Ranking + Deep
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          mkdir -p /home/runner/.config/matplotlib
          /opt/vnstock/.venv/bin/python steps/step_snapshot_v2.py

      - name: Step Order Flow V2
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          /opt/vnstock/.venv/bin/python steps/step_order_flow_v2_runtime.py

      - name: Step Scoring V2 (weighted normalized)
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          /opt/vnstock/.venv/bin/python steps/step_scoring_v2.py

      - name: Step Price Levels V2
        run: |
          /opt/vnstock/.venv/bin/python steps/step_price_levels_v2.py

      - name: Step Record Predictions V2 (forward log)
        env:
          FORCE_RECORD: ${{ inputs.force_record && '1' || '' }}
        run: |
          /opt/vnstock/.venv/bin/python steps/step_record_predictions_v2.py

      # ──────────────────────────────────────────────────────────────────
      # COMMIT — chỉ add v2 output files, không đụng v3
      # ──────────────────────────────────────────────────────────────────
      - name: Commit V2 output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            output/deep_raw_v2.json \
            output/deep_v2.json \
            output/deep_v2.csv \
            output/ranking_v2.json \
            output/ranking_v2.csv \
            output/order_flow_v2.json \
            output/signals_v2.json \
            output/signals_v2.csv \
            output/trade_levels_v2.json \
            output/trade_levels_v2.csv \
            output/history/predictions_v2/ \
            2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit — skipping."
            exit 0
          fi

          git commit -m "data[v2]: $(date +'%Y-%m-%d %H:%M') ICT"

          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "✅ pushed (attempt $i)"
              pushed=1
              break
            fi
            echo "⚠️ push attempt $i failed — retrying..."
            sleep $((RANDOM % 5 + 3))
          done

          if [ "$pushed" -ne 1 ]; then
            echo "❌ push failed after 5 attempts"
            exit 1
          fi
