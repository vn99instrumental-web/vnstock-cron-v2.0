name: VNStock 6 native production

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Invocation mode used by n8n
        type: choice
        options: [intraday, daily, weekly]
        default: intraday
      activate_dashboard:
        description: Switch the public manifest to native after the compatible web release is deployed
        type: boolean
        default: true

concurrency:
  group: vnstock-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HOME: /home/runner
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: /home/runner/.venv_6x
          key: vnstock-gen6-6.0.0-oapi0.1.1-quant1.0.0-${{ runner.os }}-python311
      - name: Ensure generation 6 environment
        run: |
          test -x ~/.venv_6x/bin/python || python3 -m venv ~/.venv_6x
          ~/.venv_6x/bin/python -m pip install -U --extra-index-url https://vnstocks.com/api/packages "vnstock==6.0.0" "vnstock-oapi==0.1.1" "vnstock_quant==1.0.0"
      - name: Verify scoring calculations
        run: ~/.venv_6x/bin/python -m unittest tests.test_vnstock6_scoring tests.test_vnstock6_quant tests.test_vnstock6_v4_scoring tests.test_vnstock6_pipeline
      - name: Build and validate native release
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
          SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
          SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}
          FHSC_API_KEY: ${{ secrets.FINHAY_API_KEY }}
        run: |
          test -n "$VNSTOCK_API_KEY" && test -n "$VNSTOCK_DEVICE_ID"
          test -n "$SSI_API_KEY" && test -n "$SSI_API_SECRET" && test -n "$FHSC_API_KEY"
          ~/.venv_6x/bin/python -c "import os, vnstock; vnstock.login(os.environ['VNSTOCK_API_KEY'])"
          run_args=()
          if [ "${{ inputs.mode }}" = "intraday" ]; then
            run_args+=(--intraday)
          fi
          ~/.venv_6x/bin/python scripts/vnstock6_native_pipeline.py run "${run_args[@]}"
          if [ "${{ inputs.mode }}" != "intraday" ]; then
            ~/.venv_6x/bin/python scripts/vnstock6_native_pipeline.py evaluate
          fi
          if [ "${{ inputs.mode }}" = "intraday" ]; then
            ~/.venv_6x/bin/python scripts/build_dashboard_serving_local.py --versions v6.4.19-shadow v6.4.18 v6.4.17
          else
            ~/.venv_6x/bin/python scripts/build_dashboard_serving_local.py --full --versions v6.4.19-shadow v6.4.18 v6.4.17
          fi
          ~/.venv_6x/bin/python scripts/materialize_vnstock6_serving.py \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ~/.venv_6x/bin/python scripts/validate_vnstock6_candidate.py \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --output comparison/native-production-summary.json
      - name: Keep dashboard bridge until the compatible Vercel release is approved
        if: inputs.activate_dashboard != true
        run: git restore -- output/vnstock6-preview/dashboard.json
      - name: Publish native Git ledger and serving
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- output/history/vnstock6 output/ohlc output/vnstock6 output/vnstock6-preview/dashboard.json output/serving/vnstock6
          git diff --cached --quiet && exit 0
          git commit -m "data: publish vnstock6 native ${{ inputs.mode }}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
      - name: Revalidate Vercel dashboard cache
        env:
          DASHBOARD_REVALIDATE_SECRET: ${{ secrets.DASHBOARD_REVALIDATE_SECRET }}
        run: |
          test -n "$DASHBOARD_REVALIDATE_SECRET"
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            -X POST "https://trading-snapshot-dl.vercel.app/api/revalidate" \
            -H "Authorization: Bearer $DASHBOARD_REVALIDATE_SECRET"