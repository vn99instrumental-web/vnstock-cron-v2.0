name: Unified SSI FHSC data production

on:
  workflow_dispatch:
    inputs:
      cadence:
        description: Provider collection cadence dispatched by n8n
        type: choice
        options: [intraday, daily, weekly]
        default: intraday
      raw_release_id:
        description: Existing immutable release for calculator-only retry; blank collects once
        required: false
        type: string
        default: ""
      engine:
        description: Calculator selection; scheduled n8n runs always use both
        type: choice
        options: [both, gen6, ssi]
        default: both

concurrency:
  group: vnstock-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HOME: /home/runner
      DO_NOT_TRACK: "1"
      RAW_CADENCE: ${{ inputs.cadence }}
      REQUESTED_RAW_RELEASE_ID: ${{ inputs.raw_release_id }}
      CALC_ENGINE: ${{ inputs.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Sync latest serialized state
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: /home/runner/.venv_6x
          key: vnstock-gen6-6.0.0-oapi0.1.1-quant1.0.0-${{ runner.os }}-python311
      - name: Ensure shared transport and calculation environment
        run: |
          test -x ~/.venv_6x/bin/python || python3 -m venv ~/.venv_6x
          ~/.venv_6x/bin/python -m pip install -U --extra-index-url https://vnstocks.com/api/packages "vnstock==6.0.0" "vnstock-oapi==0.1.1" "vnstock_quant==1.0.0"
      - name: Resolve one immutable raw release
        id: release
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
          SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
          SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}
          FHSC_API_KEY: ${{ secrets.FINHAY_API_KEY }}
        run: |
          if [ -n "$REQUESTED_RAW_RELEASE_ID" ]; then
            [[ "$REQUESTED_RAW_RELEASE_ID" =~ ^[0-9]{8}T[0-9]{6}Z-[0-9a-f]{8}$ ]]
            release_id="$REQUESTED_RAW_RELEASE_ID"
            test -f "output/shared-raw/ssi-fhsc/releases/$release_id/manifest.json"
            ~/.venv_6x/bin/python scripts/shared_raw_collector.py verify --release-dir "output/shared-raw/ssi-fhsc/releases/$release_id"
            echo "collected=false" >> "$GITHUB_OUTPUT"
          else
            test "$CALC_ENGINE" = "both"
            test -n "$VNSTOCK_API_KEY" && test -n "$VNSTOCK_DEVICE_ID"
            test -n "$SSI_API_KEY" && test -n "$SSI_API_SECRET" && test -n "$FHSC_API_KEY"
            ~/.venv_6x/bin/python scripts/verify_vnstock_account.py
            ~/.venv_6x/bin/python scripts/shared_raw_collector.py collect --cadence "$RAW_CADENCE"
            ~/.venv_6x/bin/python scripts/shared_raw_collector.py verify
            release_id=$(~/.venv_6x/bin/python -c "import json; print(json.load(open('output/shared-raw/ssi-fhsc/current.json'))['release_id'])")
            echo "collected=true" >> "$GITHUB_OUTPUT"
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
      - name: Persist provider raw before any calculation
        if: steps.release.outputs.collected == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- output/shared-raw/ssi-fhsc
          if ! git diff --cached --quiet; then
            git commit -m "data: publish $RAW_CADENCE shared raw SSI FHSC release"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then break; fi
              git rebase --abort 2>/dev/null || true
              test "$attempt" -lt 5 || exit 1
              sleep $((attempt * 3))
            done
          fi
      - name: Calculate Gen 6 from stored raw
        id: gen6
        if: inputs.engine == 'both' || inputs.engine == 'gen6'
        continue-on-error: true
        env:
          RAW_RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          ~/.venv_6x/bin/python scripts/shared_raw_collector.py verify --release-dir "output/shared-raw/ssi-fhsc/releases/$RAW_RELEASE_ID"
          if [ "$RAW_CADENCE" = "intraday" ]; then
            ~/.venv_6x/bin/python scripts/vnstock6_native_pipeline.py run --intraday --raw-release-id "$RAW_RELEASE_ID"
            summary="comparison/native-production-summary.json"
          elif [ "$RAW_CADENCE" = "daily" ]; then
            ~/.venv_6x/bin/python scripts/vnstock6_native_pipeline.py run --refresh-slow-market --raw-release-id "$RAW_RELEASE_ID"
            ~/.venv_6x/bin/python scripts/vnstock6_native_pipeline.py evaluate
            summary="comparison/daily-maintenance-summary.json"
          else
            ~/.venv_6x/bin/python scripts/vnstock6_native_pipeline.py fundamentals --raw-release-id "$RAW_RELEASE_ID"
            ~/.venv_6x/bin/python scripts/validate_vnstock6_fundamentals.py
            ~/.venv_6x/bin/python scripts/vnstock6_native_pipeline.py run --refresh-slow-market --raw-release-id "$RAW_RELEASE_ID"
            ~/.venv_6x/bin/python scripts/vnstock6_native_pipeline.py evaluate
            summary="comparison/weekly-fundamental-summary.json"
          fi
          full_arg=""
          if [ "$RAW_CADENCE" != "intraday" ]; then full_arg="--full"; fi
          ~/.venv_6x/bin/python scripts/build_dashboard_serving_local.py $full_arg --versions v6.4.19-shadow v6.4.18 v6.4.17
          ~/.venv_6x/bin/python scripts/materialize_vnstock6_serving.py --run-id "${{ github.run_id }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ~/.venv_6x/bin/python scripts/validate_vnstock6_candidate.py --run-id "${{ github.run_id }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --output "$summary"
      - name: Discard failed Gen 6 calculation files
        if: steps.gen6.outcome == 'failure'
        run: |
          git restore --worktree -- output/history/vnstock6 output/ohlc output/market/vnindex.json output/vnstock6 output/vnstock6-preview/dashboard.json output/serving/vnstock6 comparison 2>/dev/null || true
          git clean -fd -- output/history/vnstock6 output/ohlc output/vnstock6 output/serving/vnstock6 comparison
      - name: Calculate SSI from the same stored raw
        id: ssi
        if: inputs.engine == 'both' || inputs.engine == 'ssi'
        continue-on-error: true
        env:
          RAW_RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          ~/.venv_6x/bin/python scripts/shared_raw_collector.py verify --release-dir "output/shared-raw/ssi-fhsc/releases/$RAW_RELEASE_ID"
          ~/.venv_6x/bin/python scripts/validate_ssi_standalone.py
          ~/.venv_6x/bin/python -m scripts.ssi_raw_features
          ~/.venv_6x/bin/python -m scripts.ssi_independent_pipeline build --raw-release-id "$RAW_RELEASE_ID"
      - name: Discard failed SSI calculation files
        if: steps.ssi.outcome == 'failure'
        run: |
          git restore --worktree -- output/history/ssi-independent output/serving/ssi web/data/ssi-independent-dashboard.json 2>/dev/null || true
          git clean -fd -- output/history/ssi-independent output/serving/ssi web/data/ssi-independent-dashboard.json
      - name: Publish separate Gen 6 and SSI calculation storage
        id: publish
        if: always() && (steps.gen6.outcome == 'success' || steps.ssi.outcome == 'success')
        continue-on-error: true
        env:
          RAW_RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.gen6.outcome }}" = "success" ]; then
            git add -- output/history/vnstock6 output/ohlc output/market/vnindex.json output/vnstock6 output/vnstock6-preview/dashboard.json output/serving/vnstock6 comparison
          fi
          if [ "${{ steps.ssi.outcome }}" = "success" ]; then
            git add -- output/history/ssi-independent output/serving/ssi web/data/ssi-independent-dashboard.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "data: publish $CALC_ENGINE calculations from $RAW_RELEASE_ID"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then break; fi
              git rebase --abort 2>/dev/null || true
              test "$attempt" -lt 5 || exit 1
              sleep $((attempt * 3))
            done
          fi
      - name: Revalidate dashboard once
        if: steps.publish.outcome == 'success'
        env:
          DASHBOARD_REVALIDATE_SECRET: ${{ secrets.DASHBOARD_REVALIDATE_SECRET }}
        run: |
          test -n "$DASHBOARD_REVALIDATE_SECRET"
          curl --fail --silent --show-error --retry 3 --retry-all-errors -X POST \
            "https://trading-snapshot-dl.vercel.app/api/revalidate" \
            -H "Authorization: Bearer $DASHBOARD_REVALIDATE_SECRET"
      - name: Enforce requested calculator results
        if: always()
        run: |
          gen6="${{ steps.gen6.outcome }}"
          ssi="${{ steps.ssi.outcome }}"
          publish="${{ steps.publish.outcome }}"
          if [ "$publish" != "success" ]; then
            echo "Calculation storage publish failed for ${{ steps.release.outputs.release_id }}" >&2
            exit 1
          fi
          if { [ "$CALC_ENGINE" = "both" ] || [ "$CALC_ENGINE" = "gen6" ]; } && [ "$gen6" != "success" ]; then
            echo "Gen 6 calculation failed for ${{ steps.release.outputs.release_id }}" >&2
            exit 1
          fi
          if { [ "$CALC_ENGINE" = "both" ] || [ "$CALC_ENGINE" = "ssi" ]; } && [ "$ssi" != "success" ]; then
            echo "SSI calculation failed for ${{ steps.release.outputs.release_id }}" >&2
            exit 1
          fi
