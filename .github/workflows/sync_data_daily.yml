name: Sync data daily → Supabase

# Chạy sau giờ thị trường (16:30 ICT = 09:30 UTC) để cập nhật OHLC
# cho return 3/5 phiên, mirror ledger và refresh IC nếu có outcome mới.
on:
  workflow_dispatch:
    inputs:
      bootstrap_ohlc_from_supabase:
        description: 'Seed full retained OHLC from Supabase into GitHub before the incremental refresh'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: vnstock-main-writer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://mcaqnaomzoqgxccdgvls.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
      VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
      VNSTOCK_INTERACTIVE: '0'
      VNSTOCK_LANGUAGE: en

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore vnstock cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/vnstock/.venv
            /home/runner/.vnstock
          key: vnstock-stable-v4-${{ github.run_number }}
          restore-keys: |
            vnstock-stable-v4-

      - name: Select Python runtime
        id: python
        shell: bash
        run: |
          if [ -x /opt/vnstock/.venv/bin/python ]; then
            echo "python=/opt/vnstock/.venv/bin/python" >> "$GITHUB_OUTPUT"
          else
            python3 -m pip install --quiet vnstock_data pandas requests numpy
            echo "python=python3" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard secrets
        shell: bash
        run: |
          echo "Supabase key is optional; GitHub is the primary publish path."
          test -n "$VNSTOCK_API_KEY" || { echo 'Missing VNSTOCK_API_KEY'; exit 1; }

      - name: Refresh daily OHLC with Supabase-compatible upsert retention
        shell: bash
        run: |
          bootstrap=()
          if [ "${{ inputs.bootstrap_ohlc_from_supabase }}" = "true" ]; then
            bootstrap+=(--bootstrap-local-from-supabase)
          fi
          ${{ steps.python.outputs.python }} scripts/export_ohlc_to_supabase.py --days 45 --write-local "${bootstrap[@]}"

      - name: Build full GitHub dashboard data from local ledgers
        run: ${{ steps.python.outputs.python }} scripts/build_dashboard_serving_local.py --full

      - name: Publish local OHLC and GitHub serving data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- output/ohlc output/serving
          if git diff --cached --quiet; then
            echo "No GitHub serving changes"
            exit 0
          fi
          while IFS= read -r staged_file; do
            [ -f "$staged_file" ] || continue
            bytes=$(wc -c < "$staged_file")
            if [ "$bytes" -gt 95000000 ]; then
              echo "::error file=$staged_file::File is $bytes bytes; split before publish."
              exit 1
            fi
          done < <(git diff --staged --name-only --diff-filter=ACM)
          git commit -m "data: refresh GitHub dashboard serving"
          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then pushed=1; break; fi
            sleep $((RANDOM % 5 + 3))
          done
          test "$pushed" -eq 1

      - name: Sync recent ledger to Supabase
        continue-on-error: true
        shell: bash
        run: |
          CUR=$(date -u +%Y-%m)
          PREV=$(date -u -d '1 month ago' +%Y-%m)
          ${{ steps.python.outputs.python }} scripts/sync_supabase.py --months "$CUR" "$PREV"

      - name: Refresh forward IC metrics
        run: ${{ steps.python.outputs.python }} scripts/export_ic_to_supabase.py
        continue-on-error: true
      - name: Refresh historical backfill IC metrics
        run: ${{ steps.python.outputs.python }} scripts/export_backfill_ic_to_supabase.py
        continue-on-error: true
      - name: Refresh IC industry snapshot
        run: ${{ steps.python.outputs.python }} scripts/export_ic_industry_to_supabase.py
        continue-on-error: true

      - name: Refresh dashboard serving snapshots
        continue-on-error: true
        run: ${{ steps.python.outputs.python }} scripts/refresh_dashboard_snapshots.py

      - name: Invalidate Vercel dashboard cache
        continue-on-error: true
        env:
          DASHBOARD_REVALIDATE_SECRET: ${{ secrets.DASHBOARD_REVALIDATE_SECRET }}
        run: |
          if [ -z "$DASHBOARD_REVALIDATE_SECRET" ]; then
            echo "DASHBOARD_REVALIDATE_SECRET is not configured; 5-minute TTL remains active."
            exit 0
          fi
          curl --fail --silent --show-error \
            -X POST "https://trading-snapshot-dl.vercel.app/api/revalidate" \
            -H "Authorization: Bearer $DASHBOARD_REVALIDATE_SECRET"

      - name: Apply bounded Supabase retention
        run: ${{ steps.python.outputs.python }} scripts/prune_supabase_retention.py
        continue-on-error: true

      - name: Verify GitHub-Supabase latest and history parity
        continue-on-error: true
        run: ${{ steps.python.outputs.python }} scripts/verify_supabase_mirror.py --history
