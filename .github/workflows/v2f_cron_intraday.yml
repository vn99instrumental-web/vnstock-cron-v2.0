name: VNStock Intraday V2F (full-VN100)

# Lệch v2 (09:30 ICT = 02:30 UTC) 10 phút → 09:40 ICT = 02:40 UTC.
# Lệch để: (1) tránh race khi 2 workflow cùng push main; (2) tách spike quota VCI;
# (3) easy bisect khi đọc log Actions.
on:
  workflow_dispatch:
    inputs:
      force_record:
        description: 'Ep ghi predictions ke ca ngoai gio (de test)'
        type: boolean
        default: false

      v4_backfill:
        description: 'CHI chay 2 step V4 tren data da commit (khong snapshot/API)'
        type: boolean
        default: false

permissions:
  contents: write

# Concurrency group RIÊNG → không serialize / cancel chéo với v2.
concurrency:
  group: vnstock-intraday-v2f
  cancel-in-progress: false

jobs:
  run:
    # Bỏ qua job full-chain khi chỉ muốn backfill V4 (dispatch + v4_backfill=true).
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.v4_backfill) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40   # V2F xử lý ~100 mã (≈2.5× v2) → nới timeout

    env:
      VNSTOCK_API_KEY:     ${{ secrets.VNSTOCK_API_KEY }}
      VNSTOCK_DEVICE_ID:   ${{ secrets.VNSTOCK_DEVICE_ID }}
      VNSTOCK_INTERACTIVE: "0"
      VNSTOCK_LANGUAGE:    en
      VNSTOCK_VENV_PATH:   /opt/vnstock/.venv
      HOME:                /home/runner
      MPLCONFIGDIR:        /home/runner/.config/matplotlib

      # ──────────────────────────────────────────────────────────────
      # 2026-07-22 — FIX "Rate limit exceeded 300/300" (log run 09:50 ICT)
      # Bằng chứng đo từ log: 738 lệnh / 167 giây = 4,42 lệnh/giây;
      # đỉnh cửa sổ 60 giây = 274 lệnh (log) ≈ 300 lệnh (VCI đếm, do
      # thư viện tự retry ngầm ~10%). Trần gói Silver = 300 lệnh/phút
      # → mặc định VCI_MIN_INTERVAL=0.20s cho phép ĐÚNG 300/phút,
      #   không chừa dư địa nào → chắc chắn vỡ.
      # Thư viện tự giết tiến trình khi hết quota ("Process terminated",
      # exit 1) nên circuit breaker trong vci_throttle KHÔNG kịp chạy
      # → chỉ có thể phòng ngừa trước, không chữa được sau.
      # Hậu quả run 09:50: xong 125/130 mã rồi mất trắng cả run
      # (order_flow / scoring / price_levels / record / V3 đều không chạy).
      #
      # 0.30s = 3,33 lệnh/giây = ~200 lệnh/phút ≈ 73% hạn mức.
      # Bước Snapshot: ~2,8 phút → ~4,2 phút (chậm hơn ~1,4 phút).
      # Rollback: xóa 2 dòng dưới là về nguyên trạng.
      # Nếu vẫn dính 429: nâng lên "0.40" (~150 lệnh/phút = 55% hạn mức).
      # ──────────────────────────────────────────────────────────────
      VCI_MIN_INTERVAL:    "0.30"
      VCI_STEP_COOLDOWN:   "30"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Restore cache do cron_daily.yml tạo — KHÔNG install gì thêm.
      # Cache dùng chung với v2 (cùng venv vnstock, an toàn vì read-only ở đây).
      - name: Compute cache key suffix (weekly)
        id: cache-suffix
        run: echo "week=$(date -u +%Y-W%V)" >> $GITHUB_OUTPUT

      - name: Restore vnstock cache
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: |
            /opt/vnstock/.venv
            /home/runner/.vnstock
          key: vnstock-stable-v4-${{ steps.cache-suffix.outputs.week }}
          restore-keys: |
            vnstock-stable-v4-

      - name: Verify venv
        run: |
          VENV_PY="/opt/vnstock/.venv/bin/python"
          if [ ! -x "$VENV_PY" ]; then
            echo "❌ Venv không tồn tại — cron_daily.yml chưa chạy hoặc cache miss"
            echo "Chạy cron_daily.yml trước để warm cache"
            exit 1
          fi
          echo "✅ Venv OK: $($VENV_PY --version)"
          $VENV_PY -m pip list 2>&1 | grep -iE "vnstock|vnai" || echo "(none found)"

      # ──────────────────────────────────────────────────────────────────
      # V2F PIPELINE — fork song song, prefix v2f_* cho mọi output
      # I/O đọc/ghi: v2f_deep_raw → v2f_order_flow → v2f_signals → v2f_trade_levels
      #   + dùng CHUNG context.json / news/today_index.json / finance/cache.json
      #   + ledger ledger riêng: output/history/v2f_predictions/
      # ──────────────────────────────────────────────────────────────────
      - name: Step Snapshot V2F — Universe (full-VN100) + Ranking + Deep
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          mkdir -p /home/runner/.config/matplotlib
          /opt/vnstock/.venv/bin/python steps/v2f_step_snapshot.py

      - name: Step Order Flow V2F
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          /opt/vnstock/.venv/bin/python steps/v2f_step_order_flow.py

      - name: Step Scoring V2F (weighted normalized)
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          /opt/vnstock/.venv/bin/python steps/v2f_step_scoring.py

      - name: Step Price Levels V2F
        run: |
          /opt/vnstock/.venv/bin/python steps/v2f_step_price_levels.py

      - name: Step Record Predictions V2F (forward log → v2f_predictions)
        env:
          FORCE_RECORD: ${{ inputs.force_record && '1' || '' }}
        run: |
          /opt/vnstock/.venv/bin/python steps/v2f_step_record_predictions.py

      # ──────────────────────────────────────────────────────────────────
      # SHADOW V3 — registry scoring, chạy SAU v2.3, đọc lại output đã có
      # (v2f_signals.json + context.json), ZERO API call thêm.
      # continue-on-error: v3 crash KHÔNG được chặn pipeline v2.3.
      # ──────────────────────────────────────────────────────────────────
      - name: Step Scoring V3 (shadow registry)
        continue-on-error: true
        run: |
          /opt/vnstock/.venv/bin/python steps/v2f_step_scoring_v3.py

      - name: Step Price Levels V3 (levels riêng của shadow)
        continue-on-error: true
        run: |
          /opt/vnstock/.venv/bin/python steps/v2f_step_price_levels_v3.py

      - name: Step Record Predictions V3 (shadow ledger)
        continue-on-error: true
        env:
          FORCE_RECORD: ${{ inputs.force_record && '1' || '' }}
        run: |
          /opt/vnstock/.venv/bin/python steps/v2f_step_record_predictions_v3.py

      # ──────────────────────────────────────────────────────────────────
      # SHADOW V4 (RCEG) — regime-conditional scoring, chạy SAU v3, đọc lại
      # v2f_signals.json + context.json (ZERO API thêm). Dùng chung trade levels
      # v2.3 (agnostic) nên KHÔNG cần step price_levels_v4.
      # Hysteresis: state ở output/v2f_v4_regime_state.json (PHẢI commit để persist).
      # continue-on-error: v4 crash KHÔNG được chặn pipeline.
      # ──────────────────────────────────────────────────────────────────
      - name: Step Scoring V4 (shadow RCEG, gate theo regime)
        continue-on-error: true
        run: |
          /opt/vnstock/.venv/bin/python steps/v2f_step_scoring_v4.py

      - name: Step Price Levels V4 (shadow, độc lập v2.3)
        continue-on-error: true
        run: |
          /opt/vnstock/.venv/bin/python steps/v2f_step_price_levels_v4.py

      - name: Step Record Predictions V4 (shadow#2 ledger)
        continue-on-error: true
        env:
          FORCE_RECORD: ${{ inputs.force_record && '1' || '' }}
        run: |
          /opt/vnstock/.venv/bin/python steps/v2f_step_record_predictions_v4.py

      # ──────────────────────────────────────────────────────────────────
      # COMMIT — add v2f_* output + 3 ledger (v2f_predictions + _v3 + _v4 shadow)
      # KHÔNG đụng output của track v2 cũ. Push retry + rebase để tránh race với
      # workflow v2 (mặc dù file khác tên, branch main vẫn có thể đụng ref).
      # ──────────────────────────────────────────────────────────────────
      - name: Commit V2F output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # BUGFIX 05/07: git add 1 lệnh nhiều path → 1 path chưa tồn tại
          # (vd file v3 khi shadow crash) làm FAIL TOÀN BỘ lệnh add → mất
          # commit data v2.3. Add TỪNG path riêng, path thiếu chỉ mất mình nó.
          for p in \
            output/v2f_deep_raw.json \
            output/v2f_deep.json \
            output/v2f_deep.csv \
            output/v2f_ranking.json \
            output/v2f_ranking.csv \
            output/v2f_order_flow.json \
            output/v2f_signals.json \
            output/v2f_signals.csv \
            output/v2f_trade_levels.json \
            output/v2f_trade_levels.csv \
            output/history/v2f_predictions/ \
            output/v2f_signals_v3.json \
            output/v2f_trade_levels_v3.json \
            output/history/v2f_predictions_v3/ \
            output/v2f_signals_v4.json \
            output/v2f_trade_levels_v4.json \
            output/v2f_v4_regime_state.json \
            output/history/v2f_predictions_v4/ ; do
            git add "$p" 2>/dev/null || true
          done

          if git diff --staged --quiet; then
            echo "No changes to commit — skipping."
            exit 0
          fi

          git commit -m "data[v2f]: $(date +'%Y-%m-%d %H:%M') ICT"

          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "✅ pushed (attempt $i)"
              pushed=1
              break
            fi
            echo "⚠️ push attempt $i failed — retrying..."
            sleep $((RANDOM % 5 + 3))
          done

          if [ "$pushed" -ne 1 ]; then
            echo "❌ push failed after 5 attempts"
            exit 1
          fi

  # ══════════════════════════════════════════════════════════════════════
  # JOB PHỤ — chỉ chạy tay (workflow_dispatch) để BACKFILL V4 trên dữ liệu
  # đã commit (v2f_signals.json + context.json của phiên gần nhất). KHÔNG
  # snapshot, KHÔNG gọi API. Dùng khi muốn ghi ledger V4 cho 1 phiên cũ mà
  # không chạy lại cả chuỗi intraday.
  # Kích hoạt: Actions → workflow này → Run workflow → tick "v4_backfill".
  # ══════════════════════════════════════════════════════════════════════
  v4_backfill:
    # Chỉ chạy khi dispatch tay VÀ tick v4_backfill=true (lịch tự động bỏ qua).
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.v4_backfill }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: vnstock-intraday-v2f      # cùng group với job run → không push chồng
      cancel-in-progress: false
    env:
      VNSTOCK_INTERACTIVE: "0"
      VNSTOCK_LANGUAGE:    en
      HOME:                /home/runner
      MPLCONFIGDIR:        /home/runner/.config/matplotlib
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compute cache key suffix (weekly)
        id: cache-suffix
        run: echo "week=$(date -u +%Y-W%V)" >> $GITHUB_OUTPUT

      - name: Restore vnstock cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/vnstock/.venv
            /home/runner/.vnstock
          key: vnstock-stable-v4-${{ steps.cache-suffix.outputs.week }}
          restore-keys: |
            vnstock-stable-v4-

      - name: Verify venv
        run: |
          VENV_PY="/opt/vnstock/.venv/bin/python"
          [ -x "$VENV_PY" ] || { echo "Venv miss — chay cron_daily truoc"; exit 1; }
          echo "Venv OK: $($VENV_PY --version)"

      # Chạy đúng 2 step V4 trên data ĐÃ CÓ trong output/ (zero API)
      - name: Step Scoring V4 (backfill trên data cũ)
        run: /opt/vnstock/.venv/bin/python steps/v2f_step_scoring_v4.py

      - name: Step Record Predictions V4 (backfill)
        env:
          FORCE_RECORD: ${{ inputs.force_record && '1' || '' }}
        run: /opt/vnstock/.venv/bin/python steps/v2f_step_record_predictions_v4.py

      - name: Commit V4 output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for p in \
            output/v2f_signals_v4.json \
            output/v2f_v4_regime_state.json \
            output/history/v2f_predictions_v4/ ; do
            git add "$p" 2>/dev/null || true
          done
          if git diff --staged --quiet; then
            echo "No changes to commit — skipping."; exit 0
          fi
          git commit -m "data[v2f_v4 backfill]: $(date +'%Y-%m-%d %H:%M') ICT"
          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed (attempt $i)"; pushed=1; break
            fi
            echo "push attempt $i failed — retrying..."; sleep $((RANDOM % 5 + 3))
          done
          [ "$pushed" -eq 1 ] || { echo "push failed after 5 attempts"; exit 1; }
