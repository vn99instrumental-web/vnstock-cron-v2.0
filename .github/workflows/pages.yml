# ============================================================
# Deploy GitHub Pages — CHỈ cho Zalo V4.17
# ------------------------------------------------------------
# Chỉ publish HTML/ảnh/JS phục vụ visual Zalo V4.17. Các dashboard
# legacy vẫn có thể nằm trong repo nhưng không được đưa vào Pages artifact.
# ============================================================
name: Deploy Pages (Zalo V4.17 only)

on:
  push:
    branches: [main]
    paths:
      - 'docs/indexv4_17.html'
      - 'docs/v2f_zalo_buy_latest.png'
      - 'docs/vnindex_live.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keep /docs/ in the artifact so the public Zalo URL stays unchanged.
      - name: Stage Zalo V4.17 assets
        run: |
          set -euo pipefail
          mkdir -p _site/docs
          cp docs/indexv4_17.html _site/docs/
          cp docs/v2f_zalo_buy_latest.png _site/docs/
          cp docs/vnindex_live.js _site/docs/
          test "$(find _site -type f | wc -l)" -eq 3

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
