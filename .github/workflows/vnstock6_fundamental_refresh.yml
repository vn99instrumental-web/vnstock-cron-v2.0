name: VNStock 6 weekly fundamentals

on:
  workflow_dispatch:
    inputs:
      raw_release_id:
        description: Exact immutable weekly raw release; blank redirects legacy n8n to collector
        required: false
        type: string
        default: ""
      limit:
        description: Optional number of configured symbols to refresh; 0 means all
        type: number
        default: 0

concurrency:
  group: vnstock-main-writer
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  redirect_legacy_schedule:
    if: inputs.raw_release_id == ''
    runs-on: ubuntu-latest
    steps:
      - name: Route legacy n8n trigger through shared raw collector
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run shared_raw_ssi_fhsc.yml --ref main -f cadence=weekly
  refresh:
    if: inputs.raw_release_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HOME: /home/runner
      DO_NOT_TRACK: "1"
      RAW_RELEASE_ID: ${{ inputs.raw_release_id }}
      REFRESH_LIMIT: ${{ inputs.limit || 0 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Sync exact release from main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          [[ "$RAW_RELEASE_ID" =~ ^[0-9]{8}T[0-9]{6}Z-[0-9a-f]{8}$ ]]
          test -f "output/shared-raw/ssi-fhsc/releases/$RAW_RELEASE_ID/manifest.json"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: /home/runner/.venv_6x
          key: vnstock-gen6-6.0.0-oapi0.1.1-quant1.0.0-${{ runner.os }}-python311
      - name: Ensure generation 6 calculation environment
        run: |
          test -x ~/.venv_6x/bin/python || python3 -m venv ~/.venv_6x
          ~/.venv_6x/bin/python -m pip install -U --extra-index-url https://vnstocks.com/api/packages "vnstock==6.0.0" "vnstock-oapi==0.1.1" "vnstock_quant==1.0.0"
      - name: Recalculate full FHSC factors from weekly raw
        run: |
          ~/.venv_6x/bin/python scripts/shared_raw_collector.py verify --release-dir "output/shared-raw/ssi-fhsc/releases/$RAW_RELEASE_ID"
          args=(--raw-release-id "$RAW_RELEASE_ID")
          if [ "$REFRESH_LIMIT" -gt 0 ]; then args+=(--fundamental-limit "$REFRESH_LIMIT"); fi
          ~/.venv_6x/bin/python scripts/vnstock6_native_pipeline.py fundamentals "${args[@]}"
          ~/.venv_6x/bin/python scripts/validate_vnstock6_fundamentals.py
      - name: Recalculate scores and serving from the same release
        run: |
          ~/.venv_6x/bin/python scripts/vnstock6_native_pipeline.py run --refresh-slow-market --raw-release-id "$RAW_RELEASE_ID"
          ~/.venv_6x/bin/python scripts/vnstock6_native_pipeline.py evaluate
          ~/.venv_6x/bin/python scripts/build_dashboard_serving_local.py --full --versions v6.4.19-shadow v6.4.18 v6.4.17
          ~/.venv_6x/bin/python scripts/materialize_vnstock6_serving.py --run-id "${{ github.run_id }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ~/.venv_6x/bin/python scripts/validate_vnstock6_candidate.py --run-id "${{ github.run_id }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --output comparison/weekly-fundamental-summary.json
      - name: Publish fundamental cache and serving
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- output/history/vnstock6 output/ohlc output/market/vnindex.json output/vnstock6 output/vnstock6-preview/dashboard.json output/serving/vnstock6 comparison/weekly-fundamental-summary.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh vnstock6 weekly from $RAW_RELEASE_ID"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
      - name: Revalidate Vercel dashboard cache
        env:
          DASHBOARD_REVALIDATE_SECRET: ${{ secrets.DASHBOARD_REVALIDATE_SECRET }}
        run: |
          test -n "$DASHBOARD_REVALIDATE_SECRET"
          curl --fail --silent --show-error --retry 3 --retry-all-errors -X POST "https://trading-snapshot-dl.vercel.app/api/revalidate" -H "Authorization: Bearer $DASHBOARD_REVALIDATE_SECRET"
