name: VNStock News

# ══════════════════════════════════════════════════════════════════════════
# NEWS (RSS-only, 2026-07-27) — workflow NHẸ, Python hệ thống.
#
# Vì đã bỏ hẳn vnstock_news, step_news_daily.py KHÔNG còn cần venv sponsor
# (/opt/vnstock/.venv). Chỉ cần: pandas + feedparser + beautifulsoup4 +
# lxml + requests. → bỏ toàn bộ cache/installer venv (tránh sự cố venv
# thiếu pip), chạy nhanh hơn nhiều.
#
# TRIGGER: n8n gọi workflow_dispatch (hoặc repository_dispatch 'news') lúc
# 08:00 ICT, TRƯỚC cron_daily / intraday.
#   POST .../actions/workflows/cron_news.yml/dispatches   body {"ref":"main"}
#
# dry_run=true  → chạy scripts/run_news_daily_dry.py (kèm DECODE), KHÔNG commit
# dry_run=false → chạy steps/step_news_daily.py rồi commit output/news/*
#
# news_score hiện weight = 0 → workflow này fail cũng không ảnh hưởng tín hiệu.
# ══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chạy thử KHÔNG commit (kèm DECODE điểm mã)"
        type: boolean
        default: false
  repository_dispatch:
    types: [news]

permissions:
  contents: write

concurrency:
  group: vnstock-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps (RSS-only — không cần venv sponsor)
        run: |
          python -m pip install --upgrade pip
          pip install pandas feedparser beautifulsoup4 lxml requests

      # ── DRY RUN: crawl + build index + DECODE, KHÔNG commit ──
      - name: Run news (dry)
        if: ${{ inputs.dry_run == true }}
        run: python scripts/run_news_daily_dry.py

      # ── PRODUCTION: crawl + build index thật ──
      - name: Run news
        if: ${{ inputs.dry_run != true }}
        run: python steps/step_news_daily.py

      # ── COMMIT (chỉ khi KHÔNG dry_run) — per-path, chỉ file news ──
      - name: Commit news output
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            output/news/raw.json \
            output/news/history.json \
            output/news/today_index.json \
            output/news_raw.json \
            output/news_history.json \
            output/news_today_index.json \
            2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit — skipping."
            exit 0
          fi
          git commit -m "news: RSS crawl + index $(date -u +'%Y-%m-%d %H:%M') UTC"

          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed (attempt $i)"; pushed=1; break
            fi
            echo "push attempt $i failed — retrying..."; sleep $((RANDOM % 5 + 3))
          done
          if [ "$pushed" -ne 1 ]; then echo "push failed after 5 attempts"; exit 1; fi
