name: cron_news

# ─────────────────────────────────────────────────────────────────────────────
# Thu thập tin (5 nguồn RSS) → output/news/*.json → commit.
# KÍCH HOẠT BẰNG n8n, CHẠY TRƯỚC cron_intraday (Hoang tự canh giờ trong n8n
# để không đụng commit với intraday).
#
# 2 cách n8n gọi:
#   (A) workflow_dispatch  : POST .../actions/workflows/cron_news.yml/dispatches
#   (B) repository_dispatch: POST .../dispatches  body {"event_type":"news"}
#
# Workflow ĐỘC LẬP, NHẸ: không dùng venv sponsor, không cài vnstock_*.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chỉ chạy thử, KHÔNG commit (để test crawl)"
        type: boolean
        default: false
  repository_dispatch:
    types: [news]

permissions:
  contents: write

# Cùng group với intraday nếu muốn KHÓA CỨNG không chạy chồng (xem README).
# Hiện tại chỉ news dùng group này; rebase+retry ở bước commit là lưới an toàn chính.
concurrency:
  group: output-writer
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (RSS only)
        run: |
          python -m pip install --upgrade pip
          pip install pandas feedparser beautifulsoup4 lxml requests

      - name: Collect news
        run: python steps/step_news_collect.py

      - name: Commit output
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "Không có thay đổi — bỏ qua commit."
            exit 0
          fi
          git commit -m "news: $(date -u +'%Y-%m-%d %H:%M') UTC"
          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "✅ pushed (lần $i)"; pushed=1; break
            fi
            echo "⚠️ push lần $i lỗi — thử lại..."
            sleep $((RANDOM % 5 + 3))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "❌ push thất bại sau 5 lần"; exit 1
          fi

      - name: Dry-run note
        if: ${{ inputs.dry_run == true }}
        run: echo "DRY RUN — đã tạo file trong output/ nhưng KHÔNG commit."
