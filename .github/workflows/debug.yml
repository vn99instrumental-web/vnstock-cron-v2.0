name: Debug

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Script to run. Để trống = chạy tất cả trong scripts/'
        required: false
        default: ''
      vnstock6_preview:
        description: 'Cài và kiểm tra vnstock 6 preview với Open API SSI'
        required: false
        type: boolean
        default: false

jobs:
  run:
    if: ${{ inputs.vnstock6_preview != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      VNSTOCK_API_KEY:     ${{ secrets.VNSTOCK_API_KEY }}
      VNSTOCK_DEVICE_ID:   ${{ secrets.VNSTOCK_DEVICE_ID }}
      VNSTOCK_INTERACTIVE: "0"
      VNSTOCK_LANGUAGE:    en
      VNSTOCK_VENV_PATH:   /opt/vnstock/.venv
      HOME:                /home/runner
      MPLCONFIGDIR:        /home/runner/.config/matplotlib

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compute cache key suffix (weekly)
        id: cache-suffix
        run: |
          echo "week=$(date -u +%Y-W%V)" >> $GITHUB_OUTPUT

      - name: Restore vnstock cache
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: |
            /opt/vnstock/.venv
            /home/runner/.vnstock
          key: vnstock-stable-v4-${{ steps.cache-suffix.outputs.week }}
          restore-keys: |
            vnstock-stable-v4-

      # ── Restore backtest dataset (READ-ONLY cho diagnostic scripts) ──
      # cache/restore (không phải cache) → không bao giờ ghi đè cache của
      # backtest.yml. Cache miss → script tự fail-soft, không chặn run.
      - name: Restore backtest dataset cache
        uses: actions/cache/restore@v4
        with:
          path: backtest_output/dataset.parquet
          key: backtest-dataset-v2-full-${{ hashFiles('backtest/bt_config.py', 'backtest/bt_data.py') }}
          restore-keys: |
            backtest-dataset-v2-full-

      - name: Fallback install nếu cache miss
        if: steps.cache-venv.outputs.cache-hit != 'true'
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          pip install requests
          mkdir -p /home/runner/.vnstock /home/runner/.config/matplotlib
          wget -q https://vnstocks.com/files/vnstock-cli-installer.run -O installer.run
          chmod +x installer.run
          ./installer.run -- --non-interactive \
            --api-key "$VNSTOCK_API_KEY" \
            --venv-path "$VNSTOCK_VENV_PATH" \
            --language en
          wget -q https://vnstocks.com/files/generate_user_info.min.py \
            -O generate_user_info.min.py
          source /opt/vnstock/.venv/bin/activate
          python3 generate_user_info.min.py --api-key "$VNSTOCK_API_KEY"

      - name: Ensure latest vnstock packages
        run: |
          VENV_PIP="/opt/vnstock/.venv/bin/pip"

          if [ ! -x "$VENV_PIP" ]; then
            echo "⚠️ Venv pip not found at $VENV_PIP — skipping"
            exit 0
          fi

          echo "=== Current versions ==="
          $VENV_PIP list 2>&1 | grep -iE "vnstock|vnai" || echo "(none found)"
          echo ""

          echo "=== Upgrading public 'vnstock' package only ==="
          $VENV_PIP install --upgrade vnstock 2>&1 | tail -5 || \
            echo "⚠️ vnstock upgrade failed (continuing)"
          echo ""

          echo "=== Sponsor packages ==="
          for pkg in vnstock_data vnstock_news vnstock_ta; do
            version=$($VENV_PIP show "$pkg" 2>/dev/null | grep -i "^Version:" | awk '{print $2}')
            if [ -n "$version" ]; then
              echo "  $pkg: $version"
            else
              echo "  $pkg: NOT INSTALLED ⚠️"
            fi
          done
           
      - name: Run single script
        if: ${{ github.event.inputs.script != '' }}
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          mkdir -p /home/runner/.config/matplotlib
          source /opt/vnstock/.venv/bin/activate
          echo "=== Running: ${{ github.event.inputs.script }} ==="
          python ${{ github.event.inputs.script }}

      - name: Run all scripts in scripts/
        if: ${{ github.event.inputs.script == '' }}
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          mkdir -p /home/runner/.config/matplotlib
          source /opt/vnstock/.venv/bin/activate
          for f in scripts/*.py; do
            echo ""
            echo "======================================"
            echo "=== Running: $f ==="
            echo "======================================"
            python "$f" || echo "⚠️  $f exited with error"
            echo ""
          done

  vnstock6-preview:
    name: Vnstock 6 preview (SSI)
    if: ${{ inputs.vnstock6_preview == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    env:
      HOME: /home/runner

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python and existing vnstock 6 environment
        id: vnstock6-env
        shell: bash
        run: |
          python3 --version
          if [ -x ~/.venv_6x/bin/python ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            ~/.venv_6x/bin/python -m pip show vnstock vnstock-oapi vnstock_data vnai || true
            ~/.venv_6x/bin/python - <<'PY'
          from importlib.metadata import PackageNotFoundError, version

          for package in ("vnstock_data", "vnai"):
              try:
                  installed = version(package)
              except PackageNotFoundError:
                  continue
              raise SystemExit(
                  f"Refusing to reuse ~/.venv_6x: {package} {installed} belongs to an older generation"
              )

          try:
              installed = version("vnstock")
          except PackageNotFoundError:
              pass
          else:
              if not installed.startswith("6."):
                  raise SystemExit(
                      f"Refusing to reuse ~/.venv_6x: vnstock {installed} is not generation 6"
                  )
          PY
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create vnstock 6 environment
        if: steps.vnstock6-env.outputs.exists != 'true'
        run: python3 -m venv ~/.venv_6x

      - name: Install vnstock 6 preview
        run: ~/.venv_6x/bin/python -m pip install -U --extra-index-url https://vnstocks.com/api/packages "vnstock==6.0.0rc4" "vnstock-oapi==0.1.0rc3"

      - name: Verify account and SSI source configuration
        shell: bash
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          SSI_API_KEY:     ${{ secrets.SSI_API_KEY }}
          SSI_API_SECRET:  ${{ secrets.SSI_API_SECRET }}
        run: |
          test -n "$SSI_API_KEY" || { echo "Missing GitHub Secret: SSI_API_KEY"; exit 1; }
          test -n "$SSI_API_SECRET" || { echo "Missing GitHub Secret: SSI_API_SECRET"; exit 1; }
          ~/.venv_6x/bin/vnstock version
          ~/.venv_6x/bin/python -c "import vnstock; assert vnstock.__version__ == '6.0.0rc4', vnstock.__version__; print(vnstock.__version__)"
          ~/.venv_6x/bin/vnstock status
          ~/.venv_6x/bin/vnstock keys
          ~/.venv_6x/bin/vnstock keys check ssi
          ~/.venv_6x/bin/vnstock doctor
          ~/.venv_6x/bin/vnstock onboard

      - name: Smoke test SSI read-only access
        env:
          SSI_API_KEY:    ${{ secrets.SSI_API_KEY }}
          SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}
        run: |
          ~/.venv_6x/bin/python - <<'PY'
          from vnstock import Reference

          frame = Reference("ssi").equity.list()
          print(f"SSI equity reference rows: {len(frame)}")
          PY
