name: VNStock Daily

on:
  workflow_dispatch:

# Đảm bảo bước "git push" luôn có quyền ghi, kể cả khi repo để
# Workflow permissions = read-only (đặc biệt cần để ý sau khi chuyển private).
permissions:
  contents: write

# Tránh 2 run daily chồng nhau (vd scheduled + manual). cancel-in-progress
# = false để KHÔNG kill một lần finance scan đang chạy dở.
concurrency:
  group: vnstock-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60       # tăng từ 30 → 60 cho finance scan

    env:
      VNSTOCK_API_KEY:     ${{ secrets.VNSTOCK_API_KEY }}
      VNSTOCK_DEVICE_ID:   ${{ secrets.VNSTOCK_DEVICE_ID }}
      VNSTOCK_INTERACTIVE: "0"
      VNSTOCK_LANGUAGE:    en
      VNSTOCK_VENV_PATH:   /opt/vnstock/.venv
      HOME:                /home/runner
      MPLCONFIGDIR:        /home/runner/.config/matplotlib

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ──────────────────────────────────────────────────────────────────
      # CACHE STRATEGY — Layer 2 of "latest vnstock" guarantee:
      # Cache key includes ISO week number → cache invalidates weekly.
      # Restore-keys fallback uses any older v4 cache for warm-start.
      # ──────────────────────────────────────────────────────────────────
      - name: Compute cache key suffix (weekly)
        id: cache-suffix
        run: |
          echo "week=$(date -u +%Y-W%V)" >> $GITHUB_OUTPUT
          echo "Cache suffix: $(date -u +%Y-W%V)"

      - name: Restore vnstock cache
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: |
            /opt/vnstock/.venv
            /home/runner/.vnstock
          key: vnstock-stable-v4-${{ steps.cache-suffix.outputs.week }}
          restore-keys: |
            vnstock-stable-v4-

      - name: Fallback install nếu cache miss
        if: steps.cache-venv.outputs.cache-hit != 'true'
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          pip install requests
          mkdir -p /home/runner/.vnstock
          wget -q https://vnstocks.com/files/vnstock-cli-installer.run \
            -O installer.run
          chmod +x installer.run
          ./installer.run -- \
            --non-interactive \
            --api-key "$VNSTOCK_API_KEY" \
            --venv-path "$VNSTOCK_VENV_PATH" \
            --language en
          wget -q https://vnstocks.com/files/generate_user_info.min.py \
            -O generate_user_info.min.py
          source /opt/vnstock/.venv/bin/activate
          python3 generate_user_info.min.py \
            --api-key "$VNSTOCK_API_KEY"

      - name: Install extra dependencies
        run: |
          source /opt/vnstock/.venv/bin/activate
          pip install -q gspread google-auth

      # ──────────────────────────────────────────────────────────────────
      # UPGRADE STEP — Layer 1 of "latest vnstock" guarantee:
      # IMPORTANT: Use venv's pip DIRECTLY (not relying on `source activate`
      # which doesn't always survive shell context in GitHub Actions).
      # Sponsor packages refresh via weekly cache invalidation only.
      # ──────────────────────────────────────────────────────────────────
      - name: Ensure latest vnstock packages
        run: |
          # Use venv's pip directly to avoid shell context issues
          VENV_PIP="/opt/vnstock/.venv/bin/pip"

          if [ ! -x "$VENV_PIP" ]; then
            echo "⚠️ Venv pip not found at $VENV_PIP — skipping upgrade"
            exit 0
          fi

          echo "=== Current versions (venv: /opt/vnstock/.venv) ==="
          $VENV_PIP list 2>&1 | grep -iE "vnstock|vnai" || echo "(none found)"
          echo ""

          echo "=== Upgrading public 'vnstock' package only ==="
          $VENV_PIP install --upgrade vnstock 2>&1 | tail -5 || \
            echo "⚠️ vnstock upgrade failed (continuing)"
          echo ""

          echo "=== Sponsor packages (refresh on weekly cache miss) ==="
          for pkg in vnstock_data vnstock_news vnstock_ta; do
            version=$($VENV_PIP show "$pkg" 2>/dev/null | grep -i "^Version:" | awk '{print $2}')
            if [ -n "$version" ]; then
              echo "  $pkg: $version"
            else
              echo "  $pkg: NOT INSTALLED ⚠️"
            fi
          done
          echo ""

          echo "=== Final versions ==="
          $VENV_PIP list 2>&1 | grep -iE "vnstock|vnai" || true

      - name: Step Context — Market PE/PB + Industry Map
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          mkdir -p /home/runner/.config/matplotlib
          source /opt/vnstock/.venv/bin/activate
          python steps/step3_context.py

      - name: Step Finance Scan — Quarterly cache (TTL-based)
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          source /opt/vnstock/.venv/bin/activate
          python steps/step_finance_scan_vci.py

      # ──────────────────────────────────────────────────────────────────
      # [DISABLED 2026-06-17] News crawl — tạm tắt để tối ưu thời gian run.
      # Lý do: news_score chỉ ±5/200 (~2.5% trọng số), 88% articles short_desc
      # rỗng, symbol mention rate 1.2% → ROI thấp so với ~2-3 phút crawl 14 sites.
      # step_scoring.py tự fallback news_score=0 khi today_index.json không tồn tại
      # (warning: "news_today_index.json not found — news_score = neutral (0)").
      # step_scoring_v2.py không dùng news từ thiết kế.
      # Re-enable: uncomment block dưới. Giữ nguyên steps/step_news_daily.py,
      # utils/industry_keywords.py, output/news/history.json để bật lại không mất data.
      # ──────────────────────────────────────────────────────────────────
      # - name: Step News — Daily crawl + index
      #   env:
      #     VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
      #     VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
      #   run: |
      #     source /opt/vnstock/.venv/bin/activate
      #     python steps/step_news_daily.py

      # ──────────────────────────────────────────────────────────────────
      # COMMIT OUTPUT — hardened:
      # GitHub hay xả nhiều run gần nhau → daily + intraday có thể push
      # đụng nhau (non-fast-forward rejected). Pull --rebase + retry loop
      # giúp run sau tự nối tiếp thay vì fail và mất data lần đó.
      # ──────────────────────────────────────────────────────────────────
      - name: Commit output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add output/
          if git diff --staged --quiet; then
            echo "No changes to commit — skipping."
            exit 0
          fi
          git commit -m "data: daily $(date +'%Y-%m-%d')"

          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "✅ pushed (attempt $i)"
              pushed=1
              break
            fi
            echo "⚠️ push attempt $i failed — retrying..."
            sleep $((RANDOM % 5 + 3))
          done

          if [ "$pushed" -ne 1 ]; then
            echo "❌ push failed after 5 attempts"
            exit 1
          fi
