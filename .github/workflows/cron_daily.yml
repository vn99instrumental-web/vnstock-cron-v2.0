name: VNStock Daily

on:
  schedule:
    - cron: '0 1 * * 1-5'    # 8h00 ICT (= 1:00 UTC)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60       # tăng từ 30 → 60 cho finance scan

    env:
      VNSTOCK_API_KEY:     ${{ secrets.VNSTOCK_API_KEY }}
      VNSTOCK_DEVICE_ID:   ${{ secrets.VNSTOCK_DEVICE_ID }}
      VNSTOCK_INTERACTIVE: "0"
      VNSTOCK_LANGUAGE:    en
      VNSTOCK_VENV_PATH:   /opt/vnstock/.venv
      HOME:                /home/runner
      MPLCONFIGDIR:        /home/runner/.config/matplotlib

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ──────────────────────────────────────────────────────────────────
      # CACHE STRATEGY — Layer 2 of "latest vnstock" guarantee:
      # Cache key includes ISO week number → cache invalidates weekly.
      # Restore-keys fallback uses any older v4 cache for warm-start.
      # ──────────────────────────────────────────────────────────────────
      - name: Compute cache key suffix (weekly)
        id: cache-suffix
        run: |
          echo "week=$(date -u +%Y-W%V)" >> $GITHUB_OUTPUT
          echo "Cache suffix: $(date -u +%Y-W%V)"

      - name: Restore vnstock cache
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: |
            /opt/vnstock/.venv
            /home/runner/.vnstock
          key: vnstock-stable-v4-${{ steps.cache-suffix.outputs.week }}
          restore-keys: |
            vnstock-stable-v4-

      - name: Fallback install nếu cache miss
        if: steps.cache-venv.outputs.cache-hit != 'true'
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          pip install requests
          mkdir -p /home/runner/.vnstock
          wget -q https://vnstocks.com/files/vnstock-cli-installer.run \
            -O installer.run
          chmod +x installer.run
          ./installer.run -- \
            --non-interactive \
            --api-key "$VNSTOCK_API_KEY" \
            --venv-path "$VNSTOCK_VENV_PATH" \
            --language en
          wget -q https://vnstocks.com/files/generate_user_info.min.py \
            -O generate_user_info.min.py
          source /opt/vnstock/.venv/bin/activate
          python3 generate_user_info.min.py \
            --api-key "$VNSTOCK_API_KEY"

      - name: Install extra dependencies
        run: |
          source /opt/vnstock/.venv/bin/activate
          pip install -q gspread google-auth

      # ──────────────────────────────────────────────────────────────────
      # UPGRADE STEP — Layer 1 of "latest vnstock" guarantee:
      # CHÚ Ý: vnstock_data, vnstock_news, vnstock_ta là SPONSOR packages,
      # KHÔNG nằm trên public PyPI — phải cài qua installer.run (sponsor token).
      # Chỉ `vnstock` (public) có thể upgrade qua pip.
      # Sponsor packages → rely on weekly cache invalidation + installer fresh.
      # ──────────────────────────────────────────────────────────────────
      - name: Ensure latest vnstock packages
        run: |
          source /opt/vnstock/.venv/bin/activate
          echo "=== Current versions ==="
          pip list 2>&1 | grep -iE "vnstock" || echo "(no vnstock packages found)"
          echo ""

          echo "=== Upgrading public 'vnstock' package only ==="
          # Only `vnstock` is on public PyPI; others are sponsor-only.
          pip install --upgrade vnstock 2>&1 | tail -10 || \
            echo "⚠️ vnstock upgrade failed (continuing with cached version)"
          echo ""

          echo "=== Sponsor packages (not on PyPI — version logged only) ==="
          # vnstock_data, vnstock_news, vnstock_ta: rely on weekly cache
          # invalidation + installer.run for refresh.
          for pkg in vnstock_data vnstock_news vnstock_ta; do
            version=$(pip show "$pkg" 2>/dev/null | grep -i "^Version:" | awk '{print $2}')
            if [ -n "$version" ]; then
              echo "  $pkg: $version (sponsor — refreshes on weekly cache miss)"
            else
              echo "  $pkg: NOT INSTALLED ⚠️"
            fi
          done
          echo ""

          echo "=== Final versions ==="
          pip list 2>&1 | grep -iE "vnstock" || true

      - name: Step Context — Market PE/PB + Industry Map
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          mkdir -p /home/runner/.config/matplotlib
          source /opt/vnstock/.venv/bin/activate
          python steps/step3_context.py

      - name: Step Finance Scan — Quarterly cache (TTL-based)
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          source /opt/vnstock/.venv/bin/activate
          python steps/step_finance_scan.py

      - name: Step News — Daily crawl + index
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          source /opt/vnstock/.venv/bin/activate
          python steps/step_news_daily.py

      - name: Commit output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || \
            git commit -m "data: daily $(date +'%Y-%m-%d')"
          git push
