name: VNStock Daily

on:
  workflow_dispatch:

# Đảm bảo bước "git push" luôn có quyền ghi, kể cả khi repo để
# Workflow permissions = read-only (đặc biệt cần để ý sau khi chuyển private).
permissions:
  contents: write

# Tránh 2 run daily chồng nhau (vd scheduled + manual). cancel-in-progress
# = false để KHÔNG kill một lần finance scan đang chạy dở.
concurrency:
  group: vnstock-main-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60       # tăng từ 30 → 60 cho finance scan

    env:
      VNSTOCK_API_KEY:     ${{ secrets.VNSTOCK_API_KEY }}
      VNSTOCK_DEVICE_ID:   ${{ secrets.VNSTOCK_DEVICE_ID }}
      VNSTOCK_INTERACTIVE: "0"
      VNSTOCK_LANGUAGE:    en
      VNSTOCK_VENV_PATH:   /opt/vnstock/.venv
      HOME:                /home/runner
      MPLCONFIGDIR:        /home/runner/.config/matplotlib

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: '3.11'

      # ──────────────────────────────────────────────────────────────────
      # CACHE STRATEGY — Layer 2 of "latest vnstock" guarantee:
      # Cache key follows runner OS, architecture, and ISO week. Do not include the
      # setup-python patch because GitHub alternates runner images during rollouts,
      # while VNStock owns a different Python inside this virtualenv.
      # ──────────────────────────────────────────────────────────────────
      - name: Compute cache key suffix (weekly)
        id: cache-suffix
        run: |
          image="$(. /etc/os-release && echo "${ID}-${VERSION_ID}")"
          week="$(date -u +%Y-W%V)"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "suffix=${image}-${{ runner.arch }}-${week}" >> "$GITHUB_OUTPUT"
          echo "Cache suffix: ${image}-${{ runner.arch }}-${week}"

      - name: Restore vnstock cache
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: |
            /opt/vnstock/.venv
            /home/runner/.vnstock
            /home/runner/.local/bin/uv
          key: vnstock-stable-v5-${{ steps.cache-suffix.outputs.suffix }}
          restore-keys: |
            vnstock-stable-v5-${{ steps.cache-suffix.outputs.image }}-py

      - name: Validate cached vnstock environment
        id: validate-venv
        shell: bash
        run: |
          venv_python="$VNSTOCK_VENV_PATH/bin/python"
          if [ -x "$venv_python" ] && "$venv_python" -c "import pandas"; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "Cached vnstock environment is healthy."
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "Cached vnstock environment is missing or incompatible; it will be rebuilt."
          fi

      - name: Install vnstock environment if cache is missing or invalid
        if: steps.validate-venv.outputs.valid != 'true'
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          if [ -d "$VNSTOCK_VENV_PATH" ]; then
            rm -rf -- "$VNSTOCK_VENV_PATH"
          fi
          python -m pip install requests
          mkdir -p /home/runner/.vnstock
          wget -q https://vnstocks.com/files/vnstock-cli-installer.run \
            -O installer.run
          chmod +x installer.run
          ./installer.run -- \
            --non-interactive \
            --api-key "$VNSTOCK_API_KEY" \
            --venv-path "$VNSTOCK_VENV_PATH" \
            --language en
          wget -q https://vnstocks.com/files/generate_user_info.min.py \
            -O generate_user_info.min.py
          "$VNSTOCK_VENV_PATH/bin/python" -c "import pandas"
          "$VNSTOCK_VENV_PATH/bin/python" generate_user_info.min.py \
            --api-key "$VNSTOCK_API_KEY"

      - name: Install extra dependencies
        shell: bash
        run: |
          venv_python="$VNSTOCK_VENV_PATH/bin/python"
          test -x "$venv_python"

          if ! "$venv_python" -m pip --version >/dev/null 2>&1; then
            uv_bin="$(command -v uv || true)"
            if [ -z "$uv_bin" ] && [ -x "$HOME/.local/bin/uv" ]; then
              uv_bin="$HOME/.local/bin/uv"
            fi
            if [ -z "$uv_bin" ]; then
              echo "::error::VNStock venv has no pip and the installer-provided uv executable was not found."
              exit 1
            fi

            echo "Bootstrapping pip into VNStock venv with $uv_bin"
            "$uv_bin" pip install --python "$venv_python" pip
          fi

          "$venv_python" -m pip --version
          "$venv_python" -m pip install -q gspread google-auth

      # ──────────────────────────────────────────────────────────────────
      # UPGRADE STEP — Layer 1 of "latest vnstock" guarantee:
      # IMPORTANT: Use venv's pip DIRECTLY (not relying on `source activate`
      # which doesn't always survive shell context in GitHub Actions).
      # Sponsor packages refresh via weekly cache invalidation only.
      # ──────────────────────────────────────────────────────────────────
      - name: Ensure latest vnstock packages
        run: |
          # Use venv's pip directly to avoid shell context issues
          VENV_PYTHON="$VNSTOCK_VENV_PATH/bin/python"

          if [ ! -x "$VENV_PYTHON" ]; then
            echo "❌ Venv Python not found at $VENV_PYTHON"
            exit 1
          fi
          "$VENV_PYTHON" -m pip --version

          echo "=== Current versions (venv: /opt/vnstock/.venv) ==="
          "$VENV_PYTHON" -m pip list 2>&1 | grep -iE "vnstock|vnai" || echo "(none found)"
          echo ""

          echo "=== Upgrading public 'vnstock' package only ==="
          "$VENV_PYTHON" -m pip install --upgrade vnstock 2>&1 | tail -5 || \
            echo "⚠️ vnstock upgrade failed (continuing)"
          echo ""

          echo "=== Sponsor packages (refresh on weekly cache miss) ==="
          for pkg in vnstock_data vnstock_news vnstock_ta; do
            version=$("$VENV_PYTHON" -m pip show "$pkg" 2>/dev/null | grep -i "^Version:" | awk '{print $2}')
            if [ -n "$version" ]; then
              echo "  $pkg: $version"
            else
              echo "  $pkg: NOT INSTALLED ⚠️"
            fi
          done
          echo ""

          echo "=== Final versions ==="
          "$VENV_PYTHON" -m pip list 2>&1 | grep -iE "vnstock|vnai" || true

      - name: Step Context — Market PE/PB + Industry Map
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          mkdir -p /home/runner/.config/matplotlib
          "$VNSTOCK_VENV_PATH/bin/python" steps/step3_context.py

      - name: Step Finance Scan — Quarterly cache (TTL-based)
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          "$VNSTOCK_VENV_PATH/bin/python" steps/step_finance_scan_vci.py

      # ──────────────────────────────────────────────────────────────────
      # [DISABLED 2026-06-17] News crawl — tạm tắt để tối ưu thời gian run.
      # Lý do: news_score chỉ ±5/200 (~2.5% trọng số), 88% articles short_desc
      # rỗng, symbol mention rate 1.2% → ROI thấp so với ~2-3 phút crawl 14 sites.
      # step_scoring.py tự fallback news_score=0 khi today_index.json không tồn tại
      # (warning: "news_today_index.json not found — news_score = neutral (0)").
      # step_scoring_v2.py không dùng news từ thiết kế.
      # Re-enable: uncomment block dưới. Giữ nguyên steps/step_news_daily.py,
      # utils/industry_keywords.py, output/news/history.json để bật lại không mất data.
      # ──────────────────────────────────────────────────────────────────
      # - name: Step News — Daily crawl + index
      #   env:
      #     VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
      #     VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
      #   run: |
      #     source /opt/vnstock/.venv/bin/activate
      #     python steps/step_news_daily.py

      # ──────────────────────────────────────────────────────────────────
      # COMMIT OUTPUT — hardened:
      # GitHub hay xả nhiều run gần nhau → daily + intraday có thể push
      # đụng nhau (non-fast-forward rejected). Pull --rebase + retry loop
      # giúp run sau tự nối tiếp thay vì fail và mất data lần đó.
      # ──────────────────────────────────────────────────────────────────
      - name: Commit output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add output/
          if git diff --staged --quiet; then
            echo "No changes to commit — skipping."
            exit 0
          fi
          git commit -m "data: daily $(date +'%Y-%m-%d')"

          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "✅ pushed (attempt $i)"
              pushed=1
              break
            fi
            echo "⚠️ push attempt $i failed — retrying..."
            sleep $((RANDOM % 5 + 3))
          done

          if [ "$pushed" -ne 1 ]; then
            echo "❌ push failed after 5 attempts"
            exit 1
          fi
