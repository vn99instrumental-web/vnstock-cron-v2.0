name: VNStock 6 native candidate

on:
  workflow_dispatch:
    inputs:
      force:
        description: Run before the configured cutover date
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HOME: /home/runner
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore generation 6 environment
        id: cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.venv_6x
          key: vnstock-gen6-6.0.0-oapi0.1.1-${{ runner.os }}-python311
      - name: Create generation 6 environment
        if: steps.cache.outputs.cache-hit != 'true'
        run: python3 -m venv ~/.venv_6x
      - name: Install pinned generation 6
        run: ~/.venv_6x/bin/python -m pip install -U --extra-index-url https://vnstocks.com/api/packages "vnstock==6.0.0" "vnstock-oapi==0.1.1"
      - name: Build and validate native candidate
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
          SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
          SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}
          FHSC_API_KEY: ${{ secrets.FINHAY_API_KEY }}
        run: |
          test -n "$VNSTOCK_API_KEY"
          test -n "$SSI_API_KEY"
          test -n "$SSI_API_SECRET"
          test -n "$FHSC_API_KEY"
          ~/.venv_6x/bin/python -c "import os, vnstock; vnstock.login(os.environ['VNSTOCK_API_KEY'])"
          force=()
          if [ "${{ inputs.force }}" = "true" ]; then force+=(--force); fi
          ~/.venv_6x/bin/python scripts/vnstock6_native_pipeline.py run "${force[@]}"
          ~/.venv_6x/bin/python scripts/vnstock6_native_pipeline.py evaluate
          ~/.venv_6x/bin/python scripts/build_dashboard_serving_local.py --full --versions v6.1-availability
          ~/.venv_6x/bin/python scripts/materialize_vnstock6_serving.py \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ~/.venv_6x/bin/python scripts/validate_vnstock6_candidate.py \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --output comparison/native-candidate-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: vnstock6-native-candidate-summary
          path: comparison/native-candidate-summary.json
          if-no-files-found: error
          retention-days: 7
