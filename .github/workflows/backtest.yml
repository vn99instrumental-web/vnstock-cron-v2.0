name: Backtest Calibration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: |
          Chế độ chạy:
            full      = build data (fetch VCI) + evaluate + grid search (~20 phút)
            eval-only = chỉ evaluate/grid search, dùng dataset đã cache (~2 phút)
            quick     = test nhanh 10 symbols (~3 phút)
        required: true
        default: 'quick'
        type: choice
        options:
          - quick
          - full
          - eval-only
          - audit
          - drift
          - sector
      horizon:
        description: 'Forward return horizon (ngày): 1/3/5/10/20'
        required: false
        default: '5'
        type: choice
        options:
          - '1'
          - '3'
          - '5'
          - '10'
          - '20'
          - 'all'
      threshold:
        description: '|score| threshold để tính hit rate (mặc định: 20)'
        required: false
        default: '20'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # đủ cho full run 150 symbols

    env:
      VNSTOCK_API_KEY:     ${{ secrets.VNSTOCK_API_KEY }}
      VNSTOCK_DEVICE_ID:   ${{ secrets.VNSTOCK_DEVICE_ID }}
      VNSTOCK_INTERACTIVE: "0"
      VNSTOCK_LANGUAGE:    en
      VNSTOCK_VENV_PATH:   /opt/vnstock/.venv
      HOME:                /home/runner
      MPLCONFIGDIR:        /home/runner/.config/matplotlib

    steps:
      # ── Checkout ────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Restore vnstock packages (dùng chung cache với production) ──
      - name: Compute cache key
        id: cache-suffix
        run: echo "week=$(date -u +%Y-W%V)" >> $GITHUB_OUTPUT

      - name: Restore vnstock cache
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: |
            /opt/vnstock/.venv
            /home/runner/.vnstock
          key: vnstock-stable-v4-${{ steps.cache-suffix.outputs.week }}
          restore-keys: |
            vnstock-stable-v4-

      # ── Verify venv + dependencies ──────────────────────────────────
      # Diagnostic xác nhận: venv ở /opt/vnstock/.venv ĐÚNG sau cache restore.
      # Venv KHÔNG có pip executable (chỉ có python) → dùng `python -m pip`.
      # pandas + pyarrow ĐÃ CÓ SẴN trong venv → không cần install gì.
      - name: Verify venv + dependencies
        run: |
          VENV_PY="/opt/vnstock/.venv/bin/python"

          if [ ! -x "$VENV_PY" ]; then
            echo "❌ Venv python không tìm thấy tại $VENV_PY"
            echo "   Cache restore có thể fail — kiểm tra step Restore vnstock cache"
            exit 1
          fi

          echo "✓ Venv python: $VENV_PY"
          echo "=== Verify imports ==="
          $VENV_PY -c "
          import sys
          print(f'Python: {sys.version.split()[0]}')
          import vnstock_ta;  print('vnstock_ta: OK')
          import vnstock_data; print('vnstock_data: OK')
          import pandas;      print(f'pandas: {pandas.__version__}')
          import pyarrow;     print(f'pyarrow: {pyarrow.__version__}')
          import numpy;       print(f'numpy: {numpy.__version__}')
          "

          # Fallback: cài pandas/pyarrow qua python -m pip nếu thiếu
          $VENV_PY -c "import pandas, pyarrow" 2>/dev/null || {
            echo "⚠️ pandas/pyarrow thiếu — cài qua python -m pip"
            $VENV_PY -m pip install pandas pyarrow --quiet
          }

      # ── Restore dataset cache ───────────────────────────────────────
      # audit/eval-only/drift dùng CHUNG dataset với full (150 symbols).
      # quick riêng (10 sym).
      - name: Restore dataset cache
        id: dataset-cache
        uses: actions/cache@v4
        with:
          path: backtest_output/dataset.parquet
          key: backtest-dataset-v2-${{ (github.event.inputs.mode == 'audit' || github.event.inputs.mode == 'eval-only' || github.event.inputs.mode == 'drift' || github.event.inputs.mode == 'sector') && 'full' || github.event.inputs.mode }}-${{ hashFiles('backtest/bt_config.py', 'backtest/bt_data.py') }}
          restore-keys: |
            backtest-dataset-v2-full-

      # ── Restore drift history (tích lũy qua các lần chạy) ───────────
      - name: Restore drift history
        if: ${{ github.event.inputs.mode == 'drift' }}
        uses: actions/cache@v4
        with:
          path: backtest_output/drift_history.json
          key: backtest-drift-history-${{ github.run_id }}
          restore-keys: |
            backtest-drift-history-

      # ── Run backtest ─────────────────────────────────────────────────
      - name: Run — quick (10 symbols)
        if: ${{ github.event.inputs.mode == 'quick' }}
        run: |
          mkdir -p backtest_output/reports
          source /opt/vnstock/.venv/bin/activate
          python backtest/bt_run.py \
            --max 10 \
            --horizon ${{ github.event.inputs.horizon == 'all' && '5' || github.event.inputs.horizon }} \
            --threshold ${{ github.event.inputs.threshold }}

      - name: Run — full (tất cả symbols, fetch VCI)
        if: ${{ github.event.inputs.mode == 'full' }}
        run: |
          mkdir -p backtest_output/reports
          source /opt/vnstock/.venv/bin/activate
          if [ "${{ github.event.inputs.horizon }}" = "all" ]; then
            python backtest/bt_run.py \
              --threshold ${{ github.event.inputs.threshold }} \
              --all-horizons
          else
            python backtest/bt_run.py \
              --horizon ${{ github.event.inputs.horizon }} \
              --threshold ${{ github.event.inputs.threshold }}
          fi

      - name: Run — eval-only (dùng dataset cache)
        if: ${{ github.event.inputs.mode == 'eval-only' }}
        run: |
          mkdir -p backtest_output/reports
          source /opt/vnstock/.venv/bin/activate
          if [ -f backtest_output/dataset.parquet ]; then
            echo "Dataset cache found — skip build"
            if [ "${{ github.event.inputs.horizon }}" = "all" ]; then
              python backtest/bt_run.py \
                --skip-build \
                --threshold ${{ github.event.inputs.threshold }} \
                --all-horizons
            else
              python backtest/bt_run.py \
                --skip-build \
                --horizon ${{ github.event.inputs.horizon }} \
                --threshold ${{ github.event.inputs.threshold }}
            fi
          else
            echo "⚠️ Dataset cache không có — fallback sang quick mode (10 symbols)"
            python backtest/bt_run.py \
              --max 10 \
              --horizon ${{ github.event.inputs.horizon == 'all' && '5' || github.event.inputs.horizon }} \
              --threshold ${{ github.event.inputs.threshold }}
          fi

      - name: Run — audit (per-indicator predictiveness)
        if: ${{ github.event.inputs.mode == 'audit' }}
        run: |
          mkdir -p backtest_output/reports
          source /opt/vnstock/.venv/bin/activate
          if [ ! -f backtest_output/dataset.parquet ]; then
            echo "Dataset full chưa có — build trước (fetch VCI ~3 phút)..."
            python backtest/bt_run.py --eval-only --horizon 5 || true
          fi
          if [ ! -f backtest_output/dataset.parquet ]; then
            echo "Vẫn chưa có dataset — build full..."
            python backtest/bt_data.py
          fi
          echo "=== Chạy indicator audit ==="
          if [ "${{ github.event.inputs.horizon }}" = "all" ]; then
            python backtest/bt_audit.py --all-horizons
          else
            python backtest/bt_audit.py --horizon ${{ github.event.inputs.horizon }}
          fi

      # ── Sector-rank audit (thêm 23/07/2026) ──────────────────────────
      # Kiểm giả thuyết CÒN LẠI sau khi walk-forward bác bỏ chấm điểm theo
      # ngưỡng tuyệt đối: xếp hạng cắt ngang trong nhóm ngành có edge không.
      - name: Run — sector (xếp hạng trong nhóm ngành + walk-forward)
        if: ${{ github.event.inputs.mode == 'sector' }}
        run: |
          mkdir -p backtest_output/reports
          source /opt/vnstock/.venv/bin/activate
          if [ ! -f backtest_output/dataset.parquet ]; then
            echo "Dataset chưa có — build (fetch VCI ~5 phút)..."
            python backtest/bt_data.py
          fi
          echo "=== Sector-rank audit ==="
          if [ "${{ github.event.inputs.horizon }}" = "all" ]; then
            python backtest/bt_audit.py --sector-only --all-horizons
          else
            python backtest/bt_audit.py --sector-only \
              --horizon ${{ github.event.inputs.horizon }}
          fi

      - name: Run — drift (theo dõi edge theo thời gian)
        if: ${{ github.event.inputs.mode == 'drift' }}
        run: |
          mkdir -p backtest_output/reports
          source /opt/vnstock/.venv/bin/activate
          if [ ! -f backtest_output/dataset.parquet ]; then
            echo "Dataset full chưa có — build (fetch VCI ~3 phút)..."
            python backtest/bt_data.py
          fi
          echo "=== Chạy drift detection ==="
          if [ "${{ github.event.inputs.horizon }}" = "all" ]; then
            for h in 1 3 5; do
              python backtest/bt_drift.py --horizon $h
            done
          else
            python backtest/bt_drift.py --horizon ${{ github.event.inputs.horizon }}
          fi

      # ── In kết quả vào log (đọc ngay trên GitHub Actions UI) ────────
      - name: Print summary reports
        if: always()
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║              BACKTEST RESULTS SUMMARY                ║"
          echo "╚══════════════════════════════════════════════════════╝"

          for f in backtest_output/reports/summary_h*.txt; do
            if [ -f "$f" ]; then
              echo ""
              echo "────────────────────────────────────────"
              echo "  $f"
              echo "────────────────────────────────────────"
              cat "$f"
            fi
          done

          echo ""
          echo "────────────────────────────────────────"
          echo "  Grid search top 5 (hit_avg sorted)"
          echo "────────────────────────────────────────"
          for f in backtest_output/reports/grid_caps_h*.csv; do
            if [ -f "$f" ]; then
              echo ""
              echo "  $f:"
              # In 6 dòng đầu (header + top 5)
              head -6 "$f"
            fi
          done

          echo ""
          echo "────────────────────────────────────────"
          echo "  Walk-forward validation"
          echo "────────────────────────────────────────"
          for f in backtest_output/reports/walk_forward_h*.csv; do
            if [ -f "$f" ]; then
              echo ""
              echo "  $f:"
              cat "$f"
            fi
          done

          echo ""
          echo "────────────────────────────────────────"
          echo "  Indicator audit (nếu mode=audit)"
          echo "────────────────────────────────────────"
          for f in backtest_output/reports/audit_*.csv; do
            if [ -f "$f" ]; then
              echo ""
              echo "  $f:"
              cat "$f"
            fi
          done

          echo ""
          echo "────────────────────────────────────────"
          echo "  Sector-rank audit (nếu mode=sector)"
          echo "────────────────────────────────────────"
          for f in backtest_output/reports/audit_sector_*.csv; do
            if [ -f "$f" ]; then
              echo ""
              echo "  $f:"
              cat "$f"
            fi
          done
          echo ""
          echo "────────────────────────────────────────"
          echo "  Drift detection (nếu mode=drift)"
          echo "────────────────────────────────────────"
          for f in backtest_output/reports/drift_*.csv; do
            if [ -f "$f" ]; then
              echo ""
              echo "  $f:"
              cat "$f"
            fi
          done

      # ── Cache dataset (chỉ quick/full build mới — không ghi đè khi audit/eval/drift) ─
      - name: Save dataset cache
        if: ${{ (github.event.inputs.mode == 'quick' || github.event.inputs.mode == 'full' || github.event.inputs.mode == 'sector') && success() }}
        uses: actions/cache/save@v4
        with:
          path: backtest_output/dataset.parquet
          key: backtest-dataset-v2-${{ github.event.inputs.mode }}-${{ hashFiles('backtest/bt_config.py', 'backtest/bt_data.py') }}

      # ── Save drift history (tích lũy — key theo run_id để luôn lưu bản mới) ─
      - name: Save drift history
        if: ${{ github.event.inputs.mode == 'drift' && success() }}
        uses: actions/cache/save@v4
        with:
          path: backtest_output/drift_history.json
          key: backtest-drift-history-${{ github.run_id }}

      # ── Upload artifacts (tải về nếu muốn phân tích thêm) ───────────
      - name: Upload reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-reports-${{ github.run_id }}
          path: |
            backtest_output/reports/
            backtest_output/drift_history.json
          retention-days: 30
          if-no-files-found: warn
