name: VNStock Intraday

on:
  schedule:
    - cron: '25 1 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    env:
      VNSTOCK_API_KEY:     ${{ secrets.VNSTOCK_API_KEY }}
      VNSTOCK_INTERACTIVE: "0"
      VNSTOCK_LANGUAGE:    en
      VNSTOCK_VENV_PATH:   /opt/vnstock/.venv
      HOME:                /home/runner
      MPLCONFIGDIR:        /home/runner/.config/matplotlib

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Restore cache từ daily — không install lại
      - name: Restore vnstock cache
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: |
            /opt/vnstock/.venv
            /home/runner/.vnstock
          key: vnstock-stable-v4

      # Fallback nếu cache miss (daily chưa chạy hoặc cache expired)
      - name: Fallback install nếu cache miss
        if: steps.cache-venv.outputs.cache-hit != 'true'
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          echo "⚠️ Cache miss — chạy fallback install"
          pip install requests
          mkdir -p /home/runner/.vnstock
          mkdir -p /home/runner/.config/matplotlib
          wget -q https://vnstocks.com/files/vnstock-cli-installer.run \
            -O installer.run
          chmod +x installer.run
          ./installer.run -- \
            --non-interactive \
            --api-key "$VNSTOCK_API_KEY" \
            --venv-path "$VNSTOCK_VENV_PATH" \
            --language en
          wget -q https://vnstocks.com/files/generate_user_info.min.py \
            -O generate_user_info.min.py
          source /opt/vnstock/.venv/bin/activate
          python3 generate_user_info.min.py \
            --api-key "$VNSTOCK_API_KEY"
          echo "✅ Fallback install done"

      - name: Install extra dependencies
        run: |
          source /opt/vnstock/.venv/bin/activate
          pip install -q gspread google-auth

      - name: Step 1 — Ranking + Snapshot
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          mkdir -p /home/runner/.config/matplotlib
          source /opt/vnstock/.venv/bin/activate
          python steps/step1_ranking.py

      - name: Step 2 — Deep Analysis
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          source /opt/vnstock/.venv/bin/activate
          python steps/step2_deep.py

      - name: Commit output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || \
            git commit -m "data: $(date +'%Y-%m-%d %H:%M') ICT"
          git push
