name: VNStock Intraday

on:
  schedule:
    # Vietnam market hours: 09:00-15:00 ICT (UTC+7), nghỉ trưa 11:30-13:00
    # 5 runs/ngày tại :30 — bỏ 12:30 ICT (giờ nghỉ trưa)
    - cron: '30 2 * * 1-5'   # 09:30 ICT (= 2:30 UTC)
    - cron: '30 3 * * 1-5'   # 10:30 ICT
    - cron: '30 4 * * 1-5'   # 11:30 ICT
    - cron: '30 6 * * 1-5'   # 13:30 ICT
    - cron: '30 7 * * 1-5'   # 14:30 ICT
  workflow_dispatch:

# Đảm bảo bước "git push" luôn có quyền ghi, kể cả khi repo để
# Workflow permissions = read-only (đặc biệt cần để ý sau khi chuyển private).
permissions:
  contents: write

# Khi GitHub dồn nhiều scheduled run rồi xả cùng lúc, group này serialize
# các run intraday → không có 2 run cùng commit/push một lúc.
concurrency:
  group: vnstock-intraday
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # giảm từ 480 — concurrent ~35-45s total

    env:
      VNSTOCK_API_KEY:     ${{ secrets.VNSTOCK_API_KEY }}
      VNSTOCK_DEVICE_ID:   ${{ secrets.VNSTOCK_DEVICE_ID }}
      VNSTOCK_INTERACTIVE: "0"
      VNSTOCK_LANGUAGE:    en
      VNSTOCK_VENV_PATH:   /opt/vnstock/.venv
      HOME:                /home/runner
      MPLCONFIGDIR:        /home/runner/.config/matplotlib

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ──────────────────────────────────────────────────────────────────
      # CACHE STRATEGY — Layer 2 of "latest vnstock":
      # Weekly cache key → invalidates auto every week.
      # ──────────────────────────────────────────────────────────────────
      - name: Compute cache key suffix (weekly)
        id: cache-suffix
        run: |
          echo "week=$(date -u +%Y-W%V)" >> $GITHUB_OUTPUT

      - name: Restore vnstock cache
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: |
            /opt/vnstock/.venv
            /home/runner/.vnstock
          key: vnstock-stable-v4-${{ steps.cache-suffix.outputs.week }}
          restore-keys: |
            vnstock-stable-v4-

      - name: Fallback install nếu cache miss
        if: steps.cache-venv.outputs.cache-hit != 'true'
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          pip install requests
          mkdir -p /home/runner/.vnstock
          wget -q https://vnstocks.com/files/vnstock-cli-installer.run \
            -O installer.run
          chmod +x installer.run
          ./installer.run -- \
            --non-interactive \
            --api-key "$VNSTOCK_API_KEY" \
            --venv-path "$VNSTOCK_VENV_PATH" \
            --language en
          wget -q https://vnstocks.com/files/generate_user_info.min.py \
            -O generate_user_info.min.py
          source /opt/vnstock/.venv/bin/activate
          python3 generate_user_info.min.py \
            --api-key "$VNSTOCK_API_KEY"

      - name: Install extra dependencies
        run: |
          source /opt/vnstock/.venv/bin/activate
          pip install -q gspread google-auth

      # ──────────────────────────────────────────────────────────────────
      # UPGRADE STEP — use venv pip directly (avoid shell context issues).
      # Sponsor packages refresh via weekly cache miss only.
      # ──────────────────────────────────────────────────────────────────
      - name: Ensure latest vnstock packages
        run: |
          VENV_PIP="/opt/vnstock/.venv/bin/pip"

          if [ ! -x "$VENV_PIP" ]; then
            echo "⚠️ Venv pip not found at $VENV_PIP — skipping upgrade"
            exit 0
          fi

          echo "=== Current versions ==="
          $VENV_PIP list 2>&1 | grep -iE "vnstock|vnai" || echo "(none found)"
          echo ""

          echo "=== Upgrading public 'vnstock' package only ==="
          $VENV_PIP install --upgrade vnstock 2>&1 | tail -5 || \
            echo "⚠️ vnstock upgrade failed (continuing)"
          echo ""

          echo "=== Sponsor packages ==="
          for pkg in vnstock_data vnstock_news vnstock_ta; do
            version=$($VENV_PIP show "$pkg" 2>/dev/null | grep -i "^Version:" | awk '{print $2}')
            if [ -n "$version" ]; then
              echo "  $pkg: $version"
            else
              echo "  $pkg: NOT INSTALLED ⚠️"
            fi
          done

      - name: Step Snapshot — Ranking + Deep (concurrent)
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          mkdir -p /home/runner/.config/matplotlib
          source /opt/vnstock/.venv/bin/activate
          python steps/step_snapshot.py

      # Phase 1.3: Order Flow MUST run BEFORE Scoring
      # because step_scoring.py now reads order_flow.json
      - name: Step Order Flow (concurrent)
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          source /opt/vnstock/.venv/bin/activate
          python steps/step_order_flow.py

      - name: Step Scoring
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          source /opt/vnstock/.venv/bin/activate
          python steps/step_scoring.py

      # NEW: Trade levels (entry/SL/TP) — runs AFTER scoring.
      # Reads signals.json + order_flow.json only (no API calls).
      - name: Step Price Levels
        env:
          VNSTOCK_API_KEY:   ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_DEVICE_ID: ${{ secrets.VNSTOCK_DEVICE_ID }}
        run: |
          source /opt/vnstock/.venv/bin/activate
          python steps/step_price_levels.py

      # ──────────────────────────────────────────────────────────────────
      # COMMIT OUTPUT — hardened:
      # GitHub hay xả nhiều run gần nhau → daily + intraday có thể push
      # đụng nhau (non-fast-forward rejected). Pull --rebase + retry loop
      # giúp run sau tự nối tiếp thay vì fail và mất data lần đó.
      # ──────────────────────────────────────────────────────────────────
      - name: Commit output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add output/
          if git diff --staged --quiet; then
            echo "No changes to commit — skipping."
            exit 0
          fi
          git commit -m "data: $(date +'%Y-%m-%d %H:%M') ICT"

          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "✅ pushed (attempt $i)"
              pushed=1
              break
            fi
            echo "⚠️ push attempt $i failed — retrying..."
            sleep $((RANDOM % 5 + 3))
          done

          if [ "$pushed" -ne 1 ]; then
            echo "❌ push failed after 5 attempts"
            exit 1
          fi
