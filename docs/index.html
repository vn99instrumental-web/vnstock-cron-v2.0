<style>
:root{
  --bg:#07111b;--surf:#0d1e2e;--surf2:#112438;--border:#1c3248;--border2:#244060;
  --text:#c8dcea;--muted:#4e7a99;--dim:#1e3a52;
  --sb:#00e896;--sb-bg:#001f12;--buy:#34c26e;--buy-bg:#041508;
  --neu:#f5c240;--neu-bg:#1a1400;--sell:#e86030;--sell-bg:#1a0800;
  --ss:#e02040;--ss-bg:#180308;--acc:#14b8d4;
  --mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--dim);border-radius:2px}
.topbar{position:sticky;top:0;z-index:100;background:rgba(7,17,27,.94);border-bottom:1px solid var(--border);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:50px}
.logo{font-family:var(--mono);font-size:13px;color:var(--acc);letter-spacing:.06em}
.logo em{color:var(--muted);font-style:normal}
.topbar-r{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--buy);animation:blink 2s infinite;margin-right:4px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.vtag{font-size:9px;background:#0d2035;border:1px solid #1a3555;color:var(--acc);padding:2px 7px;border-radius:2px}
.mstrip{background:linear-gradient(90deg,#090f18,#0c1c2e 60%,#07111b);border-bottom:1px solid var(--border);padding:8px 20px;display:flex;align-items:center;gap:22px;overflow-x:auto}
.mi{display:flex;flex-direction:column;gap:1px;min-width:72px;flex-shrink:0}
.mi-l{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.mi-v{font-family:var(--mono);font-size:12px;font-weight:700}
.up{color:var(--buy)}.dn{color:var(--sell)}.warn{color:var(--neu)}.hi{color:var(--acc)}
.sep{width:1px;height:26px;background:var(--border);flex-shrink:0}
.regime{margin-left:auto;flex-shrink:0;font-family:var(--mono);font-size:9px;font-weight:700;padding:4px 12px;border-radius:2px;border:1px solid var(--neu-b,#604800);background:var(--neu-bg);color:var(--neu)}
.page{display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 84px)}
@media(max-width:720px){.page{grid-template-columns:1fr}.sidebar{display:none}}
.sidebar{background:var(--surf);border-right:1px solid var(--border);padding:14px 0;overflow-y:auto}
.sb-s{padding:0 14px 14px}
.sb-t{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.fbs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.fl{font-size:11px;color:var(--muted);margin-bottom:5px}
.fb{font-family:var(--mono);font-size:9px;padding:3px 7px;border:1px solid var(--border);border-radius:2px;background:0;color:var(--muted);cursor:pointer;transition:all .15s}
.fb:hover{border-color:var(--acc);color:var(--text)}
.fb.on{border-color:var(--acc);background:#0c2035;color:var(--acc)}
.fb.on-sb{border-color:var(--sb);background:var(--sb-bg);color:var(--sb)}
.fb.on-buy{border-color:var(--buy);background:var(--buy-bg);color:var(--buy)}
.fb.on-neu{border-color:var(--neu);background:var(--neu-bg);color:var(--neu)}
.fb.on-sell{border-color:var(--sell);background:var(--sell-bg);color:var(--sell)}
.fb.on-ss{border-color:var(--ss);background:var(--ss-bg);color:var(--ss)}
.stat-r{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #101e2c;font-size:11px}
.stat-r:last-child{border:none}
.sk{font-family:var(--mono);font-size:10px;color:var(--muted)}
.sv{font-family:var(--mono);font-weight:700}
.main{padding:16px 18px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tsel{font-family:var(--mono);font-size:10px;background:var(--surf);border:1px solid var(--border);color:var(--text);padding:5px 9px;border-radius:2px;cursor:pointer}
.tsel:focus{outline:none;border-color:var(--acc)}
.tcnt{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted)}
.tcnt b{color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:14px}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
/* CARD */
.card{background:var(--surf);border:1px solid var(--border);border-radius:5px;overflow:hidden;position:relative;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:var(--border2);box-shadow:0 4px 20px rgba(0,0,0,.4)}
.card.open{border-color:var(--acc)}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.card.SB::before{background:var(--sb)}.card.BUY::before{background:var(--buy)}
.card.NEU::before{background:var(--neu)}.card.SEL::before{background:var(--sell)}.card.SS::before{background:var(--ss)}
.ch{padding:12px 14px 10px 17px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ch-l{display:flex;flex-direction:column;gap:4px}
.sym-line{display:flex;align-items:center;gap:8px}
.sym{font-family:var(--mono);font-size:19px;font-weight:700;color:#dceefa;letter-spacing:.05em}
.dec-badge{font-family:var(--mono);font-size:10px;font-weight:700;padding:3px 9px;border-radius:2px;border:1px solid;letter-spacing:.06em}
.db-SB{background:var(--sb-bg);border-color:var(--sb);color:var(--sb)}
.db-BUY{background:var(--buy-bg);border-color:var(--buy);color:var(--buy)}
.db-NEU{background:var(--neu-bg);border-color:var(--neu);color:var(--neu)}
.db-SEL{background:var(--sell-bg);border-color:var(--sell);color:var(--sell)}
.db-SS{background:var(--ss-bg);border-color:var(--ss);color:var(--ss)}
.meta-line{font-size:11px;color:var(--muted);display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.ch-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.score-big{font-family:var(--mono);font-size:24px;font-weight:700;line-height:1}
.c-sb{color:var(--sb)}.c-buy{color:var(--buy)}.c-neu{color:var(--neu)}.c-sell{color:var(--sell)}.c-ss{color:var(--ss)}
/* TRADE BLOCK */
.trade-blk{padding:10px 14px 10px 17px;border-top:1px solid var(--border)}
.trade-row{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.tl{font-size:11px;color:var(--muted);width:95px;flex-shrink:0}
.tv{font-family:var(--mono);font-size:13px;font-weight:600}
.tv.price{font-size:16px;color:#e0eefa}
.tv.tp{color:var(--buy)}.tv.sl{color:var(--sell)}.tv.entry{color:var(--acc)}
.pct{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:2px}
.pct-p{background:var(--buy-bg);color:var(--buy)}.pct-n{background:var(--sell-bg);color:var(--sell)}
.rr-blk{margin-top:6px;padding:7px 10px;border-radius:3px;background:#0a1a28;border:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:10px}
.rr-val{color:var(--text);font-weight:700;font-size:13px}
.rr-note{color:var(--muted)}
.size-chip{font-weight:700;padding:2px 8px;border-radius:2px;font-size:10px;border:1px solid}
.sc-FULL{border-color:var(--sb);color:var(--sb);background:var(--sb-bg)}
.sc-HALF{border-color:var(--neu);color:var(--neu);background:var(--neu-bg)}
.sc-NO{border-color:var(--muted);color:var(--muted);background:transparent}
/* VERDICT */
.verdict-blk{padding:10px 14px 10px 17px;border-top:1px solid var(--border)}
.pc-item{display:flex;align-items:flex-start;gap:7px;margin-bottom:5px;font-size:12px;line-height:1.55}
.pc-item:last-child{margin-bottom:0}
.warn-box{margin-top:8px;padding:7px 10px;border-radius:3px;background:#0d1822;border:1px solid var(--border);font-size:11px;color:var(--muted);line-height:1.6}
.pflag{display:inline-block;font-family:var(--mono);font-size:9px;padding:2px 8px;border-radius:2px;border:1px solid;letter-spacing:.05em;margin:0 4px 4px 0}
.pf-BULL_TRAP_RISK{border-color:var(--neu);color:var(--neu);background:var(--neu-bg)}
.pf-CONSENSUS_BULL{border-color:var(--sb);color:var(--sb);background:var(--sb-bg)}
/* SCORE BARS */
.sbar-blk{padding:10px 14px 8px 17px;border-top:1px solid var(--border)}
.sbar-ttl{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.sbar-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.sbar-icon{font-size:10px;flex-shrink:0}
.sbar-lbl{font-size:11px;color:var(--muted);width:82px;flex-shrink:0}
.sbar-track{flex:1;height:6px;background:#0d1e2e;border-radius:3px;overflow:hidden}
.sbar-fill{height:100%;border-radius:3px}
.sbar-num{font-family:var(--mono);font-size:10px;width:54px;text-align:right;flex-shrink:0}
.sum-row{display:flex;justify-content:space-between;align-items:center;margin-top:7px;padding-top:7px;border-top:1px solid var(--border);font-family:var(--mono);font-size:11px}
.sum-val{font-size:14px;font-weight:700}
/* TABS */
.card-detail{display:none;border-top:1px solid var(--border);background:#080f18}
.card.open .card-detail{display:block}
.tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;flex-shrink:0}
.tab:hover{color:var(--text)}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.pane{display:none;padding:14px 14px 14px 17px}
.pane.on{display:block}
/* INDICATOR GROUPS — Telegram style bullets */
.ind-grp{margin-bottom:16px}
.ind-grp-hdr{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--acc);margin-bottom:7px;padding-bottom:6px;border-bottom:1px solid var(--border);letter-spacing:.06em}
.ind-grp-desc{font-size:10px;color:var(--muted);margin-top:1px;font-family:var(--sans);font-style:italic}
.ind-bullet{display:flex;gap:7px;font-size:12px;line-height:1.6;padding:4px 0;border-bottom:1px solid #0d1b28;color:var(--text)}
.ind-bullet:last-child{border:none}
.ind-dot{flex-shrink:0;color:var(--muted);margin-top:4px;font-size:10px}
/* SCORING TABLE */
.score-section{margin-bottom:18px}
.score-table{width:100%;border-collapse:collapse;border:1px solid var(--border);border-top:none;font-size:11px}
.score-table th{background:#0a1624;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 10px;text-align:left;border-bottom:1px solid var(--border);font-weight:400;white-space:nowrap}
.score-table td{padding:8px 10px;line-height:1.5;border-bottom:1px solid #0d1b28;vertical-align:top}
.score-table tr:last-child td{border-bottom:none}
.score-table tr:hover td{background:rgba(20,184,212,.03)}
.ind-name{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--text)}
.ind-sub{font-size:10px;color:var(--muted);margin-top:1px}
.data-val{font-family:var(--mono);font-size:12px;font-weight:700}
.formula-text{font-size:10px;color:var(--muted);font-family:var(--mono);line-height:1.5}
.pts-chip{font-family:var(--mono);font-size:11px;font-weight:700;display:inline-block;padding:2px 7px;border-radius:2px;border:1px solid;white-space:nowrap}
.pts-pos-strong{background:var(--sb-bg);border-color:var(--sb);color:var(--sb)}
.pts-pos{background:var(--buy-bg);border-color:var(--buy);color:var(--buy)}
.pts-zero{background:transparent;border-color:var(--dim);color:var(--muted)}
.pts-neg{background:var(--sell-bg);border-color:var(--sell);color:var(--sell)}
.pts-neg-strong{background:var(--ss-bg);border-color:var(--ss);color:var(--ss)}
.rating{font-size:9px;padding:2px 7px;border-radius:2px;font-weight:700;letter-spacing:.04em;white-space:nowrap;display:inline-block}
.r-excellent{background:var(--sb-bg);color:var(--sb)}
.r-good{background:var(--buy-bg);color:var(--buy)}
.r-ok{background:#151000;color:#b08020}
.r-weak{background:var(--sell-bg);color:var(--sell)}
.r-bad{background:var(--ss-bg);color:var(--ss)}
.r-na{background:transparent;color:var(--muted)}
.explain-main{font-size:11px;color:var(--text);line-height:1.6;margin-bottom:4px}
.explain-rule{font-size:10px;color:var(--muted);line-height:1.5;padding:4px 8px;background:#0a1622;border-left:2px solid var(--dim);border-radius:0 2px 2px 0;margin-top:4px}
.ss-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:4px 4px 0 0;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.04em;border:1px solid var(--border);margin-bottom:0}
.ss-total{font-size:13px}
</style>
</head>

    {l:'1D', v: ctx._ctx_chg_1d != null ? (ctx._ctx_chg_1d>0?'+':'')+ctx._ctx_chg_1d+'%' : '—', cls: (ctx._ctx_chg_1d||0)>=0?'up':'dn'},
    {l:'5D', v: ctx._ctx_chg_5d != null ? (ctx._ctx_chg_5d>0?'+':'')+ctx._ctx_chg_5d+'%' : '—', cls: (ctx._ctx_chg_5d||0)>=0?'up':'dn'},
    {l:'P/E TT', v: ctx._ctx_pe ? ctx._ctx_pe+'×' : '—', cls:'warn'},
    {l:'P/B TT', v: ctx._ctx_pb ? ctx._ctx_pb+'×' : '—', cls:'warn'},
    {l:'Scored',  v: ALL_DATA.length, cls:'hi'},
  ];
  document.getElementById('mstrip-bar').innerHTML =
    items.map(i => `<div class="mi"><div class="mi-l">${i.l}</div><div class="mi-v ${i.cls}">${i.v}</div></div><div class="sep"></div>`).join('')+
    `<div class="regime">${reg} · Snap: ${RUN_META.snap_time||''}</div>`;
  document.getElementById('ts-disp').textContent = RUN_META.run_date + ' · ' + RUN_META.snap_time + ' ICT';
})();

// ── Render card ──────────────────────────────────────────────
function renderCard(d, idx) {
  const dc = DC(d.decision);
  const sc = SC(d.total_score);

  // Score bars
  const barsHtml = KEYS.map(k => {
    const v   = parseFloat(d[SCORE_KEY[k]])||0;
    const cap = CAPS[k];
    const pct = Math.min(100, Math.abs(v)/cap*100);
    const col = v>0 ? (Math.abs(v)>cap*.65?'var(--sb)':'var(--buy)') : v<0 ? (Math.abs(v)>cap*.65?'var(--ss)':'var(--sell)') : 'var(--muted)';
    const nc  = v>0?'color:var(--buy)':v<0?'color:var(--sell)':'color:var(--muted)';
    const info = d._groups && d._groups[k];
    return `<div class="sbar-row">
      <span class="sbar-icon">${info ? info.icon : ''}</span>
      <span class="sbar-lbl">${info ? info.name : k}</span>
      <div class="sbar-track"><div class="sbar-fill" style="width:${pct}%;background:${col}"></div></div>
      <span class="sbar-num" style="${nc}">${fs(v)}/${cap>0?'+':''}${cap}</span>
    </div>`;
  }).join('');

  // Trade block
  const hasTrade = d.entry_low && d.tp1 && d.stop_loss;
  const tradeHtml = hasTrade ? `
  <div class="trade-blk">
    <div class="trade-row"><span class="tl">💰 Giá hiện tại</span><span class="tv price">${d.price}</span></div>
    <div class="trade-row"><span class="tl">🟩 Vùng mua</span><span class="tv entry">${d.entry_low} – ${d.entry_high||d.entry}</span></div>
    <div class="trade-row"><span class="tl">🎯 Chốt lời</span><span class="tv tp">${d.tp1} ${d.tp2?'/ '+d.tp2:''}</span></div>
    <div class="trade-row"><span class="tl">🛑 Cắt lỗ</span><span class="tv sl">${d.stop_loss} <span class="pct pct-n">-${d.risk_pct||'?'}%</span></span></div>
    <div class="rr-blk">
      <span>📊 R:R <span class="rr-val">${d.rr_tp1||'?'}</span></span>
      <span class="size-chip sc-${d.size_hint||'NO'}">${d.size_hint||'?'}</span>
      <span class="rr-note">${d.entry_style||''}</span>
    </div>
    ${d.flags ? d.flags.split(',').map(f => d._flags_vn && d._flags_vn[f.trim()] ? `<div class="warn-box">⚠️ ${d._flags_vn[f.trim()]}</div>` : '').join('') : ''}
  </div>` : `<div class="trade-blk">
    <div class="trade-row"><span class="tl">💰 Giá hiện tại</span><span class="tv price">${d.price}</span></div>
    <div class="rr-blk"><span class="size-chip sc-NO">KHÔNG VÀO LỆNH</span></div>
  </div>`;

  // Verdict
  const verdict = d._verdict || {pros:[], cons:[]};
  const flags = (d.pattern_flags && d.pattern_flags !== 'None' && d.pattern_flags) ? String(d.pattern_flags).split(',').map(f => f.trim()).filter(Boolean) : [];
  const verdictHtml = `<div class="verdict-blk">
    ${flags.map(f => `<span class="pflag pf-${f}">${f}</span>`).join('')}
    <div style="margin-top:${flags.length?'6px':'0'}">
      ${verdict.pros.map(p => `<div class="pc-item"><span>✅</span><span>${p}</span></div>`).join('')}
      ${verdict.cons.map(c => `<div class="pc-item"><span>⚠️</span><span>${c}</span></div>`).join('')}
    </div>
  </div>`;

  // Indicator groups (Telegram-style bullets)
  const groupsHtml = (d._groups_arr || []).map(g => {
    const sCol = g.score>0?'var(--buy)':g.score<0?'var(--sell)':'var(--muted)';
    const bullets = (g.bullets||[]).map(b => `<div class="ind-bullet"><span class="ind-dot">•</span><span>${b}</span></div>`).join('');
    return `<div class="ind-grp">
      <div class="ind-grp-hdr">
        <span>${g.icon} ${g.name} <span style="font-weight:400;color:var(--muted);font-size:9px">— ${g.desc}</span></span>
        <span class="ss-total" style="color:${sCol}">${fs(g.score)}đ / ±${g.cap}</span>
      </div>
      ${bullets}
    </div>`;
  }).join('');

  return `<div class="card ${dc}" id="c${idx}" onclick="tog(${idx})">
    <div class="ch">
      <div class="ch-l">
        <div class="sym-line">
          <span class="sym">${d.symbol}</span>
          <span class="dec-badge db-${dc}">${d.decision}</span>
        </div>
        <div class="meta-line">
          <span>📅 ${d.snap_time}</span><span>·</span>
          <span>${d.industry||''}</span><span>·</span>
          <span>${d.exchange||''}</span>
          ${d.group ? `<span style="font-family:var(--mono);font-size:9px;padding:1px 5px;border-radius:2px;border:1px solid ${d.group==='GAINER'?'var(--buy-b,#0c4020)':'var(--sell-bg)'}; color:${d.group==='GAINER'?'var(--buy)':'var(--sell)'}">${d.group}</span>` : ''}
        </div>
        <div class="meta-line">Confidence: <b style="font-family:var(--mono);color:${d.confidence==='HIGH'?'var(--sb)':d.confidence==='LOW'?'var(--sell)':'var(--neu)'}">${d.confidence||'—'}</b></div>
      </div>
      <div class="ch-r">
        <div class="score-big ${sc}">${fs(d.total_score)}</div>
        <div style="font-family:var(--mono);font-size:9px;color:var(--muted)">/ 168 tổng</div>
      </div>
    </div>
    ${tradeHtml}
    ${verdictHtml}
    <div class="sbar-blk">
      <div class="sbar-ttl">📊 Điểm từng nhóm</div>
      ${barsHtml}
      <div class="sum-row">
        <span style="font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em">TỔNG</span>
        <span class="sum-val ${sc}">${fs(d.total_score)} / 168</span>
      </div>
    </div>
    <div class="card-detail" id="det${idx}">
      <div class="tabs" onclick="event.stopPropagation()">
        <div class="tab on" onclick="stab(event,${idx},'tele')">📱 Diễn giải (Telegram)</div>
        <div class="tab" onclick="stab(event,${idx},'trade')">💼 Trade Setup</div>
      </div>
      <div class="pane on" id="p${idx}-tele">${groupsHtml}</div>
      <div class="pane" id="p${idx}-trade">
        <div style="font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.8">
          EMA20: <b style="color:var(--text)">${d.ema20||'—'}</b> &nbsp;·&nbsp;
          EMA50: <b style="color:var(--text)">${d.ema50||'—'}</b> &nbsp;·&nbsp;
          EMA200: <b style="color:var(--text)">${d.ema200||'—'}</b><br>
          RSI: <b style="color:var(--text)">${d.rsi||'—'}</b> &nbsp;·&nbsp;
          ADX: <b style="color:var(--text)">${d.adx||'—'}</b> &nbsp;·&nbsp;
          MACD hist: <b style="color:var(--text)">${d.macd_hist||'—'}</b><br>
          P/E: <b style="color:var(--text)">${d.r_pe||'—'}</b> &nbsp;·&nbsp;
          P/B: <b style="color:var(--text)">${d.r_pb||'—'}</b> &nbsp;·&nbsp;
          ROE: <b style="color:var(--text)">${d.r_roe||'—'}%</b><br>
          DT YoY: <b style="color:var(--text)">${d.is_rev_growth_yoy!=null?((d.is_rev_growth_yoy*100).toFixed(1)+'%'):'—'}</b> &nbsp;·&nbsp;
          LN YoY: <b style="color:var(--text)">${d.is_profit_growth_yoy!=null?((d.is_profit_growth_yoy*100).toFixed(1)+'%'):'—'}</b><br>
          CF Op: <b style="color:${(d.cf_operating||0)>0?'var(--buy)':'var(--sell)'}">${d.cf_operating!=null?((d.cf_operating/1e6).toFixed(1)+' tỷ'):'—'}</b> &nbsp;·&nbsp;
          CF Quality: <b style="color:var(--text)">${d.cf_quality_ratio||'—'}</b>
        </div>
      </div>
    </div>
  </div>`;
}

// ── State & render ───────────────────────────────────────────
let fDec='ALL', fGrp='ALL', srt='sd';

function applyAll() {
  let items = [...ALL_DATA];
  if (fDec !== 'ALL') items = items.filter(d => d.decision === fDec);
  if (fGrp !== 'ALL') items = items.filter(d => d.group === fGrp);
  if (srt==='sd') items.sort((a,b) => b.total_score - a.total_score);
  else if (srt==='sa') items.sort((a,b) => a.total_score - b.total_score);
  else items.sort((a,b) => a.symbol.localeCompare(b.symbol));
  document.getElementById('cnt').textContent = items.length;
  document.getElementById('cards').innerHTML = items.map((d,i) => renderCard(d, ALL_DATA.indexOf(d))).join('');
  updateStats();
}

function updateStats() {
  const c = {SB:0,BUY:0,NEU:0,SELL:0,SS:0};
  ALL_DATA.forEach(d => { const dc=DC(d.decision); if(dc==='SB')c.SB++; else if(dc==='BUY')c.BUY++; else if(dc==='NEU')c.NEU++; else if(dc==='SEL')c.SELL++; else c.SS++; });
  const avg = (ALL_DATA.reduce((s,d) => s+(parseFloat(d.total_score)||0), 0) / ALL_DATA.length).toFixed(1);
  document.getElementById('stats').innerHTML = [
    {k:'STRONG BUY',v:c.SB,c:'var(--sb)'},{k:'MUA',v:c.BUY,c:'var(--buy)'},
    {k:'NEUTRAL',v:c.NEU,c:'var(--neu)'},{k:'BÁN',v:c.SELL,c:'var(--sell)'},
    {k:'STRONG SELL',v:c.SS,c:'var(--ss)'},{k:'ĐIỂM TB',v:avg,c:'var(--text)'},
  ].map(r => `<div class="stat-r"><div class="sk">${r.k}</div><div class="sv" style="color:${r.c}">${r.v}</div></div>`).join('');
}

function tog(idx) {
  const c = document.getElementById('c'+idx);
  c.classList.toggle('open');
}
function stab(e, idx, pane) {
  e.stopPropagation();
  const det = document.getElementById('det'+idx);
  det.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  det.querySelectorAll('.pane').forEach(p => p.classList.remove('on'));
  e.target.classList.add('on');
  document.getElementById('p'+idx+'-'+pane).classList.add('on');
}
function setupFilter(id, setter, map) {
  document.getElementById(id).addEventListener('click', e => {
    if (!e.target.dataset.v) return;
    document.querySelectorAll('#'+id+' .fb').forEach(b => {
      b.className = 'fb';
      if (b === e.target) b.className = 'fb ' + (map ? (map[b.dataset.v]||'on') : 'on');
    });
    setter(e.target.dataset.v); applyAll();
  });
}
setupFilter('fd', v => fDec=v, {'ALL':'on','STRONG BUY':'on-sb','BUY':'on-buy','NEUTRAL':'on-neu','SELL':'on-sell','STRONG SELL':'on-ss'});
setupFilter('fg', v => fGrp=v, null);
document.getElementById('srt').addEventListener('change', e => { srt=e.target.value; applyAll(); });
applyAll();
</script>
</body>
