<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradingBot · Signal Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07111b;--surf:#0d1e2e;--surf2:#112438;--border:#1c3248;--border2:#244060;
  --text:#c8dcea;--muted:#4e7a99;--dim:#1e3a52;
  --sb:#00e896;--sb-bg:#001f12;--buy:#34c26e;--buy-bg:#041508;
  --neu:#f5c240;--neu-bg:#1a1400;--sell:#e86030;--sell-bg:#1a0800;
  --ss:#e02040;--ss-bg:#180308;--acc:#14b8d4;
  --mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--dim);border-radius:2px}

/* ── HEADER ───────────────────────────────────────────────── */
.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(7,17,27,.94);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;height:44px;
}
.logo{font-family:var(--mono);font-size:13px;color:var(--acc);letter-spacing:.06em;white-space:nowrap}
.vtag{font-size:9px;background:#0d2035;border:1px solid #1a3555;color:var(--acc);padding:2px 7px;border-radius:2px}
.topbar-r{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--buy);animation:blink 2s infinite;margin-right:4px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* ── TAB CẤP CAO: LIVE | HISTORY ─────────────────────────── */
.main-tabs{display:flex;background:var(--surf);border-bottom:1px solid var(--border);padding:0 16px}
.main-tab{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  padding:10px 16px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;
  transition:all .15s;white-space:nowrap}
.main-tab:hover{color:var(--text)}
.main-tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.tab-pane{display:none}
.tab-pane.on{display:block}

/* ── MARKET STRIP ─────────────────────────────────────────── */
.mstrip{background:linear-gradient(90deg,#090f18,#0c1c2e 60%,#07111b);border-bottom:1px solid var(--border);
  padding:7px 16px;display:flex;align-items:center;gap:20px;overflow-x:auto}
.mi{display:flex;flex-direction:column;gap:1px;min-width:66px;flex-shrink:0}
.mi-l{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.mi-v{font-family:var(--mono);font-size:12px;font-weight:700}
.up{color:var(--buy)}.dn{color:var(--sell)}.warn{color:var(--neu)}.hi{color:var(--acc)}
.sep{width:1px;height:24px;background:var(--border);flex-shrink:0}
.regime{margin-left:auto;flex-shrink:0;font-family:var(--mono);font-size:9px;font-weight:700;
  padding:3px 10px;border-radius:2px;border:1px solid #604800;background:var(--neu-bg);color:var(--neu)}

/* ── LAYOUT ───────────────────────────────────────────────── */
.page{display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 120px)}
.sidebar{background:var(--surf);border-right:1px solid var(--border);padding:12px 0;overflow-y:auto}
.sb-s{padding:0 12px 14px}
.sb-t{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--border)}

/* ── FILTER GROUPS ────────────────────────────────────────── */
.fg-block{margin-bottom:14px}
.fg-label{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--acc);margin-bottom:6px;display:block}
.fbs{display:flex;flex-wrap:wrap;gap:4px}
.fb{font-family:var(--mono);font-size:9px;padding:3px 7px;border:1px solid var(--border);
  border-radius:2px;background:0;color:var(--muted);cursor:pointer;transition:all .15s}
.fb:hover{border-color:var(--acc);color:var(--text)}
.fb.on{border-color:var(--acc);background:#0c2035;color:var(--acc)}
.fb.on-sb{border-color:var(--sb);background:var(--sb-bg);color:var(--sb)}
.fb.on-buy{border-color:var(--buy);background:var(--buy-bg);color:var(--buy)}
.fb.on-neu{border-color:var(--neu);background:var(--neu-bg);color:var(--neu)}
.fb.on-sell{border-color:var(--sell);background:var(--sell-bg);color:var(--sell)}
.fb.on-ss{border-color:var(--ss);background:var(--ss-bg);color:var(--ss)}
.tsel{font-family:var(--mono);font-size:9px;background:var(--surf);border:1px solid var(--border);
  color:var(--text);padding:3px 7px;border-radius:2px;cursor:pointer;width:100%}
.tsel:focus{outline:none;border-color:var(--acc)}

/* ── HISTORY TOOLBAR ──────────────────────────────────────── */
.hist-toolbar{display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:var(--surf);border-bottom:1px solid var(--border);flex-wrap:wrap}
.hist-label{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hist-sel{font-family:var(--mono);font-size:10px;background:#0a1a28;border:1px solid var(--border);
  color:var(--text);padding:4px 10px;border-radius:2px;cursor:pointer}
.hist-sel:focus{outline:none;border-color:var(--acc)}
.hist-status{font-family:var(--mono);font-size:9px;color:var(--muted);margin-left:auto}
.hist-status.loading{color:var(--neu)}
.hist-status.error{color:var(--sell)}
.hist-status.ok{color:var(--buy)}

/* ── THRESHOLD ────────────────────────────────────────────── */
.thresh-list{font-family:var(--mono);font-size:10px;line-height:2;color:var(--muted)}
.sb-thresh{margin-top:4px}

/* ── MOBILE ───────────────────────────────────────────────── */
@media(max-width:720px){
  .page{grid-template-columns:1fr}
  .sidebar{border-right:none;border-bottom:1px solid var(--border);padding:6px 12px;overflow:visible}
  .sidebar .sb-t{display:none}
  .sidebar .sb-s{padding:0 0 5px}
  .sidebar .fg-label{font-size:8px}
  .filter-row2{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin-top:4px}
  .filter-row2 .fbs{margin:0}
  .filter-row2 .tsel{width:auto}
  .sb-thresh{display:none}
}

.main{padding:14px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:12px}
@media(max-width:500px){.grid{grid-template-columns:1fr}}

/* ── CARD (giữ nguyên v7) ─────────────────────────────────── */
.card{background:var(--surf);border:1px solid var(--border);border-radius:5px;overflow:hidden;
  position:relative;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:var(--border2);box-shadow:0 4px 20px rgba(0,0,0,.4)}
.card.open{border-color:var(--acc)}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.card.SB::before{background:var(--sb)}.card.BUY::before{background:var(--buy)}
.card.NEU::before{background:var(--neu)}.card.SEL::before{background:var(--sell)}.card.SS::before{background:var(--ss)}
.ch{padding:10px 12px 8px 17px}
.ch-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ch-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.sym{font-family:var(--mono);font-size:18px;font-weight:700;color:#dceefa;letter-spacing:.05em;flex-shrink:0}
.dec-badge{font-family:var(--mono);font-size:10px;font-weight:700;padding:3px 8px;border-radius:2px;
  border:1px solid;letter-spacing:.06em;flex-shrink:0}
.db-SB{background:var(--sb-bg);border-color:var(--sb);color:var(--sb)}
.db-BUY{background:var(--buy-bg);border-color:var(--buy);color:var(--buy)}
.db-NEU{background:var(--neu-bg);border-color:var(--neu);color:var(--neu)}
.db-SEL{background:var(--sell-bg);border-color:var(--sell);color:var(--sell)}
.db-SS{background:var(--ss-bg);border-color:var(--ss);color:var(--ss)}
.score-inline{font-family:var(--mono);font-size:14px;font-weight:700;white-space:nowrap;flex-shrink:0}
.score-sub{font-family:var(--mono);font-size:9px;color:var(--muted)}
.c-sb{color:var(--sb)}.c-buy{color:var(--buy)}.c-neu{color:var(--neu)}.c-sell{color:var(--sell)}.c-ss{color:var(--ss)}
.ch-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px;font-size:11px;color:var(--muted)}
.ch-meta-sep{color:var(--dim)}
.conf-chip{font-family:var(--mono);font-size:9px;font-weight:700;padding:1px 6px;border-radius:2px;border:1px solid}
.conf-HIGH{border-color:var(--sb);color:var(--sb);background:var(--sb-bg)}
.conf-MED{border-color:var(--neu);color:var(--neu);background:var(--neu-bg)}
.conf-LOW{border-color:var(--sell);color:var(--sell);background:var(--sell-bg)}
.group-chip{font-family:var(--mono);font-size:9px;font-weight:700;padding:1px 6px;border-radius:2px;border:1px solid}
.gc-GAINER{border-color:#0c4020;color:var(--buy);background:var(--buy-bg)}
.gc-LOSER{border-color:var(--sell-bg);color:var(--sell);background:var(--sell-bg)}
/* History: thêm chip ngày */
.date-chip{font-family:var(--mono);font-size:9px;padding:1px 6px;border-radius:2px;
  border:1px solid var(--border);color:var(--muted);background:#0a1824}
.trade-blk{padding:8px 12px 8px 17px;border-top:1px solid var(--border)}
.price-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.price-left{display:flex;align-items:baseline;gap:8px}
.tl{font-size:11px;color:var(--muted);flex-shrink:0}
.tv{font-family:var(--mono);font-size:13px;font-weight:600}
.tv.price{font-size:16px;color:#e0eefa}
.tv.tp{color:var(--buy)}.tv.sl{color:var(--sell)}.tv.entry{color:var(--acc)}
.trade-status{display:flex;align-items:center;gap:6px;flex-shrink:0}
.trade-rows{margin-bottom:6px}
.trade-row{display:flex;align-items:baseline;gap:8px;margin-bottom:3px;flex-wrap:wrap}
.pct{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:2px}
.pct-p{background:var(--buy-bg);color:var(--buy)}.pct-n{background:var(--sell-bg);color:var(--sell)}
.rr-inline{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.rr-val{color:var(--text);font-weight:700;font-size:12px}
.size-chip{font-weight:700;padding:2px 8px;border-radius:2px;font-size:10px;border:1px solid;white-space:nowrap}
.sc-FULL{border-color:var(--sb);color:var(--sb);background:var(--sb-bg)}
.sc-HALF{border-color:var(--neu);color:var(--neu);background:var(--neu-bg)}
.sc-NO{border-color:var(--muted);color:var(--muted);background:transparent}
.of-depth-panel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
@media(max-width:460px){.of-depth-panel{grid-template-columns:1fr}}
.of-blk,.depth-blk{padding:8px 10px;border-radius:3px;background:#0a1a28;border:1px solid var(--border)}
.of-hdr,.depth-hdr{font-size:9px;color:var(--muted);margin-bottom:6px;font-family:var(--mono);
  letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between}
.of-hdr-badge{font-size:9px;font-weight:700;padding:1px 6px;border-radius:2px;border:1px solid}
.of-badge-buy{border-color:var(--buy);color:var(--buy);background:var(--buy-bg)}
.of-badge-sell{border-color:var(--sell);color:var(--sell);background:var(--sell-bg)}
.of-badge-neu{border-color:var(--muted);color:var(--muted);background:transparent}
.of-stat{display:flex;justify-content:space-between;align-items:center;padding:3px 0;
  border-bottom:1px solid #0d1b28;font-size:10px}
.of-stat:last-child{border:none}
.of-stat-l{font-family:var(--mono);font-size:9px;color:var(--muted)}
.of-stat-v{font-family:var(--mono);font-size:10px;font-weight:700}
.br-bar-wrap{margin:5px 0 4px}
.br-bar-track{height:5px;background:#0d1e2e;border-radius:3px;overflow:hidden;position:relative}
.br-bar-buy{position:absolute;left:0;top:0;height:100%;border-radius:3px;background:var(--buy)}
.br-bar-sell{position:absolute;right:0;top:0;height:100%;border-radius:3px;background:var(--sell)}
.br-labels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;margin-top:3px}
.of-pattern-chip{display:inline-block;margin-top:5px;font-family:var(--mono);font-size:9px;font-weight:700;
  padding:2px 8px;border-radius:2px;border:1px solid;letter-spacing:.04em}
.ofc-acc{border-color:var(--buy);color:var(--buy);background:var(--buy-bg)}
.ofc-dist{border-color:var(--sell);color:var(--sell);background:var(--sell-bg)}
.ofc-neu{border-color:var(--neu);color:var(--neu);background:var(--neu-bg)}
.ofc-weak{border-color:var(--muted);color:var(--muted);background:transparent}
.depth-row{display:flex;gap:8px}
.depth-col{flex:1}
.depth-label{font-size:9px;color:var(--muted);margin-bottom:3px;font-family:var(--mono);letter-spacing:.04em}
.depth-label.bid{color:#34c26ecc;letter-spacing:.06em}
.depth-label.ask{color:#e86030cc;letter-spacing:.06em}
.depth-item{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;
  padding:2px 0;border-bottom:1px solid #0d1b2860}
.depth-item:last-child{border:none}
.di-price{color:var(--text)}.di-vol{color:var(--muted)}
.wall-bid .di-price{color:var(--buy)}.wall-bid .di-vol{color:var(--buy);font-weight:700}
.wall-ask .di-price{color:var(--sell)}.wall-ask .di-vol{color:var(--sell);font-weight:700}
.warn-box{margin-top:6px;padding:6px 10px;border-radius:3px;background:#0d1822;
  border:1px solid var(--border);font-size:11px;color:var(--muted);line-height:1.6}
.verdict-blk{padding:8px 12px 8px 17px;border-top:1px solid var(--border)}
.pc-item{display:flex;align-items:flex-start;gap:7px;margin-bottom:5px;font-size:12px;line-height:1.55}
.pc-item:last-child{margin-bottom:0}
.pflag{display:inline-block;font-family:var(--mono);font-size:9px;padding:2px 8px;border-radius:2px;
  border:1px solid;letter-spacing:.05em;margin:0 4px 4px 0}
.pf-BULL_TRAP_RISK{border-color:var(--neu);color:var(--neu);background:var(--neu-bg)}
.pf-CONSENSUS_BULL{border-color:var(--sb);color:var(--sb);background:var(--sb-bg)}
.sbar-blk{padding:8px 12px 8px 17px;border-top:1px solid var(--border)}
.sbar-ttl{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sbar-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.sbar-icon{font-size:10px;flex-shrink:0}
.sbar-lbl{font-size:11px;color:var(--muted);width:82px;flex-shrink:0}
.sbar-track{flex:1;height:6px;background:#0d1e2e;border-radius:3px;overflow:hidden}
.sbar-fill{height:100%;border-radius:3px}
.sbar-num{font-family:var(--mono);font-size:10px;width:54px;text-align:right;flex-shrink:0}
.sum-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding-top:6px;
  border-top:1px solid var(--border);font-family:var(--mono);font-size:11px}
.sum-val{font-size:13px;font-weight:700}
.card-detail{display:none;border-top:1px solid var(--border);background:#080f18}
.card.open .card-detail{display:block}
.tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;
  cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;
  transition:all .15s;flex-shrink:0}
.tab:hover{color:var(--text)}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.pane{display:none;padding:14px 12px 14px 17px}
.pane.on{display:block}
.ind-grp{margin-bottom:16px}
.ind-grp-hdr{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);
  font-size:10px;color:var(--acc);margin-bottom:7px;padding-bottom:6px;border-bottom:1px solid var(--border);
  letter-spacing:.06em}
.ind-bullet{display:flex;gap:7px;font-size:12px;line-height:1.6;padding:4px 0;
  border-bottom:1px solid #0d1b28;color:var(--text)}
.ind-bullet:last-child{border:none}
.ind-dot{flex-shrink:0;color:var(--muted);margin-top:4px;font-size:10px}
.ss-total{font-size:12px}
.empty-msg{padding:40px 16px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">TradingBot <span class="vtag">v8</span></div>
  <div class="topbar-r">
    <span><span class="live-dot"></span><span id="ts-disp">—</span></span>
    <span>VN100+HNX30</span>
  </div>
</header>

<!-- Tab cấp cao: LIVE | HISTORY -->
<div class="main-tabs">
  <div class="main-tab on" id="mt-live" onclick="switchMain('live')">📡 Live</div>
  <div class="main-tab" id="mt-hist" onclick="switchMain('hist')">📅 Lịch sử</div>
</div>

<!-- ══ TAB LIVE ══════════════════════════════════════════════ -->
<div class="tab-pane on" id="pane-live">
  <div class="mstrip" id="mstrip-bar"></div>
  <div class="page">
    <aside class="sidebar">
      <div class="sb-s">
        <div class="sb-t">Bộ lọc</div>

        <!-- Decision -->
        <div class="fg-block">
          <span class="fg-label">Decision</span>
          <div class="fbs" id="fd-live">
            <button class="fb" data-v="ALL">Tất cả</button>
            <button class="fb on-buy" data-v="BUY">BUY</button>
            <button class="fb" data-v="STRONG BUY">S.BUY</button>
            <button class="fb" data-v="NEUTRAL">NEU</button>
            <button class="fb" data-v="SELL">SELL</button>
            <button class="fb" data-v="STRONG SELL">S.SELL</button>
          </div>
        </div>

        <!-- Top tăng/giảm -->
        <div class="fg-block">
          <span class="fg-label">Top tăng / giảm</span>
          <div class="fbs" id="fg-live">
            <button class="fb on" data-v="ALL">Tất cả</button>
            <button class="fb" data-v="GAINER">Tăng</button>
            <button class="fb" data-v="LOSER">Giảm</button>
          </div>
        </div>

        <!-- Sắp xếp -->
        <div class="fg-block">
          <span class="fg-label">Sắp xếp</span>
          <select class="tsel" id="srt-live">
            <option value="sd">Điểm ↓</option>
            <option value="sa">Điểm ↑</option>
            <option value="sym">A→Z</option>
          </select>
        </div>
      </div>

      <div class="sb-s sb-thresh">
        <div class="sb-t">Ngưỡng</div>
        <div class="thresh-list">
          <span style="color:var(--sb)">≥80</span> S.BUY<br>
          <span style="color:var(--buy)">≥40</span> MUA<br>
          <span style="color:var(--neu)">≥−15</span> NEU<br>
          <span style="color:var(--sell)">≥−40</span> BÁN<br>
          <span style="color:var(--ss)">&lt;−40</span> S.SELL
        </div>
      </div>
    </aside>
    <main class="main">
      <div class="grid" id="cards-live"></div>
    </main>
  </div>
</div>

<!-- ══ TAB HISTORY ═══════════════════════════════════════════ -->
<div class="tab-pane" id="pane-hist">
  <div class="hist-toolbar">
    <span class="hist-label">Ngày</span>
    <select class="hist-sel" id="hist-date-sel">
      <option value="">-- Đang tải --</option>
    </select>
    <span class="hist-status loading" id="hist-status">⏳ Đang tải dữ liệu...</span>
  </div>

  <div class="page">
    <aside class="sidebar">
      <div class="sb-s">
        <div class="sb-t">Bộ lọc</div>

        <!-- Decision -->
        <div class="fg-block">

// ── buildDepthHtml ───────────────────────────────────────────
function buildDepthHtml(d) {
  const fmtV = v => { const n=parseFloat(v)||0; return n>=1e6?(n/1e6).toFixed(2)+'M':n>=1000?Math.round(n/1000)+'K':(Math.round(n)||'0'); };
  const fmtP = p => (p&&!isNaN(parseFloat(p)))?Number(p).toLocaleString('vi-VN')+'đ':'–';
  const bids = [1,2,3].map(function(i){
    const p=d['bid_price_'+i],v=d['bid_vol_'+i],vn=parseFloat(v)||0;
    return '<div class="depth-item'+(vn>=5000?' wall-bid':'')+'"><span class="di-price">'+fmtP(p)+'</span><span class="di-vol">'+fmtV(v)+'cp'+(vn>=5000?' 🛡':'')+'</span></div>';
  }).join('');
  const asks = [1,2,3].map(function(i){
    const p=d['ask_price_'+i],v=d['ask_vol_'+i],vn=parseFloat(v)||0;
    return '<div class="depth-item'+(vn>=5000?' wall-ask':'')+'"><span class="di-price">'+fmtP(p)+'</span><span class="di-vol">'+fmtV(v)+'cp'+(vn>=5000?' ⚠':'')+'</span></div>';

// ── HISTORY state ────────────────────────────────────────────
let HIST_ALL = [];        // toàn bộ record từ CSV (đã enrich)
let HIST_DATES = [];      // danh sách ngày unique, sort desc
let fDecHist = 'ALL', fGrpHist = 'ALL', srtHist = 'sd';
let selectedDate = '';

// CSV parser chuẩn — xử lý quoted fields (field có dấu phẩy, newline, dấu ngoặc kép)
function parseCSV(text) {
  const rows = [];
  let i = 0, n = text.length;
  while (i < n) {
    const row = [];
    while (i < n) {
      // skip CR trước field
      if (text[i] === '"') {
        // quoted field
        i++;
        let val = '';
        while (i < n) {
          if (text[i] === '"') {
            if (i+1 < n && text[i+1] === '"') { val += '"'; i += 2; }
            else { i++; break; }
          } else { val += text[i++]; }
        }
        row.push(val);
        if (i < n && text[i] === ',') i++;
        else if (i < n && (text[i] === '\n' || text[i] === '\r')) { if (text[i]==='\r'&&text[i+1]==='\n') i+=2; else i++; break; }
        else if (i >= n) break;
      } else {
        // unquoted field — đọc đến dấu , hoặc newline
        let val = '';
        while (i < n && text[i] !== ',' && text[i] !== '\n' && text[i] !== '\r') { val += text[i++]; }
        row.push(val);
        if (i < n && text[i] === ',') i++;
        else if (i < n && (text[i] === '\n' || text[i] === '\r')) { if (text[i]==='\r'&&text[i+1]==='\n') i+=2; else i++; break; }
        else if (i >= n) break;
      }
    }
    if (row.length > 1 || (row.length === 1 && row[0] !== '')) rows.push(row);
  }
  return rows;
}

function csvToObjects(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) return [];
  const headers = rows[0];
  return rows.slice(1).map(function(row) {
    const obj = {};
    headers.forEach(function(h, i) { obj[h] = row[i] !== undefined ? row[i] : ''; });
    return obj;
  });
}

// Chuẩn hoá kiểu số từ CSV (CSV trả về string)
function normalizeHistRow(r) {
  const NUM_FIELDS = [
    'total_score','trend_score','momentum_score','volume_score','volatility_score',
    'order_flow_score','depth_score','ff_score','fundamental_score','cf_score',
    'growth_score','context_score','news_score','confluence_bonus','tech_score','fund_score',
    'price','run_count','ema20','ema50','ema200','rsi','adx','macd_hist','bb_position',
    'cmf','mfi','vol_ma_ratio','atr_pct','intra_buy_ratio','r_pe','r_pb','r_roe',
    'is_rev_growth_yoy','is_profit_growth_yoy','cf_operating','cf_quality_ratio',
    'entry_low','entry_high','entry','tp1','tp2','stop_loss','rr_tp1','risk_pct',
    '_of_total_trades','_of_buy_count','_of_sell_count','_of_buy_vol','_of_sell_vol',
    '_of_buy_ratio','_of_avg_size','_of_vol_spike',
    'bid_price_1','bid_vol_1','bid_price_2','bid_vol_2','bid_price_3','bid_vol_3',
    'ask_price_1','ask_vol_1','ask_price_2','ask_vol_2','ask_price_3','ask_vol_3',
    '_ctx_close','_ctx_chg_1d','_ctx_chg_5d','_ctx_chg_20d',
    '_ctx_pe','_ctx_pb','_ctx_pe_pct','_ctx_pb_pct','_ctx_ema50','_ctx_ema200',
  ];
  const out = Object.assign({}, r);
  NUM_FIELDS.forEach(function(f) {
    if (r[f] === '' || r[f] == null) out[f] = null;
    else { const x = parseFloat(r[f]); out[f] = isNaN(x) ? null : x; }
  });
  return out;
}

async function loadHistory() {
  const statusEl = document.getElementById('hist-status');
  const selEl    = document.getElementById('hist-date-sel');
  if (!SHEET_CSV_URL) {
    statusEl.textContent = '⚠️ Chưa cấu hình CSV URL';
    statusEl.className   = 'hist-status error';
    return;
  }
  try {
    statusEl.textContent = '⏳ Đang tải...';
    statusEl.className   = 'hist-status loading';
    const resp = await fetch(SHEET_CSV_URL);
    if (!resp.ok) throw new Error('HTTP '+resp.status);
    const text = await resp.text();
    const objs = csvToObjects(text);
    // Normalize + enrich
    HIST_ALL = objs
      .filter(function(r){ return r.symbol && r.date; })
      .map(function(r){ return clientEnrich(normalizeHistRow(r)); });

    // Tập hợp ngày unique, sort mới → cũ
    const dateSet = {};
    HIST_ALL.forEach(function(r){ dateSet[r.date] = true; });
    HIST_DATES = Object.keys(dateSet).sort().reverse(); // YYYY-MM-DD sort đúng

    // Populate dropdown — mặc định ngày gần nhất TRƯỚC hôm nay
    const today = new Date().toISOString().slice(0,10);
    selEl.innerHTML = HIST_DATES.map(function(d){
      return '<option value="'+d+'">'+d+'</option>';
    }).join('');

    // Chọn ngày gần nhất trước hôm nay
    const prevDay = HIST_DATES.find(function(d){ return d < today; }) || HIST_DATES[0] || '';
    selEl.value  = prevDay;
    selectedDate = prevDay;

    statusEl.textContent = '✅ ' + HIST_ALL.length + ' records · ' + HIST_DATES.length + ' ngày';
    statusEl.className   = 'hist-status ok';
    applyHist();
  } catch(e) {
    statusEl.textContent = '❌ Lỗi: ' + e.message + ' — kiểm tra URL published CSV';
    statusEl.className   = 'hist-status error';
    document.getElementById('cards-hist').innerHTML =
      '<div class="empty-msg">Không tải được dữ liệu lịch sử.<br>Kiểm tra Google Sheet đã publish chưa.</div>';
  }
}

function applyHist() {
  let its = HIST_ALL.filter(function(d){ return d.date === selectedDate; });
  if (fDecHist !== 'ALL') its = its.filter(function(d){ return d.decision === fDecHist; });
  if (fGrpHist !== 'ALL') its = its.filter(function(d){ return d.group === fGrpHist; });
  if (srtHist === 'sd') its.sort(function(a,b){ return b.total_score - a.total_score; });
  else if (srtHist === 'sa') its.sort(function(a,b){ return a.total_score - b.total_score; });
  else its.sort(function(a,b){ return a.symbol.localeCompare(b.symbol); });
  document.getElementById('cards-hist').innerHTML = its.length
    ? its.map(function(d,i){ return renderCard(d, i, 'hist', false); }).join('')
    : '<div class="empty-msg">Không có tín hiệu cho ngày '+selectedDate+'</div>';
}

  document.getElementById('mt-hist').className = 'main-tab'+(tab==='hist'?' on':'');
  document.getElementById('pane-live').className = 'tab-pane'+(tab==='live'?' on':'');
  document.getElementById('pane-hist').className = 'tab-pane'+(tab==='hist'?' on':'');
  if (tab === 'hist' && !histLoaded) { histLoaded = true; loadHistory(); }
}

// ── Card interactions ────────────────────────────────────────
function tog(uid){ document.getElementById('c-'+uid).classList.toggle('open'); }
function stab(e, uid, pane){
  e.stopPropagation();
  const det = document.getElementById('det-'+uid);
  det.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('on'); });
  det.querySelectorAll('.pane').forEach(function(p){ p.classList.remove('on'); });
  e.target.classList.add('on');
  document.getElementById('p-'+uid+'-'+pane).classList.add('on');
}

// ── Filter setup helper ──────────────────────────────────────
function setupFilter(id, setter, map, applyFn){
  document.getElementById(id).addEventListener('click', function(e){
    if (!e.target.dataset.v) return;
    document.querySelectorAll('#'+id+' .fb').forEach(function(b){
      b.className='fb';
      if (b===e.target) b.className='fb '+(map?(map[b.dataset.v]||'on'):'on');
    });
    setter(e.target.dataset.v);
    applyFn();
  });
}

const DEC_MAP = {'ALL':'on-buy','STRONG BUY':'on-sb','BUY':'on-buy','NEUTRAL':'on-neu','SELL':'on-sell','STRONG SELL':'on-ss'};

// Live filters
setupFilter('fd-live', function(v){ fDecLive=v; }, DEC_MAP, applyLive);
setupFilter('fg-live', function(v){ fGrpLive=v; }, null, applyLive);
document.getElementById('srt-live').addEventListener('change', function(e){ srtLive=e.target.value; applyLive(); });

// History filters
setupFilter('fd-hist', function(v){ fDecHist=v; }, DEC_MAP, applyHist);
setupFilter('fg-hist', function(v){ fGrpHist=v; }, null, applyHist);
document.getElementById('srt-hist').addEventListener('change', function(e){ srtHist=e.target.value; applyHist(); });
document.getElementById('hist-date-sel').addEventListener('change', function(e){
  selectedDate = e.target.value;
  applyHist();
});

// ── Init ─────────────────────────────────────────────────────
applyLive();
</script>
