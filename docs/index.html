<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VNStock · Signal Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07111b;--surf:#0d1e2e;--surf2:#112438;--border:#1c3248;--border2:#244060;
  --text:#c8dcea;--muted:#4e7a99;--dim:#1e3a52;
  --sb:#00e896;--sb-bg:#001f12;--buy:#34c26e;--buy-bg:#041508;
  --neu:#f5c240;--neu-bg:#1a1400;--sell:#e86030;--sell-bg:#1a0800;
  --ss:#e02040;--ss-bg:#180308;--acc:#14b8d4;
  --mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--dim);border-radius:2px}
.topbar{position:sticky;top:0;z-index:100;background:rgba(7,17,27,.94);border-bottom:1px solid var(--border);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:50px}
.logo{font-family:var(--mono);font-size:13px;color:var(--acc);letter-spacing:.06em}
.logo em{color:var(--muted);font-style:normal}
.topbar-r{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--buy);animation:blink 2s infinite;margin-right:4px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.vtag{font-size:9px;background:#0d2035;border:1px solid #1a3555;color:var(--acc);padding:2px 7px;border-radius:2px}
.mstrip{background:linear-gradient(90deg,#090f18,#0c1c2e 60%,#07111b);border-bottom:1px solid var(--border);padding:8px 20px;display:flex;align-items:center;gap:22px;overflow-x:auto}
.mi{display:flex;flex-direction:column;gap:1px;min-width:72px;flex-shrink:0}
.mi-l{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.mi-v{font-family:var(--mono);font-size:12px;font-weight:700}
.up{color:var(--buy)}.dn{color:var(--sell)}.warn{color:var(--neu)}.hi{color:var(--acc)}
.sep{width:1px;height:26px;background:var(--border);flex-shrink:0}
.regime{margin-left:auto;flex-shrink:0;font-family:var(--mono);font-size:9px;font-weight:700;padding:4px 12px;border-radius:2px;border:1px solid var(--neu-b,#604800);background:var(--neu-bg);color:var(--neu)}
.page{display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 84px)}
@media(max-width:720px){.page{grid-template-columns:1fr}.sidebar{display:none}}
.sidebar{background:var(--surf);border-right:1px solid var(--border);padding:14px 0;overflow-y:auto}
.sb-s{padding:0 14px 14px}
.sb-t{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.fbs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.fl{font-size:11px;color:var(--muted);margin-bottom:5px}
.fb{font-family:var(--mono);font-size:9px;padding:3px 7px;border:1px solid var(--border);border-radius:2px;background:0;color:var(--muted);cursor:pointer;transition:all .15s}
.fb:hover{border-color:var(--acc);color:var(--text)}
.fb.on{border-color:var(--acc);background:#0c2035;color:var(--acc)}
.fb.on-sb{border-color:var(--sb);background:var(--sb-bg);color:var(--sb)}
.fb.on-buy{border-color:var(--buy);background:var(--buy-bg);color:var(--buy)}
.fb.on-neu{border-color:var(--neu);background:var(--neu-bg);color:var(--neu)}
.fb.on-sell{border-color:var(--sell);background:var(--sell-bg);color:var(--sell)}
.fb.on-ss{border-color:var(--ss);background:var(--ss-bg);color:var(--ss)}
.stat-r{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #101e2c;font-size:11px}
.stat-r:last-child{border:none}
.sk{font-family:var(--mono);font-size:10px;color:var(--muted)}
.sv{font-family:var(--mono);font-weight:700}
.main{padding:16px 18px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tsel{font-family:var(--mono);font-size:10px;background:var(--surf);border:1px solid var(--border);color:var(--text);padding:5px 9px;border-radius:2px;cursor:pointer}
.tsel:focus{outline:none;border-color:var(--acc)}
.tcnt{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted)}
.tcnt b{color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:14px}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
/* CARD */
.card{background:var(--surf);border:1px solid var(--border);border-radius:5px;overflow:hidden;position:relative;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:var(--border2);box-shadow:0 4px 20px rgba(0,0,0,.4)}
.card.open{border-color:var(--acc)}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.card.SB::before{background:var(--sb)}.card.BUY::before{background:var(--buy)}
.card.NEU::before{background:var(--neu)}.card.SEL::before{background:var(--sell)}.card.SS::before{background:var(--ss)}
.ch{padding:12px 14px 10px 17px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ch-l{display:flex;flex-direction:column;gap:4px}
.sym-line{display:flex;align-items:center;gap:8px}
.sym{font-family:var(--mono);font-size:19px;font-weight:700;color:#dceefa;letter-spacing:.05em}
.dec-badge{font-family:var(--mono);font-size:10px;font-weight:700;padding:3px 9px;border-radius:2px;border:1px solid;letter-spacing:.06em}
.db-SB{background:var(--sb-bg);border-color:var(--sb);color:var(--sb)}
.db-BUY{background:var(--buy-bg);border-color:var(--buy);color:var(--buy)}
.db-NEU{background:var(--neu-bg);border-color:var(--neu);color:var(--neu)}
.db-SEL{background:var(--sell-bg);border-color:var(--sell);color:var(--sell)}
.db-SS{background:var(--ss-bg);border-color:var(--ss);color:var(--ss)}
.meta-line{font-size:11px;color:var(--muted);display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.ch-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.score-big{font-family:var(--mono);font-size:24px;font-weight:700;line-height:1}
.c-sb{color:var(--sb)}.c-buy{color:var(--buy)}.c-neu{color:var(--neu)}.c-sell{color:var(--sell)}.c-ss{color:var(--ss)}
/* TRADE BLOCK */
.trade-blk{padding:10px 14px 10px 17px;border-top:1px solid var(--border)}
.trade-row{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.tl{font-size:11px;color:var(--muted);width:95px;flex-shrink:0}
.tv{font-family:var(--mono);font-size:13px;font-weight:600}
.tv.price{font-size:16px;color:#e0eefa}
.tv.tp{color:var(--buy)}.tv.sl{color:var(--sell)}.tv.entry{color:var(--acc)}
.pct{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:2px}
.pct-p{background:var(--buy-bg);color:var(--buy)}.pct-n{background:var(--sell-bg);color:var(--sell)}
.rr-blk{margin-top:6px;padding:7px 10px;border-radius:3px;background:#0a1a28;border:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:10px}
.rr-val{color:var(--text);font-weight:700;font-size:13px}
.rr-note{color:var(--muted)}
.size-chip{font-weight:700;padding:2px 8px;border-radius:2px;font-size:10px;border:1px solid}
.sc-FULL{border-color:var(--sb);color:var(--sb);background:var(--sb-bg)}
.sc-HALF{border-color:var(--neu);color:var(--neu);background:var(--neu-bg)}
.sc-NO{border-color:var(--muted);color:var(--muted);background:transparent}

/* ── OF + DEPTH PANEL (song song) ───────────────────────── */
.of-depth-panel{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
}
/* Responsive: stack on narrow cards */
@media(max-width:460px){
  .of-depth-panel{grid-template-columns:1fr}
}
.of-blk,.depth-blk{
  padding:8px 10px;
  border-radius:3px;
  background:#0a1a28;
  border:1px solid var(--border);
}
.of-hdr,.depth-hdr{
  font-size:9px;
  color:var(--muted);
  margin-bottom:6px;
  font-family:var(--mono);
  letter-spacing:.06em;
  text-transform:uppercase;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.of-hdr-badge{
  font-size:9px;
  font-weight:700;
  padding:1px 6px;
  border-radius:2px;
  border:1px solid;
}
.of-badge-buy{border-color:var(--buy);color:var(--buy);background:var(--buy-bg)}
.of-badge-sell{border-color:var(--sell);color:var(--sell);background:var(--sell-bg)}
.of-badge-neu{border-color:var(--muted);color:var(--muted);background:transparent}

/* OF stat rows */
.of-stat{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:3px 0;
  border-bottom:1px solid #0d1b28;
  font-size:10px;
}
.of-stat:last-child{border:none}
.of-stat-l{font-family:var(--mono);font-size:9px;color:var(--muted)}
.of-stat-v{font-family:var(--mono);font-size:10px;font-weight:700}

/* Buy ratio progress bar */
.br-bar-wrap{margin:5px 0 4px}
.br-bar-track{height:5px;background:#0d1e2e;border-radius:3px;overflow:hidden;position:relative}
.br-bar-buy{position:absolute;left:0;top:0;height:100%;border-radius:3px;background:var(--buy);transition:width .4s}
.br-bar-sell{position:absolute;right:0;top:0;height:100%;border-radius:3px;background:var(--sell);transition:width .4s}
.br-labels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;margin-top:3px}

/* OF pattern chip */
.of-pattern-chip{
  display:inline-block;
  margin-top:5px;
  font-family:var(--mono);
  font-size:9px;
  font-weight:700;
  padding:2px 8px;
  border-radius:2px;
  border:1px solid;
  letter-spacing:.04em;
}
.ofc-acc  {border-color:var(--buy);color:var(--buy);background:var(--buy-bg)}
.ofc-dist {border-color:var(--sell);color:var(--sell);background:var(--sell-bg)}
.ofc-neu  {border-color:var(--neu);color:var(--neu);background:var(--neu-bg)}
.ofc-weak {border-color:var(--muted);color:var(--muted);background:transparent}

/* Depth rows */
.depth-row{display:flex;gap:8px}
.depth-col{flex:1}
.depth-label{font-size:9px;color:var(--muted);margin-bottom:3px;font-family:var(--mono);letter-spacing:.04em}
.depth-label.bid{color:#34c26e55;letter-spacing:.06em}
.depth-label.ask{color:#e8603055;letter-spacing:.06em}
.depth-item{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;padding:2px 0;border-bottom:1px solid #0d1b2860}
.depth-item:last-child{border:none}
.di-price{color:var(--text)}
.di-vol{color:var(--muted)}
.wall-bid .di-price{color:var(--buy)}
.wall-bid .di-vol{color:var(--buy);font-weight:700}
.wall-ask .di-price{color:var(--sell)}
.wall-ask .di-vol{color:var(--sell);font-weight:700}

/* VERDICT */
.verdict-blk{padding:10px 14px 10px 17px;border-top:1px solid var(--border)}
.pc-item{display:flex;align-items:flex-start;gap:7px;margin-bottom:5px;font-size:12px;line-height:1.55}
.pc-item:last-child{margin-bottom:0}
.warn-box{margin-top:8px;padding:7px 10px;border-radius:3px;background:#0d1822;border:1px solid var(--border);font-size:11px;color:var(--muted);line-height:1.6}
.pflag{display:inline-block;font-family:var(--mono);font-size:9px;padding:2px 8px;border-radius:2px;border:1px solid;letter-spacing:.05em;margin:0 4px 4px 0}
.pf-BULL_TRAP_RISK{border-color:var(--neu);color:var(--neu);background:var(--neu-bg)}
.pf-CONSENSUS_BULL{border-color:var(--sb);color:var(--sb);background:var(--sb-bg)}
/* SCORE BARS */
.sbar-blk{padding:10px 14px 8px 17px;border-top:1px solid var(--border)}
.sbar-ttl{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.sbar-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.sbar-icon{font-size:10px;flex-shrink:0}
.sbar-lbl{font-size:11px;color:var(--muted);width:82px;flex-shrink:0}
.sbar-track{flex:1;height:6px;background:#0d1e2e;border-radius:3px;overflow:hidden}
.sbar-fill{height:100%;border-radius:3px}
.sbar-num{font-family:var(--mono);font-size:10px;width:54px;text-align:right;flex-shrink:0}
.sum-row{display:flex;justify-content:space-between;align-items:center;margin-top:7px;padding-top:7px;border-top:1px solid var(--border);font-family:var(--mono);font-size:11px}
.sum-val{font-size:14px;font-weight:700}
/* TABS */
.card-detail{display:none;border-top:1px solid var(--border);background:#080f18}
.card.open .card-detail{display:block}
.tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;flex-shrink:0}
.tab:hover{color:var(--text)}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.pane{display:none;padding:14px 14px 14px 17px}
.pane.on{display:block}
/* INDICATOR GROUPS */
.ind-grp{margin-bottom:16px}
.ind-grp-hdr{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--acc);margin-bottom:7px;padding-bottom:6px;border-bottom:1px solid var(--border);letter-spacing:.06em}
.ind-grp-desc{font-size:10px;color:var(--muted);margin-top:1px;font-family:var(--sans);font-style:italic}
.ind-bullet{display:flex;gap:7px;font-size:12px;line-height:1.6;padding:4px 0;border-bottom:1px solid #0d1b28;color:var(--text)}
.ind-bullet:last-child{border:none}
.ind-dot{flex-shrink:0;color:var(--muted);margin-top:4px;font-size:10px}
.score-section{margin-bottom:18px}
.ss-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:4px 4px 0 0;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.04em;border:1px solid var(--border);margin-bottom:0}
.ss-total{font-size:13px}

/* ── History panel ─────────────────────────────────────────── */
.view-btn{font-family:var(--mono);font-size:10px;padding:5px 12px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;border-radius:3px;transition:.15s}
.view-btn.active{background:var(--acc);border-color:var(--acc);color:#07111b;font-weight:700}
.view-toggle{display:flex;gap:6px;padding:0 20px 12px}
.hist-panel{display:none;padding:16px 20px}
.hist-panel.visible{display:block}
.cards-panel{display:block}
.cards-panel.hidden{display:none}
.hist-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.hist-toolbar label{font-family:var(--mono);font-size:10px;color:var(--muted)}
.hist-toolbar input,.hist-toolbar select{font-family:var(--mono);font-size:11px;background:var(--surf2);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:3px}
.hist-table-wrap{overflow-x:auto;border-radius:6px;border:1px solid var(--border)}
.hist-table{width:100%;border-collapse:collapse;font-size:12px}
.hist-table th{background:var(--surf2);font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0}
.hist-table td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
.hist-table tr:last-child td{border-bottom:none}
.hist-table tr:hover td{background:var(--surf2)}
.hist-loading{font-family:var(--mono);font-size:12px;color:var(--muted);padding:40px;text-align:center}
.hist-err{color:#e86030;font-family:var(--mono);font-size:12px;padding:20px}
.sym-badge{font-family:var(--mono);font-weight:700;font-size:12px}
.mini-bar-wrap{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px}
.mini-bar{height:4px;border-radius:2px;min-width:2px}
.ht-sb{color:var(--sb)} .ht-buy{color:var(--buy)} .ht-neu{color:var(--neu)} .ht-sell{color:var(--sell)} .ht-ss{color:var(--ss)}
.top3-banner{background:linear-gradient(90deg,rgba(78,122,153,.18),transparent);border:1px solid var(--border);border-left:3px solid var(--neu);border-radius:6px;padding:12px 16px;margin-bottom:14px;font-family:var(--mono);font-size:12px;color:var(--text);line-height:1.5}
.top3-banner b{color:var(--neu)}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">VNStock<em>/signal</em> <span class="vtag">v5·P1+2</span></div>
  <div class="topbar-r">
    <span><span class="live-dot"></span>LIVE</span>
    <span id="ts-disp"></span>
    <span>VN100+HNX30</span>
  </div>
</header>
<div class="mstrip" id="mstrip-bar"></div>
<div class="page">
  <aside class="sidebar">
    <div class="sb-s">
      <div class="sb-t">Bộ lọc</div>
      <div class="fl">Decision</div>
      <div class="fbs" id="fd">
        <button class="fb on" data-v="ALL">Tất cả</button>
        <button class="fb" data-v="BUY">BUY</button>
        <button class="fb" data-v="STRONG BUY">S.BUY</button>
        <button class="fb" data-v="NEUTRAL">NEU</button>
        <button class="fb" data-v="SELL">SELL</button>
        <button class="fb" data-v="STRONG SELL">S.SELL</button>
      </div>
      <div class="fl">Nhóm</div>
      <div class="fbs" id="fg">
        <button class="fb on" data-v="ALL">Tất cả</button>
        <button class="fb" data-v="GAINER">GAINER</button>
        <button class="fb" data-v="LOSER">LOSER</button>
      </div>
    </div>
    <div class="sb-s">
      <div class="sb-t">Thống kê</div>
      <div id="stats"></div>
    </div>
    <div class="sb-s">
      <div class="sb-t">Ngưỡng</div>
      <div style="font-family:var(--mono);font-size:10px;line-height:2;color:var(--muted)">
        <span style="color:var(--sb)">≥80</span> STRONG BUY<br>
        <span style="color:var(--buy)">≥40</span> MUA<br>
        <span style="color:var(--neu)">≥−15</span> NEUTRAL<br>
        <span style="color:var(--sell)">≥−40</span> BÁN<br>
        <span style="color:var(--ss)">&lt;−40</span> STRONG SELL
      </div>
    </div>
  
    <div class="sb-s">
      <div class="sb-t">Chế độ xem</div>
      <div class="fbs">
        <button class="fb on" id="nav-signals" onclick="switchView('signals')">📊 Tín hiệu</button>
        <button class="fb" id="nav-history" onclick="switchView('history')">📅 Lịch sử</button>
      </div>
    </div>
  </aside>
  <main class="main">

    <div class="view-toggle" style="display:none"><!-- mobile toggle placeholder --></div>
    <div class="hist-panel" id="hist-panel">
      <div class="hist-toolbar">
        <label>Từ ngày</label>
        <input type="date" id="h-from" />
        <label>Mã</label>
        <input type="text" id="h-sym" placeholder="VD: HPG" style="width:80px;text-transform:uppercase" />
        <label>Decision</label>
        <select id="h-dec">
          <option value="">Tất cả</option>
          <option>STRONG BUY</option><option>BUY</option>
          <option>NEUTRAL</option><option>SELL</option><option>STRONG SELL</option>
        </select>
        <button onclick="loadHistory()" style="font-family:var(--mono);font-size:10px;padding:4px 10px;background:var(--acc);border:none;color:#07111b;border-radius:3px;cursor:pointer;font-weight:700">Lọc</button>

const DC = d => ({'STRONG BUY':'SB','STRONG_BUY':'SB','BUY':'BUY','NEUTRAL':'NEU','SELL':'SEL','STRONG SELL':'SS','STRONG_SELL':'SS'})[d]||'NEU';
const SC = s => s>=80?'c-sb':s>=40?'c-buy':s>=-15?'c-neu':s>=-40?'c-sell':'c-ss';
const fmtK = n => n==null?'—': n>=1e6?(n/1e6).toFixed(2)+'M': n>=1000?Math.round(n/1000)+'K': String(Math.round(n)||0);

const KEYS  = ['trend','momentum','volume','volatility','order_flow','ff','fundamental','cf','growth','context','news','confluence'];
const CAPS  = {trend:30,momentum:23,volume:20,volatility:5,order_flow:10,ff:20,fundamental:20,cf:10,growth:10,context:5,news:5,confluence:10};
const SCORE_KEY = {trend:'trend_score',momentum:'momentum_score',volume:'volume_score',volatility:'volatility_score',order_flow:'order_flow_score',ff:'ff_score',fundamental:'fundamental_score',cf:'cf_score',growth:'growth_score',context:'context_score',news:'news_score',confluence:'confluence_bonus'};

// ── Build OF block HTML ──────────────────────────────────────
function buildOFHtml(d) {
  const br       = d._of_buy_ratio != null ? Math.round(d._of_buy_ratio * 100) : null;
  const sr       = br != null ? 100 - br : null;
  const brClass  = br == null ? 'of-badge-neu' : br >= 60 ? 'of-badge-buy' : br <= 40 ? 'of-badge-sell' : 'of-badge-neu';
  const brLabel  = br == null ? '—' : br >= 60 ? 'MUA MẠNH' : br <= 40 ? 'BÁN MẠNH' : 'CÂN BẰNG';

  const patMap = {
    'SPIKE_BUY'    : ['🟢 ĐỘT BIẾN MUA',  'ofc-acc'],
    'SPIKE_SELL'   : ['🔴 ĐỘT BIẾN BÁN',  'ofc-dist'],
    'SPIKE_NEUTRAL': ['⚪ ĐỘT BIẾN TRUNG TÍNH', 'ofc-neu'],
    'ACCUMULATION' : ['🟩 GOM HÀNG',       'ofc-acc'],
    'DISTRIBUTION' : ['🟥 XẢ HÀNG',        'ofc-dist'],
    'WEAK'         : ['⬜ LỰC YẾU',         'ofc-weak'],
  };
  const pat = d._of_pattern ? (patMap[d._of_pattern] || [d._of_pattern,'ofc-weak']) : null;

  const avgSz   = d._of_avg_size != null ? Math.round(d._of_avg_size) : null;
  const sizeNote = avgSz == null ? null :
    avgSz >= 5000 ? '🏦 Tổ chức (THẬT)' :
    avgSz >= 1500 ? '🧑 Giao dịch bình thường' :
    '⚠️ Lệnh nhỏ (có thể ảo)';

  const volSpike = d._of_vol_spike != null ? Math.round(d._of_vol_spike) : null;

  return `
<div class="of-blk">
  <div class="of-hdr">
    🔄 LỰC KHỚP LỆNH
    <span class="of-hdr-badge ${brClass}">${brLabel}</span>
  </div>

  ${br != null ? `
  <div class="br-bar-wrap">
    <div class="br-bar-track">
      <div class="br-bar-buy"  style="width:${br}%"></div>
      <div class="br-bar-sell" style="width:${sr}%"></div>
    </div>
    <div class="br-labels">
      <span style="color:var(--buy)">MUA ${br}%</span>

    <span class="of-stat-l">Khớp MUA</span>

  </div>
  <div class="of-stat">
    <span class="of-stat-l">Khớp BÁN</span>
    <span class="of-stat-v" style="color:var(--sell)">${d._of_sell_count||0} lệnh · ${fmtK(d._of_sell_vol)}cp</span>
  </div>
  ${avgSz != null ? `
  <div class="of-stat">
    <span class="of-stat-l">TB/lệnh</span>
    <span class="of-stat-v">${avgSz.toLocaleString('vi-VN')}cp</span>
  </div>` : ''}
  ${d._of_total_trades != null ? `
  <div class="of-stat">
    <span class="of-stat-l">Tổng lệnh</span>
    <span class="of-stat-v">${fmtK(d._of_total_trades)}</span>

  <div class="of-stat">

// ── Build Depth block HTML ───────────────────────────────────
function buildDepthHtml(d) {
  const fmtV = v => { const n = parseFloat(v)||0; return n>=1e6?(n/1e6).toFixed(2)+'M':n>=1000?Math.round(n/1000)+'K':(Math.round(n)||'0')+''; };
  const fmtP = p => (p && !isNaN(parseFloat(p))) ? Number(p).toLocaleString('vi-VN')+'đ' : '–';

  const bidRows = [1,2,3].map(i => {
    const p = d['bid_price_'+i], v = d['bid_vol_'+i];
    const vn = parseFloat(v)||0;
    const cls = 'depth-item' + (vn>=5000?' wall-bid':'');
    const tag = vn>=5000?' 🛡':'';
    return `<div class="${cls}"><span class="di-price">${fmtP(p)}</span><span class="di-vol">${fmtV(v)}cp${tag}</span></div>`;
  }).join('');

  const askRows = [1,2,3].map(i => {
    const p = d['ask_price_'+i], v = d['ask_vol_'+i];
    const vn = parseFloat(v)||0;
    const cls = 'depth-item' + (vn>=5000?' wall-ask':'');
    const tag = vn>=5000?' ⚠':'';
    return `<div class="${cls}"><span class="di-price">${fmtP(p)}</span><span class="di-vol">${fmtV(v)}cp${tag}</span></div>`;
  }).join('');

  return `
<div class="depth-blk">
  <div class="depth-hdr">📋 LỆNH CHỜ (BID / ASK)</div>
  <div class="depth-row">
    <div class="depth-col">
      <div class="depth-label bid">▲ Chờ MUA (Bid)</div>
      ${bidRows}
    </div>
    <div class="depth-col">
      <div class="depth-label ask">▼ Chờ BÁN (Ask)</div>
      ${askRows}
    </div>
  </div>
</div>`;
}

  const barsHtml = KEYS.map(k => {

    const col = v>0 ? (Math.abs(v)>cap*.65?'var(--sb)':'var(--buy)') : v<0 ? (Math.abs(v)>cap*.65?'var(--ss)':'var(--sell)') : 'var(--muted)';
    const nc  = v>0?'color:var(--buy)':v<0?'color:var(--sell)':'color:var(--muted)';

    return `<div class="sbar-row">
      <span class="sbar-icon">${info ? info.icon : ''}</span>
      <span class="sbar-lbl">${info ? info.name : k}</span>
      <div class="sbar-track"><div class="sbar-fill" style="width:${pct}%;background:${col}"></div></div>
      <span class="sbar-num" style="${nc}">${fs(v)}/${cap>0?'+':''}${cap}</span>
    </div>`;
  }).join('');

  // ── Trade block với OF + Depth song song ─────────────────

    <span class="rr-note">${d.entry_style||''}</span>
  </div>` : `
  <div class="rr-blk"><span class="size-chip sc-NO">KHÔNG VÀO LỆNH</span></div>`}

  <!-- OF + Depth song song -->
  <div class="of-depth-panel">
    ${buildOFHtml(d)}
    ${buildDepthHtml(d)}

  ${d.flags ? d.flags.split(',').map(f => {
    const k = f.trim();
    return (d._flags_vn && d._flags_vn[k]) ? `<div class="warn-box">⚠️ ${d._flags_vn[k]}</div>` : '';
  }).join('') : ''}
</div>`;

  // Verdict
  const verdict = d._verdict || {pros:[], cons:[]};
  const flags = (d.pattern_flags && d.pattern_flags !== 'None' && d.pattern_flags)
    ? String(d.pattern_flags).split(',').map(f => f.trim()).filter(Boolean) : [];
  const verdictHtml = `<div class="verdict-blk">
    ${flags.map(f => `<span class="pflag pf-${f}">${f}</span>`).join('')}
    <div style="margin-top:${flags.length?'6px':'0'}">
      ${verdict.pros.map(p => `<div class="pc-item"><span>✅</span><span>${p}</span></div>`).join('')}
      ${verdict.cons.map(c => `<div class="pc-item"><span>⚠️</span><span>${c}</span></div>`).join('')}
    </div>
  </div>`;

  // Indicator groups
  const groupsHtml = (d._groups_arr || []).map(g => {
    const sCol = g.score>0?'var(--buy)':g.score<0?'var(--sell)':'var(--muted)';
    const bullets = (g.bullets||[]).map(b => `<div class="ind-bullet"><span class="ind-dot">•</span><span>${b}</span></div>`).join('');
    return `<div class="ind-grp">
      <div class="ind-grp-hdr">
        <span>${g.icon} ${g.name} <span style="font-weight:400;color:var(--muted);font-size:9px">— ${g.desc}</span></span>
        <span class="ss-total" style="color:${sCol}">${fs(g.score)}đ / ±${g.cap}</span>
      </div>
      ${bullets}
    </div>`;
  }).join('');

  return `<div class="card ${dc}" id="c${idx}" onclick="tog(${idx})">
    <div class="ch">

        <div style="font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.8">
          EMA20: <b style="color:var(--text)">${d.ema20||'—'}</b> &nbsp;·&nbsp;

          EMA200: <b style="color:var(--text)">${d.ema200||'—'}</b><br>
          RSI: <b style="color:var(--text)">${d.rsi||'—'}</b> &nbsp;·&nbsp;
          ADX: <b style="color:var(--text)">${d.adx||'—'}</b> &nbsp;·&nbsp;

          LN YoY: <b style="color:var(--text)">${d.is_profit_growth_yoy!=null?((d.is_profit_growth_yoy*100).toFixed(1)+'%'):'—'}</b><br>

          CF Quality: <b style="color:var(--text)">${d.cf_quality_ratio||'—'}</b>
        </div>
      </div>
    </div>
  </div>`;
}

// ── State & render ───────────────────────────────────────────
let fDec='ALL', fGrp='ALL', srt='sd';

function applyAll() {
  let items = [...ALL_DATA];
  if (fDec !== 'ALL') items = items.filter(d => d.decision === fDec);
  if (fGrp !== 'ALL') items = items.filter(d => d.group === fGrp);
  if (srt==='sd') items.sort((a,b) => b.total_score - a.total_score);
  else if (srt==='sa') items.sort((a,b) => a.total_score - b.total_score);
  else items.sort((a,b) => a.symbol.localeCompare(b.symbol));
  document.getElementById('cnt').textContent = items.length;
  document.getElementById('cards').innerHTML = items.map((d,i) => renderCard(d, ALL_DATA.indexOf(d))).join('');
  updateStats();
}

function updateStats() {
  const c = {SB:0,BUY:0,NEU:0,SELL:0,SS:0};
  ALL_DATA.forEach(d => { const dc=DC(d.decision); if(dc==='SB')c.SB++; else if(dc==='BUY')c.BUY++; else if(dc==='NEU')c.NEU++; else if(dc==='SEL')c.SELL++; else c.SS++; });
  const avg = (ALL_DATA.reduce((s,d) => s+(parseFloat(d.total_score)||0), 0) / ALL_DATA.length).toFixed(1);
  document.getElementById('stats').innerHTML = [
    {k:'STRONG BUY',v:c.SB,c:'var(--sb)'},{k:'MUA',v:c.BUY,c:'var(--buy)'},
    {k:'NEUTRAL',v:c.NEU,c:'var(--neu)'},{k:'BÁN',v:c.SELL,c:'var(--sell)'},
    {k:'STRONG SELL',v:c.SS,c:'var(--ss)'},{k:'ĐIỂM TB',v:avg,c:'var(--text)'},
  ].map(r => `<div class="stat-r"><div class="sk">${r.k}</div><div class="sv" style="color:${r.c}">${r.v}</div></div>`).join('');
}

function tog(idx) { document.getElementById('c'+idx).classList.toggle('open'); }
function stab(e, idx, pane) {
  e.stopPropagation();
  const det = document.getElementById('det'+idx);
  det.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  det.querySelectorAll('.pane').forEach(p => p.classList.remove('on'));
  e.target.classList.add('on');
  document.getElementById('p'+idx+'-'+pane).classList.add('on');
}
function setupFilter(id, setter, map) {
  document.getElementById(id).addEventListener('click', e => {
    if (!e.target.dataset.v) return;
    document.querySelectorAll('#'+id+' .fb').forEach(b => {
      b.className = 'fb';
      if (b === e.target) b.className = 'fb ' + (map ? (map[b.dataset.v]||'on') : 'on');
    });
    setter(e.target.dataset.v); applyAll();
  });
}
setupFilter('fd', v => fDec=v, {'ALL':'on','STRONG BUY':'on-sb','BUY':'on-buy','NEUTRAL':'on-neu','SELL':'on-sell','STRONG SELL':'on-ss'});
setupFilter('fg', v => fGrp=v, null);
document.getElementById('srt').addEventListener('change', e => { srt=e.target.value; applyAll(); });
applyAll();

let histLoaded = HISTORY_DATA.length > 0;
let histAllRows = [...HISTORY_DATA];

function switchView(view) {
  const isHist = view === 'history';
  document.getElementById('hist-panel').classList.toggle('visible', isHist);
  document.getElementById('cards-panel').classList.toggle('hidden', isHist);
  document.getElementById('nav-signals').classList.toggle('on', !isHist);
  document.getElementById('nav-history').classList.toggle('on', isHist);
  if (isHist) renderHistory();  // luôn render lại khi vào tab Lịch sử
}

async function loadHistory() {
  renderHistory();
}

function renderHistory() {
  const body     = document.getElementById('hist-body');
  const fromVal  = document.getElementById('h-from').value;
  const symVal   = document.getElementById('h-sym').value.trim().toUpperCase();
  const decVal   = document.getElementById('h-dec').value;

  let rows = [...histAllRows];
  if (fromVal) rows = rows.filter(r => r.date >= fromVal);
  if (symVal)  rows = rows.filter(r => r.symbol === symVal);
  if (decVal)  rows = rows.filter(r => r.decision === decVal);

  // Sắp xếp: mới nhất trước
  rows.sort((a, b) => (b.ts || b.date) > (a.ts || a.date) ? 1 : -1);

  document.getElementById('h-count').textContent = rows.length + ' bản ghi';

  if (rows.length === 0) {
    body.innerHTML = '<div class="hist-loading">Không có dữ liệu phù hợp</div>';
    return;
  }

  const DC = d => ({'STRONG BUY':'SB','BUY':'BUY','NEUTRAL':'NEU','SELL':'SEL','STRONG SELL':'SS'})[d] || 'NEU';
  const SC = s => { const n=parseFloat(s)||0; return n>=80?'ht-sb':n>=40?'ht-buy':n>=-15?'ht-neu':n>=-40?'ht-sell':'ht-ss'; };
  const fN = v => { const n=parseFloat(v); return isNaN(n)?'—':n.toFixed(n%1===0||Math.abs(n)>=10?0:1); };
  const fP = v => { const n=parseFloat(v); return isNaN(n)?'—':n.toFixed(0); };

  const SCORE_COLS = ['trend_score','momentum_score','volume_score','volatility_score',
    'order_flow_score','depth_score','ff_score','fundamental_score',
    'cf_score','growth_score','context_score','news_score','confluence_bonus'];
  const CAPS = {trend_score:30,momentum_score:23,volume_score:20,volatility_score:5,
    order_flow_score:10,depth_score:5,ff_score:20,fundamental_score:20,
    cf_score:10,growth_score:10,context_score:5,news_score:5,confluence_bonus:10};
  const LABELS = {trend_score:'Xu hướng',momentum_score:'Động lượng',volume_score:'Khối lượng',
    volatility_score:'Biến động',order_flow_score:'Lực khớp',depth_score:'Lệnh chờ',
    ff_score:'NNN',fundamental_score:'Cơ bản',cf_score:'Dòng tiền',
    growth_score:'Tăng trưởng',context_score:'Thị trường',news_score:'Tin tức',confluence_bonus:'Đồng thuận'};

  function miniBar(val, cap) {
    const n   = parseFloat(val) || 0;
    const pct = Math.min(100, Math.abs(n) / cap * 100);
    const col = n > 0 ? '#34c26e' : n < 0 ? '#e86030' : '#4e7a99';
    const fs2 = v => { const x=parseFloat(v)||0; return (x>0?'+':'')+x.toFixed(Math.abs(x)>=10||x%1===0?0:1); };
    return '<div class="mini-bar-wrap"><div class="mini-bar" style="width:' + Math.max(pct*0.6,2).toFixed(0) + 'px;background:' + col + '"></div><span style="color:' + col + '">' + fs2(n) + '</span></div>';
  }

  const rows_html = rows.map(r => {
    const dc  = DC(r.decision);
    const sc  = SC(r.total_score);
    const score = parseFloat(r.total_score) || 0;
    const barsHtml = SCORE_COLS.map(k =>
      '<td title="' + LABELS[k] + '">' + miniBar(r[k], CAPS[k]) + '</td>'
    ).join('');

    return '<tr>' +
      '<td style="color:var(--muted);font-family:var(--mono);font-size:10px">' + (r.date||'') + '</td>' +
      '<td style="color:var(--muted);font-family:var(--mono);font-size:10px">' + (r.snap_time||'') + '</td>' +
      '<td><span class="sym-badge">' + (r.symbol||'') + '</span></td>' +
      '<td><span class="dc ' + dc.toLowerCase() + '">' + dc + '</span></td>' +
      '<td class="' + sc + '" style="font-family:var(--mono);font-weight:700">' + fP(r.total_score) + '</span></td>' +
      barsHtml +
      '<td style="font-family:var(--mono);font-size:10px;color:var(--muted)">' + (r.confidence||'—') + '</td>' +
      '<td style="font-family:var(--mono);font-size:10px">' + fN(r.tp1) + '</td>' +
      '<td style="font-family:var(--mono);font-size:10px">' + fN(r.stop_loss) + '</td>' +
      '<td style="font-family:var(--mono);font-size:10px;color:var(--muted)">' + (r._ctx_regime||'—') + '</td>' +
    '</tr>';
  }).join('');

  body.innerHTML = '<table class="hist-table">' +
    '<thead><tr>' +
      '<th>Ngày</th><th>Giờ</th><th>Mã</th><th>Đề xuất</th><th>Điểm</th>' +
      SCORE_COLS.map(k => '<th title="' + LABELS[k] + '">' + LABELS[k].substring(0,4) + '</th>').join('') +
      '<th>Tin cậy</th><th>TP1</th><th>SL</th><th>VNINDEX</th>' +
    '</tr></thead>' +
    '<tbody>' + rows_html + '</tbody>' +
  '</table>';
}

// Không set default date filter — hiện toàn bộ lịch sử khi mở tab
</script>
</body>
