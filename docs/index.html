<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradingBot · Signal Dashboard v10.3.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07111b;--surf:#0d1e2e;--surf2:#112438;--border:#1c3248;--border2:#244060;
  --text:#c8dcea;--muted:#4e7a99;--dim:#1e3a52;
  --sb:#00e896;--sb-bg:#001f12;--buy:#34c26e;--buy-bg:#041508;
  --neu:#f5c240;--neu-bg:#1a1400;--sell:#e86030;--sell-bg:#1a0800;
  --ss:#e02040;--ss-bg:#180308;--acc:#14b8d4;
  --mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--dim);border-radius:2px}
.topbar{position:sticky;top:0;z-index:100;background:rgba(7,17,27,.94);border-bottom:1px solid var(--border);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:44px;}
.logo{font-family:var(--mono);font-size:13px;color:var(--acc);letter-spacing:.06em;white-space:nowrap}
.vtag{font-size:9px;background:#0d2035;border:1px solid #1a3555;color:var(--acc);padding:2px 7px;border-radius:2px}
.topbar-r{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--buy);animation:blink 2s infinite;margin-right:4px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.mstrip{background:linear-gradient(90deg,#090f18,#0c1c2e 60%,#07111b);border-bottom:1px solid var(--border);padding:7px 16px;display:flex;align-items:center;gap:20px;overflow-x:auto}
.mi{display:flex;flex-direction:column;gap:1px;min-width:66px;flex-shrink:0}
.mi-l{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.mi-v{font-family:var(--mono);font-size:12px;font-weight:700}
.up{color:var(--buy)}.dn{color:var(--sell)}.warn{color:var(--neu)}.hi{color:var(--acc)}
.sep{width:1px;height:24px;background:var(--border);flex-shrink:0}
.regime{margin-left:auto;flex-shrink:0;font-family:var(--mono);font-size:9px;font-weight:700;padding:3px 10px;border-radius:2px;border:1px solid #604800;background:var(--neu-bg);color:var(--neu)}
.page{display:grid;grid-template-columns:190px 1fr;min-height:calc(100vh - 80px)}
.sidebar{background:var(--surf);border-right:1px solid var(--border);padding:12px 0;overflow-y:auto}
.sb-s{padding:0 12px 12px}
.sb-t{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.fbs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.fl{font-size:11px;color:var(--muted);margin-bottom:4px}
.fb{font-family:var(--mono);font-size:9px;padding:3px 7px;border:1px solid var(--border);border-radius:2px;background:0;color:var(--muted);cursor:pointer;transition:all .15s}
.fb:hover{border-color:var(--acc);color:var(--text)}
.fb.on{border-color:var(--acc);background:#0c2035;color:var(--acc)}
.fb.on-sb{border-color:var(--sb);background:var(--sb-bg);color:var(--sb)}
.fb.on-buy{border-color:var(--buy);background:var(--buy-bg);color:var(--buy)}
.fb.on-neu{border-color:var(--neu);background:var(--neu-bg);color:var(--neu)}
.fb.on-sell{border-color:var(--sell);background:var(--sell-bg);color:var(--sell)}
.fb.on-ss{border-color:var(--ss);background:var(--ss-bg);color:var(--ss)}
.tsel{font-family:var(--mono);font-size:9px;background:var(--surf);border:1px solid var(--border);color:var(--text);padding:3px 7px;border-radius:2px;cursor:pointer;margin-top:4px;width:100%}
.tsel:focus{outline:none;border-color:var(--acc)}
.thresh-list{font-family:var(--mono);font-size:10px;line-height:2;color:var(--muted)}
@media(max-width:720px){
  .page{grid-template-columns:1fr}
  .sidebar{border-right:none;border-bottom:1px solid var(--border);padding:6px 12px;overflow:visible}
  .sidebar .sb-t{display:none}
  .sidebar .sb-s{padding:0 0 5px}
  .sidebar .fl{display:none}
  .sidebar .fbs{margin-bottom:0;gap:3px}
  .filter-row2{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin-top:4px}
  .filter-row2 .fbs{margin:0}
  .filter-row2 .tsel{width:auto;margin-top:0}
  .sb-thresh{display:none}
}
.main{padding:14px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:12px}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
.card{background:var(--surf);border:1px solid var(--border);border-radius:5px;overflow:hidden;position:relative;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:var(--border2);box-shadow:0 4px 20px rgba(0,0,0,.4)}
.card.open{border-color:var(--acc)}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.card.SB::before{background:var(--sb)}.card.BUY::before{background:var(--buy)}
.card.NEU::before{background:var(--neu)}.card.SEL::before{background:var(--sell)}.card.SS::before{background:var(--ss)}
.ch{padding:10px 12px 8px 17px}
.ch-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ch-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.sym{font-family:var(--mono);font-size:18px;font-weight:700;color:#dceefa;letter-spacing:.05em;flex-shrink:0}
.dec-badge{font-family:var(--mono);font-size:10px;font-weight:700;padding:3px 8px;border-radius:2px;border:1px solid;letter-spacing:.06em;flex-shrink:0}
.db-SB{background:var(--sb-bg);border-color:var(--sb);color:var(--sb)}
.db-BUY{background:var(--buy-bg);border-color:var(--buy);color:var(--buy)}
.db-NEU{background:var(--neu-bg);border-color:var(--neu);color:var(--neu)}
.db-SEL{background:var(--sell-bg);border-color:var(--sell);color:var(--sell)}
.db-SS{background:var(--ss-bg);border-color:var(--ss);color:var(--ss)}
.score-inline{font-family:var(--mono);font-size:14px;font-weight:700;white-space:nowrap;flex-shrink:0}
.score-sub{font-family:var(--mono);font-size:9px;color:var(--muted)}
.c-sb{color:var(--sb)}.c-buy{color:var(--buy)}.c-neu{color:var(--neu)}.c-sell{color:var(--sell)}.c-ss{color:var(--ss)}
.ch-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px;font-size:11px;color:var(--muted)}
.ch-meta-sep{color:var(--dim)}
.conf-chip{font-family:var(--mono);font-size:9px;font-weight:700;padding:1px 6px;border-radius:2px;border:1px solid}
.conf-HIGH{border-color:var(--sb);color:var(--sb);background:var(--sb-bg)}
.conf-MED{border-color:var(--neu);color:var(--neu);background:var(--neu-bg)}
.conf-LOW{border-color:var(--sell);color:var(--sell);background:var(--sell-bg)}
.group-chip{font-family:var(--mono);font-size:9px;font-weight:700;padding:1px 6px;border-radius:2px;border:1px solid}
.gc-GAINER{border-color:#0c4020;color:var(--buy);background:var(--buy-bg)}
.gc-LOSER{border-color:var(--sell-bg);color:var(--sell);background:var(--sell-bg)}
.v2tag{font-family:var(--mono);font-size:9px;padding:1px 6px;border-radius:2px;border:1px solid #0d3555;background:#061220;color:var(--acc)}
.dq-chip{font-family:var(--mono);font-size:9px;font-weight:700;padding:1px 6px;border-radius:2px;border:1px solid var(--sell);color:var(--sell);background:var(--sell-bg);cursor:help}
.dq-chip.dq-stale{border-color:var(--neu);color:var(--neu);background:var(--neu-bg)}
.dq-warn{margin:6px 12px 0 17px;padding:6px 10px;border-radius:3px;background:#1a0800;border:1px solid var(--sell);font-size:11px;color:var(--sell);line-height:1.5}
.dq-warn.dq-warn-stale{background:#1a1400;border-color:var(--neu);color:var(--neu)}
.dq-warn b{color:#fff}
.dq-list{font-family:var(--mono);font-size:10px;color:var(--text);margin-top:3px}
.trade-blk{padding:8px 12px 8px 17px;border-top:1px solid var(--border)}
.price-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.price-left{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tl{font-size:11px;color:var(--muted);flex-shrink:0}
.tv{font-family:var(--mono);font-size:13px;font-weight:600}
.tv.price{font-size:16px;color:#e0eefa}
.tv.tp{color:var(--buy)}.tv.sl{color:var(--sell)}.tv.entry{color:var(--acc)}
.price-chg{font-family:var(--mono);font-size:11px;font-weight:700;margin-left:2px;white-space:nowrap}
.price-up{color:var(--buy)}.price-dn{color:var(--sell)}.price-flat{color:var(--muted)}
.trade-status{display:flex;align-items:center;gap:6px;flex-shrink:0}
.trade-rows{margin-bottom:6px}
.trade-row{display:flex;align-items:baseline;gap:8px;margin-bottom:3px;flex-wrap:wrap}
.pct{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:2px}
.pct-p{background:var(--buy-bg);color:var(--buy)}.pct-n{background:var(--sell-bg);color:var(--sell)}
.rr-inline{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.rr-val{color:var(--text);font-weight:700;font-size:12px}
.size-chip{font-weight:700;padding:2px 8px;border-radius:2px;font-size:10px;border:1px solid;white-space:nowrap}
.sc-FULL{border-color:var(--sb);color:var(--sb);background:var(--sb-bg)}
.sc-HALF{border-color:var(--neu);color:var(--neu);background:var(--neu-bg)}
.sc-NO{border-color:var(--muted);color:var(--muted);background:transparent}
.of-depth-panel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
@media(max-width:460px){.of-depth-panel{grid-template-columns:1fr}}
.of-blk,.depth-blk{padding:8px 10px;border-radius:3px;background:#0a1a28;border:1px solid var(--border)}
.of-hdr,.depth-hdr{font-size:9px;color:var(--muted);margin-bottom:6px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between}
.of-hdr-badge{font-size:9px;font-weight:700;padding:1px 6px;border-radius:2px;border:1px solid}
.of-badge-buy{border-color:var(--buy);color:var(--buy);background:var(--buy-bg)}
.of-badge-sell{border-color:var(--sell);color:var(--sell);background:var(--sell-bg)}
.of-badge-neu{border-color:var(--muted);color:var(--muted);background:transparent}
.of-stat{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid #0d1b28;font-size:10px}
.of-stat:last-child{border:none}
.of-stat-l{font-family:var(--mono);font-size:9px;color:var(--muted)}
.of-stat-v{font-family:var(--mono);font-size:10px;font-weight:700}
.br-bar-wrap{margin:5px 0 4px}
.br-bar-track{height:5px;background:#0d1e2e;border-radius:3px;overflow:hidden;position:relative}
.br-bar-buy{position:absolute;left:0;top:0;height:100%;border-radius:3px;background:var(--buy)}
.br-bar-sell{position:absolute;right:0;top:0;height:100%;border-radius:3px;background:var(--sell)}
.br-labels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;margin-top:3px}
.of-pattern-chip{display:inline-block;margin-top:5px;font-family:var(--mono);font-size:9px;font-weight:700;padding:2px 8px;border-radius:2px;border:1px solid;letter-spacing:.04em}
.ofc-acc{border-color:var(--buy);color:var(--buy);background:var(--buy-bg)}
.ofc-dist{border-color:var(--sell);color:var(--sell);background:var(--sell-bg)}
.ofc-neu{border-color:var(--neu);color:var(--neu);background:var(--neu-bg)}
.ofc-weak{border-color:var(--muted);color:var(--muted);background:transparent}
.depth-row{display:flex;gap:8px}
.depth-col{flex:1}
.depth-label{font-size:9px;color:var(--muted);margin-bottom:3px;font-family:var(--mono);letter-spacing:.04em}
.depth-label.bid{color:#34c26ecc;letter-spacing:.06em}
.depth-label.ask{color:#e86030cc;letter-spacing:.06em}
.depth-item{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;padding:2px 0;border-bottom:1px solid #0d1b2860}
.depth-item:last-child{border:none}
.di-price{color:var(--text)}.di-vol{color:var(--muted)}
.wall-bid .di-price{color:var(--buy)}.wall-bid .di-vol{color:var(--buy);font-weight:700}
.wall-ask .di-price{color:var(--sell)}.wall-ask .di-vol{color:var(--sell);font-weight:700}
.warn-box{margin-top:6px;padding:6px 10px;border-radius:3px;background:#0d1822;border:1px solid var(--border);font-size:11px;color:var(--muted);line-height:1.6}
.verdict-blk{padding:8px 12px 8px 17px;border-top:1px solid var(--border)}
.pc-item{display:flex;align-items:flex-start;gap:7px;margin-bottom:5px;font-size:12px;line-height:1.55}
.pc-item:last-child{margin-bottom:0}
.pflag{display:inline-block;font-family:var(--mono);font-size:9px;padding:2px 8px;border-radius:2px;border:1px solid;letter-spacing:.05em;margin:0 4px 4px 0}
.pf-CONSENSUS_BULL{border-color:var(--sb);color:var(--sb);background:var(--sb-bg)}
.pf-CONSENSUS_BEAR{border-color:var(--ss);color:var(--ss);background:var(--ss-bg)}
.pf-BULL_TRAP_RISK{border-color:var(--neu);color:var(--neu);background:var(--neu-bg)}
.pf-VALUE_OPPORTUNITY{border-color:var(--acc);color:var(--acc);background:#061a25}
.pf-UNCLEAR{border-color:var(--muted);color:var(--muted);background:#0a1422}
.pf-TA_MISSING{border-color:var(--sell);color:var(--sell);background:var(--sell-bg)}
.pf-DATA_INCOMPLETE{border-color:var(--sell);color:var(--sell);background:var(--sell-bg)}
.sbar-blk{padding:8px 12px 8px 17px;border-top:1px solid var(--border)}
.sbar-ttl{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.sbar-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.sbar-icon{font-size:10px;flex-shrink:0}
.sbar-lbl{font-size:11px;color:var(--muted);width:82px;flex-shrink:0}
.sbar-track{flex:1;height:6px;background:#0d1e2e;border-radius:3px;overflow:hidden}
.sbar-fill{height:100%;border-radius:3px}
.sbar-num{font-family:var(--mono);font-size:10px;width:60px;text-align:right;flex-shrink:0}
.sbar-weight{font-family:var(--mono);font-size:9px;color:var(--muted);width:28px;text-align:right;flex-shrink:0}
.sum-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding-top:6px;border-top:1px solid var(--border);font-family:var(--mono);font-size:11px}
.sum-val{font-size:13px;font-weight:700}
.card-detail{display:none;border-top:1px solid var(--border);background:#080f18}
.card.open .card-detail{display:block}
.tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;flex-shrink:0}
.tab:hover{color:var(--text)}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.pane{display:none;padding:14px 12px 14px 17px}
.pane.on{display:block}
.ind-grp{margin-bottom:16px}
.ind-grp-hdr{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--acc);margin-bottom:7px;padding-bottom:6px;border-bottom:1px solid var(--border);letter-spacing:.06em}
.ind-bullet{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.6;padding:4px 0;border-bottom:1px solid #0d1b28;color:var(--text)}
.ind-bullet:last-child{border:none}
.ind-dot{flex-shrink:0;color:var(--muted);margin-top:4px;font-size:10px}
.ind-exp{flex:1;min-width:0}
.bsc{flex-shrink:0;align-self:flex-start;margin-top:1px;font-family:var(--mono);font-size:9px;font-weight:700;padding:1px 6px;border-radius:2px;border:1px solid;white-space:nowrap}
.bsc-p{color:var(--buy);border-color:var(--buy);background:var(--buy-bg)}
.bsc-n{color:var(--sell);border-color:var(--sell);background:var(--sell-bg)}
.bsc-z{color:var(--muted);border-color:var(--dim);background:transparent}
.ss-total{font-size:12px}
.charts-wrap{margin-bottom:14px}
.charts-toggle{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--acc);background:var(--surf);border:1px solid var(--border);border-radius:4px;padding:6px 12px;cursor:pointer;margin-bottom:10px}
.charts-toggle:hover{border-color:var(--acc)}
.charts-body{display:flex;flex-direction:column;gap:12px}
.chart-card{background:var(--surf);border:1px solid var(--border);border-radius:6px;padding:12px 14px}
.chart-ttl{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--acc);text-transform:uppercase;margin-bottom:8px}
.chart-card svg{width:100%;height:auto;display:block}
#quad{max-width:620px;margin:0 auto}
.chart-card text{font-family:var(--mono)}
.bub{cursor:pointer;transition:opacity .12s}.bub:hover{opacity:.78}
.barG{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:7px 13px;margin-top:10px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.lg{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}.sq{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.qcell{border:1px solid var(--border);border-radius:4px;padding:7px 9px}
.qcell b{font-family:var(--mono);font-size:10px}
.qcell .cond{font-family:var(--mono);font-size:9px;color:var(--muted);margin:2px 0 4px}
.qcell .el{font-size:10.5px;color:var(--text);line-height:1.45}
.chart-note{font-size:10.5px;color:var(--muted);margin-top:8px;line-height:1.5;border-top:1px solid var(--border);padding-top:8px}
.chart-note b{color:var(--text)}
.cards-hint{padding:22px 16px;text-align:center;color:var(--muted);font-size:12.5px;border:1px dashed var(--border);border-radius:6px;background:var(--surf)}
.single-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.single-bar b{color:var(--text);font-size:13px}
.single-close{margin-left:auto;cursor:pointer;border:1px solid var(--border);border-radius:3px;padding:3px 9px;color:var(--muted)}
.single-close:hover{border-color:var(--acc);color:var(--acc)}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">TradingBot <span class="vtag">v10.3.3·v2.3</span></div>
  <div class="topbar-r">
    <span><span class="live-dot"></span><span id="ts-disp">—</span></span>
    <span>VN100+HNX30</span>
  </div>
</header>

<div class="mstrip" id="mstrip-bar"></div>

<div class="page">
  <aside class="sidebar">
    <div class="sb-s">
      <div class="sb-t">Bộ lọc</div>
      <div class="fl">Decision</div>
      <div class="fbs" id="fd">
        <button class="fb on" data-v="ALL">Tất cả</button>
        <button class="fb" data-v="BUY">BUY</button>
        <button class="fb" data-v="STRONG BUY">S.BUY</button>
        <button class="fb" data-v="NEUTRAL">NEU</button>
        <button class="fb" data-v="SELL">SELL</button>
        <button class="fb" data-v="STRONG SELL">S.SELL</button>
      </div>
      <div class="filter-row2">

function parseFlags(pf) {
  if (pf == null) return [];
  if (Array.isArray(pf)) return pf.map(x => String(x).trim()).filter(Boolean);
  const s = String(pf).trim();
  if (!s || s === 'None' || s === 'NONE' || s === 'null' || s === '[]') return [];
  return s.split(',').map(f => f.trim()).filter(Boolean);
}

function buildDataQuality(d) {
  const dm = d._data_missing_arr || [];
  const completeness = d.data_completeness != null ? parseFloat(d.data_completeness) : null;
  const flags = d._pattern_flags_arr || [];
  const taMissing = flags.includes('TA_MISSING');
  const dataIncomplete = flags.includes('DATA_INCOMPLETE');
  const taStale = dm.find(x => /TA-cache-\d+d/.test(x));
  const taFromCache = d._ta_from_cache === true || d._ta_from_cache === 'true';

  const out = { chip: '', warn: '' };
  if (!dm.length && !taMissing && !dataIncomplete && !taFromCache) return out;

  let chipCls = 'dq-chip';
  let chipText = '';
  if (taMissing) { chipText = '⚠ TA MISSING'; }
  else if (dataIncomplete) { chipText = `⚠ THIẾU ${dm.length} FIELD`; }
  else if (taStale) { chipCls += ' dq-stale'; chipText = `⏱ ${taStale.toUpperCase()}`; }
  else if (dm.length) { chipCls += ' dq-stale'; chipText = `⚠ THIẾU ${dm.length}`; }
  if (chipText) {
    const tip = dm.length ? `Thiếu: ${dm.join(', ')}` : (taMissing ? 'TA fetch hoàn toàn fail' : '');
    out.chip = `<span class="${chipCls}" title="${tip}">${chipText}</span>`;
  }

  if (taMissing || dataIncomplete) {
    const head = taMissing ? '⚠️ <b>TA MISSING</b> — không có chỉ báo kỹ thuật, decision đã bị ép NEUTRAL+LOW'
                            : `⚠️ <b>DỮ LIỆU KHÔNG ĐẦY ĐỦ</b> — ${dm.length} field bị thiếu, độ tin cậy giảm`;
    const list = dm.length ? `<div class="dq-list">Thiếu: ${dm.join(' · ')}</div>` : '';
    const compl = completeness != null ? `<div class="dq-list">Completeness: ${(completeness*100).toFixed(0)}%</div>` : '';
    out.warn = `<div class="dq-warn">${head}${list}${compl}</div>`;
  } else if (taStale) {
    const days = taStale.match(/\d+/)?.[0] || '?';
    out.warn = `<div class="dq-warn dq-warn-stale">⏱ <b>TA cache ${days} ngày</b> — chỉ báo lấy từ phiên trước, confidence đã hạ. ${dm.length?`<div class="dq-list">Thiếu: ${dm.join(' · ')}</div>`:''}</div>`;
  }
  return out;
}

    const pct  = Math.min(100, Math.abs(v)/cap*100);
    const col  = v>0?(Math.abs(norm)>0.65?'var(--sb)':'var(--buy)'):v<0?(Math.abs(norm)>0.65?'var(--ss)':'var(--sell)'):'var(--muted)';

        <span class="size-chip sc-${d.size_hint||'NO'}">${d.size_hint||'?'}</span>

  const tradeHtml = `<div class="trade-blk">
  <div class="price-row">

  </div>
  ${hasTrade?`<div class="trade-rows">
    <div class="trade-row"><span class="tl">🟩 Vùng mua</span><span class="tv entry">${d.entry_low!=null?(d.entry_low+' – '+(d.entry_high||d.entry)):'—'}</span></div>
    <div class="trade-row"><span class="tl">🎯 Chốt lời</span><span class="tv tp">${d.tp1!=null?(d.tp1+(d.tp2?' / '+d.tp2:'')):'—'}</span></div>
    <div class="trade-row"><span class="tl">🛑 Cắt lỗ</span><span class="tv sl">${d.stop_loss!=null?d.stop_loss:'—'} <span class="pct pct-n">-${d.risk_pct||'?'}%</span></span></div>
    ${d.entry_style?`<div class="trade-row"><span class="tl" style="color:var(--muted)">Kiểu vào</span><span style="font-family:var(--mono);font-size:11px;color:var(--muted)">${d.entry_style}</span></div>`:''}
  </div>`:''}
  <div class="of-depth-panel">${buildOFHtml(d)}${buildDepthHtml(d)}</div>
  ${d.flags?d.flags.split(',').map(f=>{const k=f.trim();return(d._flags_vn&&d._flags_vn[k])?`<div class="warn-box">⚠️ ${d._flags_vn[k]}</div>`:''}).join(''):''}
</div>`;

  const verdict = d._verdict||{pros:[],cons:[]};

  const verdictHtml = `<div class="verdict-blk">
    ${flags.map(f=>`<span class="pflag pf-${f}">${f}</span>`).join('')}

  const groupsHtml = (d._groups_arr||[]).map(g => {
    const sCol = g.score>0?'var(--buy)':g.score<0?'var(--sell)':'var(--muted)';
    const w = WEIGHTS[g.key] || 0;

    return `<div class="ind-grp">
      <div class="ind-grp-hdr">

  const baseScore = parseFloat(d.base_score_v2)||0;
  const confBonus = parseFloat(d.confluence_bonus)||0;
  const scoreBreakdown = `<div style="font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:4px;text-align:right">
    base=${fsT(baseScore)} conf=${fs(confBonus)}

  // v2.2 helper: format derived values for Trade Setup tab
  const fmtPctV = v => v!=null?(v>0?'+':'')+parseFloat(v).toFixed(1)+'%':'—';
  const fmtV    = v => v!=null?Number(v).toLocaleString('vi-VN'):'—';

  return `<div class="card ${dc}" id="c${idx}" onclick="tog(${idx})">
  <div class="ch">
    <div class="ch-top">
      <div class="ch-left">
        <span class="sym">${d.symbol}</span>
        <span class="dec-badge db-${dc}">${d.decision}</span>
        ${scoreHtml}
      </div>
      <span class="v2tag">v2.3</span>
    </div>
    <div class="ch-meta">
      <span>${d.industry||''}</span>
      ${d.exchange?`<span class="ch-meta-sep">·</span><span>${d.exchange}</span>`:''}
      ${confHtml}
      ${groupHtml}
      ${dq.chip}
    </div>
  </div>
  ${dq.warn}
  ${tradeHtml}
  ${verdictHtml}
  <div class="sbar-blk">
    <div class="sbar-ttl"><span>📊 Điểm từng nhóm</span><span style="color:var(--muted);font-size:9px">điểm / cap · weight%</span></div>
    ${barsHtml}
    <div class="sum-row">
      <span style="font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em">TỔNG</span>
      <div>
        <span class="sum-val ${sc}">${fsT(d.total_score)} / 100</span>
        ${scoreBreakdown}
      </div>
    </div>
  </div>
  <div class="card-detail" id="det${idx}">
    <div class="tabs" onclick="event.stopPropagation()">
      <div class="tab on" onclick="stab(event,${idx},'tele')">📱 Diễn giải</div>
      <div class="tab" onclick="stab(event,${idx},'trade')">💼 Trade Setup</div>
    </div>
    <div class="pane on" id="p${idx}-tele">${groupsHtml}</div>
    <div class="pane" id="p${idx}-trade">
      <div style="font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.8">
        <div style="color:var(--acc);font-weight:700;margin-bottom:4px">📈 TREND</div>
        EMA20:<b>${d.ema20||'—'}</b> · EMA50:<b>${d.ema50||'—'}</b> · EMA200:<b>${d.ema200||'—'}</b><br>
        ADX:<b>${d.adx||'—'}</b> · Supertrend:<b>${d.supertrend||'—'}</b><br>
        <span style="color:var(--acc)">v2.2:</span> LinReg(20):<b>${d.linreg_20||'—'}</b> slope/5d:<b style="color:${(d.linreg_slope_pct||0)>0?'var(--buy)':'var(--sell)'}">${fmtPctV(d.linreg_slope_pct)}</b> · Aroon Osc:<b>${d.aroon_osc!=null?d.aroon_osc:'—'}</b><br>
        <span style="color:var(--acc)">v2.2:</span> Donchian PrevDay: H<b>${d.donchian_upper_prev||'—'}</b> / L<b>${d.donchian_lower_prev||'—'}</b><br>
        52W Hi:<b>${d.high_52w||'—'}</b> · 52W Lo:<b>${d.low_52w||'—'}</b> · RS20d:<b>${d.return_20d!=null?d.return_20d+'%':'—'}</b> vs VNI:<b>${d.vnindex_return_20d!=null?d.vnindex_return_20d+'%':'—'}</b><br><br>

        <div style="color:var(--acc);font-weight:700;margin-bottom:4px">⚡ MOMENTUM</div>
        RSI:<b>${d.rsi||'—'}</b> · MACD hist:<b>${d.macd_hist!=null?d.macd_hist:'—'}</b> · Stoch K/D:<b>${d.stoch_k!=null?d.stoch_k:'—'}/${d.stoch_d!=null?d.stoch_d:'—'}</b><br>
        ROC10:<b>${d.roc_10!=null?d.roc_10+'%':'—'}</b> · <span style="color:var(--acc)">v2.2:</span> Williams%R:<b>${d.willr_14!=null?d.willr_14:'—'}</b><br><br>

        <div style="color:var(--acc);font-weight:700;margin-bottom:4px">📦 VOLUME</div>
        CMF:<b>${d.cmf!=null?d.cmf:'—'}</b> · MFI:<b>${d.mfi!=null?d.mfi:'—'}</b> · Vol/TB20:<b>${d.vol_ma_ratio!=null?d.vol_ma_ratio+'×':'—'}</b><br>
        <span style="color:var(--acc)">v2.2:</span> AD Line:<b>${fmtV(d.ad_line)}</b> · AD slope 20d:<b style="color:${(d.ad_slope_20d_pct||0)>0?'var(--buy)':'var(--sell)'}">${fmtPctV(d.ad_slope_20d_pct)}</b><br>
        <span style="color:var(--acc)">v2.2:</span> EFI(13):<b style="color:${(d.efi_13||0)>0?'var(--buy)':'var(--sell)'}">${fmtV(d.efi_13)}</b><br><br>

        <div style="color:var(--acc);font-weight:700;margin-bottom:4px">🎢 VOLATILITY · 🌐 FOREIGN · 🏢 FUNDAMENTAL</div>
        BB pos:<b>${d.bb_position!=null?d.bb_position:'—'}</b> · ATR%:<b>${d.atr_pct!=null?d.atr_pct+'%':'—'}</b><br>
        FF Room:<b style="color:var(--acc)">${d.ff_room!=null?d.ff_room+'%':'—'}</b> · FF 5d:<b style="color:${(d.ff_net_val_5d||0)>0?'var(--buy)':'var(--sell)'}">${d.ff_net_val_5d!=null?((d.ff_net_val_5d/1e9).toFixed(1)+'tỷ'):'—'}</b><br>
        P/E:<b>${d.r_pe||'—'}</b> · P/B:<b>${d.r_pb||'—'}</b> · ROE:<b>${d.r_roe||'—'}%</b> · D/E:<b>${d.bs_debt_to_equity||'—'}</b><br>
        DT YoY:<b>${d.is_rev_growth_yoy!=null?((d.is_rev_growth_yoy*100).toFixed(1)+'%'):'—'}</b> · LN YoY:<b>${d.is_profit_growth_yoy!=null?((d.is_profit_growth_yoy*100).toFixed(1)+'%'):'—'}</b><br>
        Insider B:<b>${d.insider_buy_count||'—'}</b> / S:<b>${d.insider_sell_count||'—'}</b> · DivYield:<b>${d.r_div_yield!=null?parseFloat(d.r_div_yield).toFixed(1)+'%':'—'}</b><br>
        PropTrade 5d:<b style="color:${(d.pt_net_val_5d||0)>0?'var(--buy)':'var(--sell)'}">${d.pt_net_val_5d!=null?((d.pt_net_val_5d/1e9).toFixed(1)+'tỷ'):'—'}</b> · 20d:<b>${d.pt_net_val_20d!=null?((d.pt_net_val_20d/1e9).toFixed(1)+'tỷ'):'—'}</b><br>
        EPScons:<b>${d.eps_consistency!=null?d.eps_consistency+'Q':'—'}</b> · Breadth:<b>${d.market_breadth_pct!=null?d.market_breadth_pct+'%':'—'}</b>
        ${d._ta_from_cache?`<br><span style="color:var(--neu)">⏱ TA từ cache (${d._ta_stale_days||'?'}d)</span>`:''}
      </div>
    </div>
  </div>
</div>`;
}

let fDec='ALL', fGrp='ALL', srt='sd';

function getFilteredSorted() {
  let its = [...ALL_DATA];
  if (fDec!=='ALL') its = its.filter(d=>d.decision===fDec);
  if (fGrp!=='ALL') its = its.filter(d=>d.group===fGrp);
  if (srt==='sd') its.sort((a,b)=>b.total_score-a.total_score);
  else if (srt==='sa') its.sort((a,b)=>a.total_score-b.total_score);
  else its.sort((a,b)=>a.symbol.localeCompare(b.symbol));
  return its;
}

function applyAll() {
  const its = getFilteredSorted();
  document.getElementById('cards').innerHTML = its.map((d,i)=>renderCard(d,ALL_DATA.indexOf(d))).join('');
  if (window.renderCharts) window.renderCharts(its);
}

function tog(idx){ document.getElementById('c'+idx).classList.toggle('open'); }
function stab(e,idx,pane){
  e.stopPropagation();
  const det=document.getElementById('det'+idx);
  det.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  det.querySelectorAll('.pane').forEach(p=>p.classList.remove('on'));
  e.target.classList.add('on');
  document.getElementById('p'+idx+'-'+pane).classList.add('on');
}
function setupFilter(id,setter,map){
  document.getElementById(id).addEventListener('click',e=>{
    if(!e.target.dataset.v) return;
    document.querySelectorAll('#'+id+' .fb').forEach(b=>{
      b.className='fb';
      if(b===e.target) b.className='fb '+(map?(map[b.dataset.v]||'on'):'on');
    });
    setter(e.target.dataset.v); applyAll();
  });
}
setupFilter('fd',v=>fDec=v,{'ALL':'on','STRONG BUY':'on-sb','BUY':'on-buy','NEUTRAL':'on-neu','SELL':'on-sell','STRONG SELL':'on-ss'});
setupFilter('fg',v=>fGrp=v,null);
document.getElementById('srt').addEventListener('change',e=>{srt=e.target.value;applyAll();});

</script>
<script>
/* ===== Charts overlay v3.2 — quadrant range updated ±125/±54 for v2.2 ===== */
(function () {
  if (typeof ALL_DATA === 'undefined') return;
  var SVGNS = 'http://www.w3.org/2000/svg';
  function E(tag, a, txt) { var e = document.createElementNS(SVGNS, tag); for (var k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; }
  function clear(el) { if (!el) return; while (el.firstChild) el.removeChild(el.firstChild); }
  var DECCOL = { 'STRONG BUY': '#00e896', 'BUY': '#34c26e', 'NEUTRAL': '#f5c240', 'SELL': '#e86030', 'STRONG SELL': '#e02040' };
  var clamp = function (v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; };

  function showHint() {
    var c = document.getElementById('cards');
    if (c) c.innerHTML = '<div class="cards-hint">👆 Bấm 1 mã trên biểu đồ phía trên để xem diễn giải chi tiết của mã đó · hoặc dùng bộ lọc bên trái.</div>';
  }
  window.showHint = showHint;

  function openSymbol(sym) {
    var idx = ALL_DATA.findIndex(function (d) { return d.symbol === sym; });
    if (idx < 0 || typeof renderCard !== 'function') return;
    var cards = document.getElementById('cards'); if (!cards) return;
    var bar = '<div class="single-bar">Đang xem <b>' + sym + '</b><span class="single-close" id="single-close">✕ ẩn diễn giải</span></div>';
    cards.innerHTML = bar + renderCard(ALL_DATA[idx], idx);
    var cl = document.getElementById('single-close'); if (cl) cl.onclick = function () { showHint(); };
    var el = document.getElementById('c' + idx);
    if (el) { el.classList.add('open'); el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  }
  window.openSymbol = openSymbol;

  var tgl = document.getElementById('charts-toggle');
  if (tgl) tgl.onclick = function () {
    var w = document.getElementById('charts-body');
    var hidden = w.style.display === 'none';
    w.style.display = hidden ? '' : 'none';
    tgl.textContent = hidden ? '📊 Biểu đồ tổng quan ▾' : '📊 Biểu đồ tổng quan ▸';
  };

  // ===== CHART 1: QUADRANT — v2.2: range ±125 (tech) × ±54 (fund) =====
  function buildQuad(data) {
    var svg = document.getElementById('quad'); if (!svg) return;
    clear(svg); clear(document.getElementById('quadLegend')); clear(document.getElementById('qgrid'));
    var W = 640, H = 470, m = { l: 48, r: 18, t: 20, b: 38 };
    var x0 = m.l, x1 = W - m.r, y0 = H - m.b, y1 = m.t;
    // v10.3.3: auto-scale trục theo data thật (0 luôn ở giữa) — tránh nén mã
    // tech/fund nhỏ vào sát trục. Floor ±40/±20 (đảm bảo thấy ngưỡng ±30/±15);
    // cap ±125/±54 = giới hạn lý thuyết; padding 15%, làm tròn bước đẹp.
    var _tmax = 0, _fmax = 0;
    data.forEach(function (d) {
      var tv = Math.abs(+d.tech_score || 0), fv = Math.abs(+d.fund_score || 0);
      if (tv > _tmax) _tmax = tv; if (fv > _fmax) _fmax = fv;
    });
    var xr = Math.min(125, Math.max(40, Math.ceil((_tmax * 1.15) / 10) * 10));
    var yr = Math.min(54,  Math.max(20, Math.ceil((_fmax * 1.15) / 5) * 5));
    var xmin = -xr, xmax = xr, ymin = -yr, ymax = yr;
    var sx = function (v) { return x0 + (clamp(v, xmin, xmax) - xmin) / (xmax - xmin) * (x1 - x0); };
    var sy = function (v) { return y0 - (clamp(v, ymin, ymax) - ymin) / (ymax - ymin) * (y0 - y1); };
    var zx = sx(0), zy = sy(0);
    [[zx, y1, x1 - zx, zy - y1, '#001f1240'], [zx, zy, x1 - zx, y0 - zy, '#1a140028'], [x0, y1, zx - x0, zy - y1, '#0c203522'], [x0, zy, zx - x0, y0 - zy, '#18030828']].forEach(function (z) { svg.appendChild(E('rect', { x: z[0], y: z[1], width: z[2], height: z[3], fill: z[4] })); });
    // Threshold lines (CONSENSUS_BULL/BEAR boundary) — giữ ±30 / ±15
    [-30, 30].forEach(function (v) { svg.appendChild(E('line', { x1: sx(v), y1: y1, x2: sx(v), y2: y0, stroke: '#244060', 'stroke-dasharray': '3 3' })); });
    [-15, 15].forEach(function (v) { svg.appendChild(E('line', { x1: x0, y1: sy(v), x2: x1, y2: sy(v), stroke: '#244060', 'stroke-dasharray': '3 3' })); });
    svg.appendChild(E('line', { x1: zx, y1: y1, x2: zx, y2: y0, stroke: '#4e7a99', 'stroke-width': 1.2 }));
    svg.appendChild(E('line', { x1: x0, y1: zy, x2: x1, y2: zy, stroke: '#4e7a99', 'stroke-width': 1.2 }));
    // Tick step: 50 cho X (range mới rộng hơn), 15 cho Y (giữ nguyên)
    var _xstep = xmax <= 50 ? 10 : xmax <= 90 ? 20 : 25;
    for (var vx = -Math.floor(xmax / _xstep) * _xstep; vx <= xmax; vx += _xstep) { if (vx === 0) continue; svg.appendChild(E('text', { x: sx(vx), y: y0 + 15, fill: '#4e7a99', 'font-size': 8, 'text-anchor': 'middle' }, vx)); }
    var _ystep = ymax <= 25 ? 5 : ymax <= 40 ? 10 : 15;
    for (var vy = -Math.floor(ymax / _ystep) * _ystep; vy <= ymax; vy += _ystep) { if (vy === 0) continue; svg.appendChild(E('text', { x: x0 - 6, y: sy(vy) + 3, fill: '#4e7a99', 'font-size': 8, 'text-anchor': 'end' }, vy)); }
    svg.appendChild(E('text', { x: (x0 + x1) / 2, y: H - 4, fill: '#c8dcea', 'font-size': 10, 'text-anchor': 'middle', 'font-weight': 700 }, 'tech_score → (±' + xmax + ', cap 125)'));
    svg.appendChild(E('text', { x: 13, y: (y0 + y1) / 2, fill: '#c8dcea', 'font-size': 10, 'text-anchor': 'middle', 'font-weight': 700, transform: 'rotate(-90 13 ' + ((y0 + y1) / 2) + ')' }, 'fund_score → (±' + ymax + ', cap 54)'));
    data.forEach(function (d) {
      var vmr = +d.vol_ma_ratio || 0;
      var r = Math.max(7, Math.min(24, 7 + Math.sqrt(vmr) * 4.5));
      var c = DECCOL[d.decision] || '#f5c240';
      var cx = sx(+d.tech_score || 0), cy = sy(+d.fund_score || 0);
      var g = E('g', { class: 'bub' });
      g.appendChild(E('title', {}, d.symbol + ' · ' + d.decision + ' · total ' + d.total_score + '\ntech ' + d.tech_score + ' · fund ' + d.fund_score + ' · vol ' + vmr + 'x'));
      g.appendChild(E('circle', { cx: cx, cy: cy, r: r, fill: c, 'fill-opacity': .62, stroke: '#07111b', 'stroke-width': 1.4 }));
      g.appendChild(E('circle', { cx: cx, cy: cy, r: r, fill: 'none', stroke: c, 'stroke-width': 1.6, 'stroke-opacity': .9 }));
      var tc = (d.decision === 'NEUTRAL') ? '#1a1400' : '#07111b';
      g.appendChild(E('text', { x: cx, y: cy + 3.2, fill: tc, 'font-size': 9.5, 'font-weight': 700, 'text-anchor': 'middle', 'pointer-events': 'none' }, d.symbol));
      g.onclick = function () { openSymbol(d.symbol); };
      svg.appendChild(g);
    });
    var Lg = document.getElementById('quadLegend');
    if (Lg) { Object.keys(DECCOL).forEach(function (k) { Lg.insertAdjacentHTML('beforeend', '<span class="lg"><span class="dot" style="background:' + DECCOL[k] + '"></span>' + k + '</span>'); }); Lg.insertAdjacentHTML('beforeend', '<span class="lg" style="color:#4e7a99">◯ to = vol_ma_ratio cao</span>'); }
    var corners = [
      ['VALUE_OPPORTUNITY', '#14b8d4', 'tech −  /  fund +', 'Kỹ thuật yếu nhưng cơ bản tốt → vùng tích lũy giá trị.'],
      ['CONSENSUS_BULL', '#00e896', 'tech +  /  fund +', 'Kỹ thuật + cơ bản cùng ủng hộ → tin cậy cao, ưu tiên mua.'],
      ['CONSENSUS_BEAR', '#e02040', 'tech −  /  fund −', 'Cả hai cùng xấu → tránh.'],
      ['BULL_TRAP_RISK', '#f5c240', 'tech +  /  fund −', 'Kỹ thuật mạnh nhưng nền tảng yếu → coi chừng bẫy tăng giá.']
    ];
    var qg = document.getElementById('qgrid');
    if (qg) corners.forEach(function (c) { qg.insertAdjacentHTML('beforeend', '<div class="qcell"><b style="color:' + c[1] + '">' + c[0] + '</b><div class="cond">' + c[2] + '</div><div class="el">' + c[3] + '</div></div>'); });
    var an = document.getElementById('quadNote');
    if (an) an.innerHTML = '<b>X · tech_score</b> = trend+mom+vol+volat+order_flow (trục auto-scale, cap lý thuyết ±125, đường đứt = ngưỡng flag ±30). <b>Y · fund_score</b> = fund+cf+growth (trục auto-scale, cap ±54, đường đứt = ngưỡng ±15). <b>Bong bóng</b> = vol_ma_ratio · <b>màu</b> = decision. <b>Đang hiển thị ' + data.length + ' mã</b> theo bộ lọc.';
  }

  // ===== CHART 2: GAINER / LOSER — không đổi =====
  function buildGL(data) {
    var svg = document.getElementById('gl'); if (!svg) return;
    clear(svg); clear(document.getElementById('glLegend'));
    var gn = document.getElementById('glNote'); if (gn) gn.innerHTML = '';
    var W = 900, H = 380, m = { l: 40, r: 14, t: 18, b: 84 };
    var x0 = m.l, x1 = W - m.r, y0 = H - m.b, y1 = m.t;
    var byScore = function (a, b) { return b.total_score - a.total_score; };
    var G = data.filter(function (d) { return d.group === 'GAINER'; }).sort(byScore);
    var L = data.filter(function (d) { return d.group === 'LOSER'; }).sort(byScore);
    if (!G.length && !L.length) { G = data.slice().sort(byScore); }
    var ord = G.concat([null]).concat(L), n = ord.length;
    var bw = (x1 - x0) / n * 0.62, step = (x1 - x0) / n;
    var vals = data.reduce(function (a, d) { a.push(+d.total_score || 0, +d.fund_score || 0); return a; }, []);
    var vmax = Math.max.apply(null, [35].concat(vals)), vmin = Math.min.apply(null, [-30].concat(vals));
    var sy = function (v) { return y0 - (v - vmin) / (vmax - vmin) * (y0 - y1); };
    [[50, '#00e896'], [25, '#34c26e'], [-10, '#f5c240'], [-25, '#e86030']].forEach(function (t) {
      var v = t[0], c = t[1]; if (v <= vmax && v >= vmin) { svg.appendChild(E('line', { x1: x0, y1: sy(v), x2: x1, y2: sy(v), stroke: c, 'stroke-opacity': .22, 'stroke-dasharray': '2 4' })); svg.appendChild(E('text', { x: x1, y: sy(v) - 2, fill: c, 'font-size': 7, 'text-anchor': 'end', 'opacity': .6 }, v)); }
    });
    svg.appendChild(E('line', { x1: x0, y1: sy(0), x2: x1, y2: sy(0), stroke: '#4e7a99', 'stroke-width': 1 }));
    for (var gv = Math.ceil(vmin / 10) * 10; gv <= vmax; gv += 10) svg.appendChild(E('text', { x: x0 - 5, y: sy(gv) + 3, fill: '#4e7a99', 'font-size': 7.5, 'text-anchor': 'end' }, gv));
    ord.forEach(function (d, i) {
      if (!d) return;
      var cx = x0 + step * (i + 0.5), c = DECCOL[d.decision] || '#f5c240';
      var yv = sy(+d.total_score || 0), y0l = sy(0);
      var cp = (d.chg_pct_1d == null ? null : d.chg_pct_1d);
      var ca = (d.chg_abs_vnd == null ? null : d.chg_abs_vnd);
      var absVnd = ca == null ? '' : (ca > 0 ? '+' : '') + ca.toLocaleString('vi-VN') + 'đ';
      var pctStr = cp == null ? '' : (cp > 0 ? '+' : '') + cp + '%';
      var g = E('g', { class: 'barG' });
      g.appendChild(E('title', {}, d.symbol + ' · total ' + d.total_score + ' · fund ' + d.fund_score + ' · ' + d.decision + (cp == null ? '' : '\nNgày: ' + pctStr + ' (' + absVnd + ')')));
      g.appendChild(E('rect', { x: cx - bw / 2, y: Math.min(yv, y0l), width: bw, height: Math.abs(yv - y0l), fill: c, 'fill-opacity': .85, rx: 1 }));
      g.appendChild(E('text', { x: cx, y: y0 + 11, fill: '#c8dcea', 'font-size': 8, 'text-anchor': 'middle', 'font-weight': 700 }, d.symbol));
      var cc = (cp == null ? '#4e7a99' : cp >= 0 ? '#34c26e' : '#e86030');
      if (cp != null) {
        g.appendChild(E('text', { x: cx, y: y0 + 22, fill: cc, 'font-size': 7.5, 'text-anchor': 'middle', 'font-weight': 700 }, pctStr));
        g.appendChild(E('text', { x: cx, y: y0 + 31, fill: cc, 'font-size': 6.5, 'text-anchor': 'middle', 'opacity': .85 }, absVnd));
      }
      g.onclick = function () { openSymbol(d.symbol); };
      svg.appendChild(g);
    });
    function meanLine(arr, i0, i1, label) { if (!arr.length) return; var mean = arr.reduce(function (s, d) { return s + (+d.total_score || 0); }, 0) / arr.length; var xA = x0 + step * i0, xB = x0 + step * i1; svg.appendChild(E('line', { x1: xA, y1: sy(mean), x2: xB, y2: sy(mean), stroke: '#c8dcea', 'stroke-dasharray': '5 3', 'stroke-width': 1.3, 'stroke-opacity': .7 })); svg.appendChild(E('text', { x: (xA + xB) / 2, y: sy(mean) - 4, fill: '#c8dcea', 'font-size': 8, 'text-anchor': 'middle', 'font-weight': 700 }, label + ' TB ' + mean.toFixed(1))); }
    meanLine(G, 0, G.length, 'GAINER');
    meanLine(L, G.length + 1, n, 'LOSER');
    if (G.length && L.length) { var divx = x0 + step * (G.length + 0.5); svg.appendChild(E('line', { x1: divx, y1: y1, x2: divx, y2: y0, stroke: '#244060', 'stroke-dasharray': '2 4' })); }
    function fundLine(arr, i0) { if (!arr.length) return; var pts = arr.map(function (d, k) { return [x0 + step * (i0 + k + 0.5), sy(+d.fund_score || 0)]; }); var path = ''; pts.forEach(function (p, k) { path += (k ? 'L' : 'M') + p[0] + ' ' + p[1] + ' '; }); svg.appendChild(E('path', { d: path, fill: 'none', stroke: '#14b8d4', 'stroke-width': 1.8, 'stroke-opacity': .9 })); pts.forEach(function (p) { svg.appendChild(E('circle', { cx: p[0], cy: p[1], r: 2.5, fill: '#14b8d4' })); }); }
    fundLine(G, 0); fundLine(L, G.length + 1);
    var LG = document.getElementById('glLegend');
    if (LG) { Object.keys(DECCOL).forEach(function (k) { LG.insertAdjacentHTML('beforeend', '<span class="lg"><span class="sq" style="background:' + DECCOL[k] + '"></span>' + k + '</span>'); }); LG.insertAdjacentHTML('beforeend', '<span class="lg"><span class="sq" style="background:#14b8d4"></span>fund_score (đường)</span><span class="lg" style="color:#c8dcea">- - TB total nhóm</span>'); }
    var note = document.getElementById('glNote');
    if (note) { var gm = G.length ? G.reduce(function (s, d) { return s + (+d.total_score || 0); }, 0) / G.length : 0; var lm = L.length ? L.reduce(function (s, d) { return s + (+d.total_score || 0); }, 0) / L.length : 0; note.innerHTML = '<b>Cột</b> = total_score (màu theo decision) · dưới mỗi cột là <b>%± ngày</b> và <b>±VND</b>. <b>Đường xanh</b> = fund_score · <b>nét đứt</b> = TB total nhóm. GAINER TB ' + gm.toFixed(1) + ' vs LOSER TB ' + lm.toFixed(1) + ' → chiều giá ≠ điểm mô hình.'; }
  }

  window.renderCharts = function (data) {
    var d = (data && data.length) ? data : [];
    buildQuad(d);
    buildGL(d);
  };

  window.renderCharts(ALL_DATA);
})();
</script>
</body>
